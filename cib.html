<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Campaign Map - CIB</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700;900&family=Merriweather:wght@300;400;700&display=swap" rel="stylesheet">
    <style>
        body { margin:0; padding:0; overflow:hidden; background:#1a1410; }
        .map-container { display:flex; width:100vw; height:100vh; }
        .map-area {
            flex:1; position:relative; overflow:auto;
            display:flex; align-items:center; justify-content:center;
            background:#1a1410; padding:20px;
        }
        .map-wrapper { position:relative; display:inline-block; }
        .map-image {
            max-width:90vw; max-height:90vh; display:block;
            box-shadow:0 10px 40px rgba(0,0,0,0.5);
            border:3px solid #d4af37; border-radius:8px;
            -webkit-user-select:none; user-select:none;
        }
        #overlayCanvas, #interactiveCanvas {
            position:absolute; top:0; left:0; border-radius:8px;
        }
        #overlayCanvas { pointer-events:none; }
        #interactiveCanvas { cursor:crosshair; }
        .info-panel {
            width:350px;
            background:linear-gradient(135deg,rgba(245,241,232,0.98),rgba(232,220,196,0.98));
            backdrop-filter:blur(10px);
            box-shadow:-5px 0 20px rgba(0,0,0,0.3);
            padding:30px; overflow-y:auto; border-left:3px solid #d4af37;
        }
        .info-panel.empty {
            display:flex; align-items:center; justify-content:center;
            color:#8a7a5f; font-style:italic;
        }
        .info-panel h2 {
            font-family:'Cinzel',serif; font-size:2rem; color:#5a4a2f;
            margin-bottom:20px; padding-bottom:15px; border-bottom:2px solid #d4af37;
        }
        .info-content { font-size:1.1rem; color:#4a3a25; line-height:1.8; }
        .region-details { margin-top:20px; }
        .detail-row {
            display:flex; justify-content:space-between; align-items:center;
            padding:12px 0; border-bottom:1px solid rgba(212,175,55,0.2);
        }
        .detail-row:last-child { border-bottom:none; }
        .detail-label { font-weight:600; color:#5a4a2f; font-size:0.95rem; }
        .detail-value { color:#6a5a3f; font-size:0.95rem; font-style:italic; }
        .back-button {
            position:absolute; top:20px; left:20px;
            background:linear-gradient(135deg,#d4af37,#b8962e);
            color:white; padding:12px 25px; border:none; border-radius:8px;
            font-family:'Cinzel',serif; font-size:1rem; cursor:pointer;
            box-shadow:0 4px 15px rgba(0,0,0,0.3); transition:all 0.3s ease;
            z-index:1000; text-decoration:none; display:inline-block;
        }
        .back-button:hover {
            background:linear-gradient(135deg,#b8962e,#d4af37);
            transform:translateY(-2px); box-shadow:0 6px 20px rgba(0,0,0,0.4);
        }
    </style>
</head>
<body>
    <a href="index.html" class="back-button">&#8592; Back to Home</a>
    <div class="map-container">
        <div class="map-area">
            <div class="map-wrapper" id="mapWrapper">
                <img src="background_cib_scaled.jpg" alt="CIB Campaign Map" class="map-image" id="mapImage">
                <canvas id="overlayCanvas"></canvas>
                <canvas id="interactiveCanvas"></canvas>
            </div>
        </div>
        <div class="info-panel empty" id="infoPanel">
            <p>Click on a region to view information</p>
        </div>
    </div>

const MAP_W = 954;
const MAP_H = 1063;

// Decode row data from base64 binary
function decodeRowData(b64) {
    const bin = atob(b64);
    const buf = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) buf[i] = bin.charCodeAt(i);
    const view = new DataView(buf.buffer);
    let pos = 0;
    const H = view.getUint16(pos, true); pos += 2;
    const rows = new Array(H);
    for (let y = 0; y < H; y++) {
        const n = view.getUint8(pos); pos++;
        const row = new Uint16Array(n * 3);
        for (let i = 0; i < n; i++) {
            row[i*3]   = view.getUint16(pos, true); pos += 2; // x_start
            row[i*3+1] = view.getUint16(pos, true); pos += 2; // x_end
            row[i*3+2] = view.getUint8(pos);         pos++;    // hex_idx
        }
        rows[y] = row;
    }
    return rows;
}

// Pre-build per-region run index: regionRuns[hexIdx] = [y,xs,xe, y,xs,xe, ...]
function buildRegionIndex(rows) {
    const regionRuns = new Array(HEX_LIST.length).fill(null).map(() => []);
    for (let y = 0; y < rows.length; y++) {
        const row = rows[y];
        for (let i = 0; i < row.length; i += 3) {
            regionRuns[row[i+2]].push(y, row[i], row[i+1]);
        }
    }
    return regionRuns;
}

let ROWS = null;
let REGION_RUNS = null;

// Decode on load (synchronous, no image needed)
try {
    ROWS = decodeRowData(ROW_DATA_B64);
    REGION_RUNS = buildRegionIndex(ROWS);
    console.log("Region data decoded: " + ROWS.length + " rows, " + HEX_LIST.length + " regions");
} catch(e) {
    console.error("Failed to decode region data:", e);
}

const mapImage = document.getElementById("mapImage");
const overlayCanvas = document.getElementById("overlayCanvas");
const interactiveCanvas = document.getElementById("interactiveCanvas");
const infoPanel = document.getElementById("infoPanel");

let currentHoverIdx = -1;
let currentSelectedIdx = -1;

function resizeCanvases() {
    const w = mapImage.offsetWidth;
    const h = mapImage.offsetHeight;
    if (w === 0 || h === 0) return;
    overlayCanvas.width = w; overlayCanvas.height = h;
    overlayCanvas.style.width = w + "px"; overlayCanvas.style.height = h + "px";
    interactiveCanvas.width = w; interactiveCanvas.height = h;
    interactiveCanvas.style.width = w + "px"; interactiveCanvas.style.height = h + "px";
    if (currentSelectedIdx >= 0) drawHighlight(currentSelectedIdx, true);
}

function toLookupCoords(cx, cy) {
    return {
        x: Math.round(cx * MAP_W / interactiveCanvas.width),
        y: Math.round(cy * MAP_H / interactiveCanvas.height)
    };
}

function getRegionIdxAt(x, y) {
    if (!ROWS || y < 0 || y >= ROWS.length) return -1;
    const row = ROWS[y];
    for (let i = 0; i < row.length; i += 3) {
        if (x >= row[i] && x <= row[i+1]) return row[i+2];
    }
    return -1;
}

function drawHighlight(hexIdx, isSelected) {
    const ctx = overlayCanvas.getContext("2d");
    ctx.clearRect(0, 0, overlayCanvas.width, overlayCanvas.height);
    if (hexIdx < 0 || !REGION_RUNS) return;

    const scaleX = overlayCanvas.width / MAP_W;
    const scaleY = overlayCanvas.height / MAP_H;
    const runs = REGION_RUNS[hexIdx];

    if (isSelected) {
        // Gold glow pass
        ctx.fillStyle = "rgba(212,175,55,0.25)";
        for (let i = 0; i < runs.length; i += 3) {
            const y = runs[i], xs = runs[i+1], xe = runs[i+2];
            const rx = xs * scaleX, ry = y * scaleY;
            const rw = (xe - xs + 1) * scaleX + 2;
            const rh = scaleY + 1;
            ctx.fillRect(rx - 1, ry - 1, rw + 2, rh + 2);
        }
        // Solid gold fill
        ctx.fillStyle = "rgba(212,175,55,0.5)";
    } else {
        ctx.fillStyle = "rgba(255,255,255,0.35)";
    }
    for (let i = 0; i < runs.length; i += 3) {
        const y = runs[i], xs = runs[i+1], xe = runs[i+2];
        ctx.fillRect(xs * scaleX, y * scaleY, (xe - xs + 1) * scaleX, scaleY + 0.5);
    }

    if (isSelected) {
        // Border outline
        ctx.strokeStyle = "rgba(212,175,55,0.9)";
        ctx.lineWidth = 1;
        for (let i = 0; i < runs.length; i += 3) {
            const y = runs[i], xs = runs[i+1], xe = runs[i+2];
            ctx.strokeRect(xs * scaleX, y * scaleY, (xe - xs + 1) * scaleX, scaleY);
        }
    }
}

function showRegionInfo(hexIdx) {
    const hex = HEX_LIST[hexIdx];
    const region = COLOR_MAP[hex];
    if (!region) return;
    infoPanel.classList.remove("empty");
    infoPanel.innerHTML = \`
        <h2>\${region.name}</h2>
        <div class="info-content">
            <div style="margin-bottom:20px;">
                <div style="display:flex;align-items:center;gap:10px;">
                    <span style="display:inline-block;width:40px;height:40px;background:#\${hex};border:2px solid #8b7355;border-radius:4px;"></span>
                    <span style="font-family:monospace;font-size:1.1rem;">#\${hex}</span>
                </div>
            </div>
            <div class="region-details">
                <div class="detail-row">
                    <span class="detail-label">Region Key:</span>
                    <span class="detail-value">\${region.key}</span>
                </div>
                <div class="detail-row">
                    <span class="detail-label">Sea Region:</span>
                    <span class="detail-value">\${region.sea ? "Yes" : "No"}</span>
                </div>
            </div>
        </div>
    \`;
}

function clearInfoPanel() {
    infoPanel.classList.add("empty");
    infoPanel.innerHTML = "<p>Click on a region to view information</p>";
}

interactiveCanvas.addEventListener("mousemove", function(e) {
    if (!ROWS) return;
    const rect = interactiveCanvas.getBoundingClientRect();
    const {x, y} = toLookupCoords(e.clientX - rect.left, e.clientY - rect.top);
    const idx = getRegionIdxAt(x, y);

    if (idx < 0) {
        interactiveCanvas.style.cursor = "default";
        if (currentHoverIdx !== -1) {
            currentHoverIdx = -1;
            if (currentSelectedIdx >= 0) drawHighlight(currentSelectedIdx, true);
            else overlayCanvas.getContext("2d").clearRect(0, 0, overlayCanvas.width, overlayCanvas.height);
        }
        return;
    }

    interactiveCanvas.style.cursor = "pointer";
    if (currentHoverIdx !== idx) {
        currentHoverIdx = idx;
        if (currentSelectedIdx >= 0 && currentSelectedIdx !== idx) {
            drawHighlight(currentSelectedIdx, true);
            // Draw hover on top
            const ctx = overlayCanvas.getContext("2d");
            const scaleX = overlayCanvas.width / MAP_W;
            const scaleY = overlayCanvas.height / MAP_H;
            const runs = REGION_RUNS[idx];
            ctx.fillStyle = "rgba(255,255,255,0.25)";
            for (let i = 0; i < runs.length; i += 3) {
                const ry = runs[i], xs = runs[i+1], xe = runs[i+2];
                ctx.fillRect(xs * scaleX, ry * scaleY, (xe - xs + 1) * scaleX, scaleY + 0.5);
            }
        } else if (currentSelectedIdx !== idx) {
            drawHighlight(idx, false);
        }
    }
});

interactiveCanvas.addEventListener("mouseleave", function() {
    currentHoverIdx = -1;
    if (currentSelectedIdx >= 0) drawHighlight(currentSelectedIdx, true);
    else overlayCanvas.getContext("2d").clearRect(0, 0, overlayCanvas.width, overlayCanvas.height);
});

interactiveCanvas.addEventListener("click", function(e) {
    if (!ROWS) return;
    const rect = interactiveCanvas.getBoundingClientRect();
    const {x, y} = toLookupCoords(e.clientX - rect.left, e.clientY - rect.top);
    const idx = getRegionIdxAt(x, y);

    if (idx < 0) {
        currentSelectedIdx = -1;
        drawHighlight(-1, false);
        clearInfoPanel();
        return;
    }
    if (currentSelectedIdx === idx) {
        currentSelectedIdx = -1;
        clearInfoPanel();
        drawHighlight(-1, false);
    } else {
        currentSelectedIdx = idx;
        drawHighlight(idx, true);
        showRegionInfo(idx);
    }
});

window.addEventListener("resize", function() { resizeCanvases(); });
mapImage.addEventListener("load", resizeCanvases);
if (mapImage.complete && mapImage.naturalWidth > 0) resizeCanvases();
