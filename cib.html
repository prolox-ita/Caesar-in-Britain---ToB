<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Campaign Map - CIB</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700;900&family=Merriweather:wght@300;400;700&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background: #1a1410;
        }

        .map-container {
            display: flex;
            width: 100vw;
            height: 100vh;
            position: relative;
        }

        .map-area {
            flex: 1;
            position: relative;
            overflow: auto;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #1a1410;
            padding: 20px;
        }

        .map-wrapper {
            position: relative;
            display: inline-block;
        }

        .map-image {
            max-width: 90vw;
            max-height: 90vh;
            display: block;
            box-shadow: 0 10px 40px rgba(0,0,0,0.5);
            border: 3px solid #d4af37;
            border-radius: 8px;
            -webkit-user-select: none;
            user-select: none;
        }

        #overlayCanvas, #interactiveCanvas {
            position: absolute;
            top: 0;
            left: 0;
            border-radius: 8px;
        }

        #overlayCanvas {
            pointer-events: none;
        }

        #interactiveCanvas {
            cursor: crosshair;
        }

        .info-panel {
            width: 350px;
            background: linear-gradient(135deg, rgba(245,241,232,0.98), rgba(232,220,196,0.98));
            backdrop-filter: blur(10px);
            box-shadow: -5px 0 20px rgba(0,0,0,0.3);
            padding: 30px;
            overflow-y: auto;
            border-left: 3px solid #d4af37;
        }

        .info-panel.empty {
            display: flex;
            align-items: center;
            justify-content: center;
            color: #8a7a5f;
            font-style: italic;
        }

        .info-panel h2 {
            font-family: 'Cinzel', serif;
            font-size: 2rem;
            color: #5a4a2f;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 2px solid #d4af37;
        }

        .info-content {
            font-size: 1.1rem;
            color: #4a3a25;
            line-height: 1.8;
        }

        .region-details {
            margin-top: 20px;
        }

        .detail-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 0;
            border-bottom: 1px solid rgba(212,175,55,0.2);
        }

        .detail-row:last-child {
            border-bottom: none;
        }

        .detail-label {
            font-weight: 600;
            color: #5a4a2f;
            font-size: 0.95rem;
        }

        .detail-value {
            color: #6a5a3f;
            font-size: 0.95rem;
            font-style: italic;
        }

        .back-button {
            position: absolute;
            top: 20px;
            left: 20px;
            background: linear-gradient(135deg, #d4af37, #b8962e);
            color: white;
            padding: 12px 25px;
            border: none;
            border-radius: 8px;
            font-family: 'Cinzel', serif;
            font-size: 1rem;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            transition: all 0.3s ease;
            z-index: 1000;
            text-decoration: none;
            display: inline-block;
        }

        .back-button:hover {
            background: linear-gradient(135deg, #b8962e, #d4af37);
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0,0,0,0.4);
        }

        .loading-overlay {
            position: absolute;
            inset: 0;
            background: rgba(26,20,16,0.85);
            display: flex;
            align-items: center;
            justify-content: center;
            color: #d4af37;
            font-family: 'Cinzel', serif;
            font-size: 1.2rem;
            z-index: 999;
            border-radius: 8px;
        }
    </style>
</head>

<body>
    <a href="index.html" class="back-button">&#8592; Back to Home</a>

    <div class="map-container">
        <div class="map-area">
            <div class="map-wrapper" id="mapWrapper">
                <img src="background_cib_scaled.jpg" alt="CIB Campaign Map" class="map-image" id="mapImage">
                <canvas id="overlayCanvas"></canvas>
                <canvas id="interactiveCanvas"></canvas>
                <div class="loading-overlay" id="loadingOverlay">Loading map regions...</div>
            </div>
        </div>
        <div class="info-panel empty" id="infoPanel">
            <p>Click on a region to view information</p>
        </div>
    </div>

    lookupImg.onload = function() {
        lookupCtx.drawImage(lookupImg, 0, 0, MAP_W, MAP_H);
        lookupImageData = lookupCtx.getImageData(0, 0, MAP_W, MAP_H);
        loadingOverlay.style.display = 'none';
        resizeCanvases();
        console.log('Lookup map loaded, ' + MAP_W + 'x' + MAP_H + ' pixels');
    };
    lookupImg.onerror = function() {
        loadingOverlay.textContent = 'Error loading lookup_map.png';
    };

    // Resize overlay and interactive canvases to match displayed image
    function resizeCanvases() {
        const w = mapImage.offsetWidth;
        const h = mapImage.offsetHeight;
        overlayCanvas.width = w;
        overlayCanvas.height = h;
        overlayCanvas.style.width = w + 'px';
        overlayCanvas.style.height = h + 'px';
        interactiveCanvas.width = w;
        interactiveCanvas.height = h;
        interactiveCanvas.style.width = w + 'px';
        interactiveCanvas.style.height = h + 'px';
        // Redraw highlight if any region is selected
        if (currentSelectedKey) {
            drawHighlight(currentSelectedKey, true);
        }
    }

    window.addEventListener('resize', function() {
        if (lookupImageData) resizeCanvases();
    });

    // Convert mouse coords (relative to interactiveCanvas) to lookup image coords
    function toLookupCoords(canvasX, canvasY) {
        const scaleX = MAP_W / interactiveCanvas.width;
        const scaleY = MAP_H / interactiveCanvas.height;
        return {
            x: Math.round(canvasX * scaleX),
            y: Math.round(canvasY * scaleY)
        };
    }

    // Get the hex color of a pixel in the lookup image
    function getPixelHex(lx, ly) {
        if (!lookupImageData || lx < 0 || ly < 0 || lx >= MAP_W || ly >= MAP_H) return null;
        const idx = (ly * MAP_W + lx) * 4;
        const d = lookupImageData.data;
        const r = d[idx].toString(16).padStart(2, '0').toUpperCase();
        const g = d[idx+1].toString(16).padStart(2, '0').toUpperCase();
        const b = d[idx+2].toString(16).padStart(2, '0').toUpperCase();
        return r + g + b;
    }

    // Build (and cache) pixel indices for a given hex color region
    function getRegionPixels(hexColor) {
        if (regionPixelCache[hexColor]) return regionPixelCache[hexColor];
        const d = lookupImageData.data;
        const total = MAP_W * MAP_H;
        const hex = hexColor;
        const tr = parseInt(hex.slice(0,2), 16);
        const tg = parseInt(hex.slice(2,4), 16);
        const tb = parseInt(hex.slice(4,6), 16);
        // Build flat list of {x,y} scaled to overlay canvas
        const pixels = [];
        for (let i = 0; i < total; i++) {
            const idx = i * 4;
            if (d[idx] === tr && d[idx+1] === tg && d[idx+2] === tb) {
                pixels.push(i); // store flat index in lookup space
            }
        }
        regionPixelCache[hexColor] = pixels;
        return pixels;
    }

    // Draw a highlight for a region on the overlay canvas
    function drawHighlight(hexColor, isSelected) {
        const overlayCtx = overlayCanvas.getContext('2d');
        overlayCtx.clearRect(0, 0, overlayCanvas.width, overlayCanvas.height);
        if (!hexColor || !lookupImageData) return;

        const pixels = getRegionPixels(hexColor);
        if (pixels.length === 0) return;

        // Create ImageData for the overlay canvas
        const ow = overlayCanvas.width;
        const oh = overlayCanvas.height;
        const scaleX = ow / MAP_W;
        const scaleY = oh / MAP_H;

        // Use offscreen canvas at lookup resolution, then scale to overlay
        const offCanvas = document.createElement('canvas');
        offCanvas.width = MAP_W;
        offCanvas.height = MAP_H;
        const offCtx = offCanvas.getContext('2d');
        const offData = offCtx.createImageData(MAP_W, MAP_H);
        const od = offData.data;

        // Fill color for highlight
        let hr, hg, hb, ha;
        if (isSelected) {
            hr = 212; hg = 175; hb = 55; ha = 140; // gold
        } else {
            hr = 255; hg = 255; hb = 255; ha = 90;  // white hover
        }

        for (const i of pixels) {
            const idx = i * 4;
            od[idx]   = hr;
            od[idx+1] = hg;
            od[idx+2] = hb;
            od[idx+3] = ha;
        }

        offCtx.putImageData(offData, 0, 0);

        // Scale to overlay canvas
        overlayCtx.drawImage(offCanvas, 0, 0, ow, oh);

        // Draw border outline: draw a slightly darker stroke around the region
        if (isSelected) {
            overlayCtx.globalCompositeOperation = 'source-over';
            // second pass: draw a glow border
            const offCanvas2 = document.createElement('canvas');
            offCanvas2.width = MAP_W;
            offCanvas2.height = MAP_H;
            const offCtx2 = offCanvas2.getContext('2d');
            offCtx2.putImageData(offData, 0, 0);
            // Draw scaled with slight blur for glow
            overlayCtx.filter = 'blur(3px) brightness(1.5)';
            overlayCtx.globalAlpha = 0.6;
            overlayCtx.drawImage(offCanvas2, 0, 0, ow, oh);
            overlayCtx.filter = 'none';
            overlayCtx.globalAlpha = 1.0;
            // Re-draw the solid highlight on top
            overlayCtx.drawImage(offCanvas, 0, 0, ow, oh);
        }
    }

    // Show region info in the panel
    function showRegionInfo(hexColor, region) {
        infoPanel.classList.remove('empty');
        const formatVal = v => (v === null || v === undefined) ? '&#8212;' : (typeof v === 'boolean' ? (v ? 'Yes' : 'No') : v);
        infoPanel.innerHTML = \`
            <h2>\${region.name}</h2>
            <div class="info-content">
                <div style="margin-bottom:20px;">
                    <div style="display:flex;align-items:center;gap:10px;">
                        <span style="display:inline-block;width:40px;height:40px;background:#\${hexColor};border:2px solid #8b7355;border-radius:4px;"></span>
                        <span style="font-family:monospace;font-size:1.1rem;">#\${hexColor}</span>
                    </div>
                </div>
                <div class="region-details">
                    <div class="detail-row">
                        <span class="detail-label">Region Key:</span>
                        <span class="detail-value">\${formatVal(region.key)}</span>
                    </div>
                    <div class="detail-row">
                        <span class="detail-label">Sea Region:</span>
                        <span class="detail-value">\${region.sea ? 'Yes' : 'No'}</span>
                    </div>
                </div>
            </div>
        \`;
    }

    function clearInfoPanel() {
        infoPanel.classList.add('empty');
        infoPanel.innerHTML = '<p>Click on a region to view information</p>';
    }

    // Mouse move: hover highlight
    interactiveCanvas.addEventListener('mousemove', function(e) {
        if (!lookupImageData) return;
        const rect = interactiveCanvas.getBoundingClientRect();
        const cx = e.clientX - rect.left;
        const cy = e.clientY - rect.top;
        const {x, y} = toLookupCoords(cx, cy);
        const hex = getPixelHex(x, y);
        const region = hex ? COLOR_MAP[hex] : null;

        if (!region) {
            interactiveCanvas.style.cursor = 'default';
            if (currentHoverKey !== null) {
                currentHoverKey = null;
                // Redraw selected if any, else clear
                if (currentSelectedKey) {
                    drawHighlight(currentSelectedKey, true);
                } else {
                    overlayCanvas.getContext('2d').clearRect(0, 0, overlayCanvas.width, overlayCanvas.height);
                }
            }
            return;
        }

        interactiveCanvas.style.cursor = 'pointer';

        if (currentHoverKey !== hex) {
            currentHoverKey = hex;
            if (currentSelectedKey && currentSelectedKey === hex) {
                drawHighlight(hex, true); // already selected
            } else if (currentSelectedKey) {
                // Show selected + hover
                drawHighlight(currentSelectedKey, true);
                // Draw hover on top if different region
                if (currentSelectedKey !== hex) {
                    const overlayCtx = overlayCanvas.getContext('2d');
                    const hoverPixels = getRegionPixels(hex);
                    const ow = overlayCanvas.width;
                    const oh = overlayCanvas.height;
                    const offC = document.createElement('canvas');
                    offC.width = MAP_W; offC.height = MAP_H;
                    const offX = offC.getContext('2d');
                    const imgD = offX.createImageData(MAP_W, MAP_H);
                    for (const i of hoverPixels) {
                        imgD.data[i*4]   = 255;
                        imgD.data[i*4+1] = 255;
                        imgD.data[i*4+2] = 255;
                        imgD.data[i*4+3] = 80;
                    }
                    offX.putImageData(imgD, 0, 0);
                    overlayCtx.drawImage(offC, 0, 0, ow, oh);
                }
            } else {
                drawHighlight(hex, false);
            }
        }
    });

    interactiveCanvas.addEventListener('mouseleave', function() {
        currentHoverKey = null;
        if (currentSelectedKey) {
            drawHighlight(currentSelectedKey, true);
        } else {
            overlayCanvas.getContext('2d').clearRect(0, 0, overlayCanvas.width, overlayCanvas.height);
        }
    });

    // Click: select region
    interactiveCanvas.addEventListener('click', function(e) {
        if (!lookupImageData) return;
        const rect = interactiveCanvas.getBoundingClientRect();
        const cx = e.clientX - rect.left;
        const cy = e.clientY - rect.top;
        const {x, y} = toLookupCoords(cx, cy);
        const hex = getPixelHex(x, y);
        const region = hex ? COLOR_MAP[hex] : null;

        if (!region) {
            currentSelectedKey = null;
            drawHighlight(null, false);
            clearInfoPanel();
            return;
        }

        if (currentSelectedKey === hex) {
            // Deselect
            currentSelectedKey = null;
            clearInfoPanel();
            drawHighlight(null, false);
        } else {
            currentSelectedKey = hex;
            drawHighlight(hex, true);
            showRegionInfo(hex, region);
        }
    });

    // Initialize canvases once background image loads
    mapImage.onload = function() {
        resizeCanvases();
    };
    if (mapImage.complete) {
        resizeCanvases();
    }
    </script>
</body>
</html>
