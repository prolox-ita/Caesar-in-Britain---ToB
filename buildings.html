<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buildings — MK1212 CIB</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: #e8d9b0;
            color: #1a1008;
            font-size: 13px;
        }

        #app { max-width: 1400px; margin: 0 auto; padding: 0 16px 60px; }

        header {
            padding: 14px 0 10px;
            border-bottom: 2px solid #b89848;
            margin-bottom: 0;
            display: flex; align-items: baseline; gap: 12px;
        }
        header h1 { font-family:'Cinzel',serif; font-size:1.3rem; color:#5a3800; }
        header span { font-size:.75rem; color:#9a7a40; }

        /* ── Filter bar ── */
        .filter-bar {
            position: sticky; top: 0; z-index: 100;
            background: rgba(232,217,176,0.97);
            border-bottom: 1px solid #c8a848;
            padding: 7px 0;
            backdrop-filter: blur(4px);
            display: flex; flex-wrap: wrap; gap: 6px; align-items: center;
        }
        .fl { font-size:.65rem; font-weight:700; color:#9a7a40; text-transform:uppercase; letter-spacing:.08em; }
        .sep { width:1px; height:18px; background:#c8a848; margin:0 4px; }

        button {
            padding: 3px 11px; border-radius:3px;
            border: 1px solid #c8a848; background: #f0e4c0;
            color: #6a4a18; font-size:.72rem; font-weight:600;
            cursor: pointer; transition: all .1s;
        }
        button:hover { background:#e8d49c; border-color:#a07830; }
        button.active { background:#c8a030; border-color:#a07820; color:#fff; }
        .cb { opacity:.5; }
        .cb:hover { opacity:.8; }
        .cb.active { opacity:1; }

        /* ── Category section ── */
        .cat-section { margin-top: 14px; }
        .cat-header {
            padding: 5px 10px; margin-bottom: 8px;
            border-radius: 3px; display:flex; align-items:center; gap:8px;
        }
        .cat-header span { font-family:'Cinzel',serif; font-size:.82rem; font-weight:700; letter-spacing:.1em; text-transform:uppercase; color:#fff; }
        .cat-header small { font-size:.68rem; color:rgba(255,255,255,0.55); }

        .import-lbl { padding:3px 11px; border-radius:3px; border:1px solid #c8a848; background:#f0e4c0; color:#6a4a18; font-size:.72rem; font-weight:600; cursor:pointer; transition:all .1s; }
        .import-lbl:hover { background:#e8d49c; border-color:#a07830; }
        .move-sel {
            font-size:.65rem; font-family:inherit; padding:2px 5px;
            border:1px solid #c8a848; border-radius:3px; background:#f0e4c0;
            color:#6a4a18; cursor:pointer;
        }

        /* ── 2-column grid ── */
        .cards { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }

        /* ── Card ── */
        .card {
            background: #f5ead0;
            border: 1px solid #c8a848;
            border-radius: 4px;
            padding: 8px 10px;
        }

        .card-head {
            display: flex; justify-content:space-between; align-items:flex-start;
            gap: 6px; margin-bottom: 7px;
        }
        .card-title {
            font-size:.78rem; font-weight:700; color:#3a2000;
            text-transform:uppercase; letter-spacing:.05em;
        }
        .card-note { font-size:.65rem; color:#9a7a40; font-style:italic; margin-top:2px; }

        /* Culture squares 2×3 */
        .csq-grid { display:grid; grid-template-columns:1fr 1fr; grid-template-rows:repeat(3,1fr); gap:2px; flex-shrink:0; }

        /* ── Chain — linear ── */
        .chain.linear { display:flex; align-items:center; flex-wrap:nowrap; gap:0; overflow-x:auto; }

        /* ── Chain — fork layout ── */
        .chain.branch { display:flex; align-items:stretch; flex-wrap:nowrap; gap:0; overflow-x:auto; }

        /* Pre-nodes (root, before fork) */
        .chain-pre { display:flex; align-items:center; align-self:center; flex-shrink:0; flex-wrap:nowrap; }

        /* Vertical fork bar (blue top half → orange bottom half) */
        .fork-vbar {
            width:2px; flex-shrink:0;
            background:linear-gradient(to bottom, #5888c8 50%, #c87820 50%);
            margin:13px 0;
        }

        /* Stack of branch arms */
        .chain-arms { display:flex; flex-direction:column; gap:5px; align-self:center; }

        /* Single arm row */
        .chain-arm { display:flex; align-items:center; flex-wrap:wrap; gap:0; position:relative; padding-left:14px; }

        /* Horizontal tick from fork bar to arm */
        .arm-a.chain-arm::before {
            content:''; position:absolute; left:0; top:50%;
            width:12px; height:2px; background:#5888c8; transform:translateY(-50%);
        }
        .arm-b.chain-arm::before {
            content:''; position:absolute; left:0; top:50%;
            width:12px; height:2px; background:#c87820; transform:translateY(-50%);
        }

        /* Node — fixed width so T-levels align across arm-a / arm-b */
        .cn {
            display:inline-flex; flex-direction:column; align-items:center; justify-content:flex-start;
            background:#e8dab8; border:1px solid #b89840;
            border-radius:4px; padding:5px 6px;
            font-size:.78rem; color:#2a1800;
            width:108px; flex:0 0 108px;
            line-height:1.25; cursor:default; user-select:none;
        }
        .cn-main { text-align:center; white-space:normal; word-break:break-word; width:100%; }
        .cn.ph { opacity:.35; font-style:italic; }
        .cn[data-bid]:hover { border-color:#a07020; }

        /* Note inside node */
        .cn-note { font-size:.58rem; color:#7a5820; font-style:italic; line-height:1.2;
                   margin-top:2px; text-align:center; width:100%; display:block; }
        .cn-note:empty { display:none; }
        .cn-note-btn { font-size:.55rem; color:#a08040; cursor:pointer; opacity:0;
                       margin-top:1px; line-height:1; display:block; user-select:none; }
        .cn:hover .cn-note-btn { opacity:.6; }
        .cn-note-btn:hover { opacity:1 !important; color:#5a3800; }

        /* Inline note edit */
        .cn-note-edit {
            width:100%; font-size:.58rem; font-family:inherit; font-style:italic;
            background:#fffae0; border:1px solid #c8a030; border-radius:2px;
            padding:1px 3px; outline:none; margin-top:2px; text-align:center;
        }

        /* Inline name edit input */
        .cn-edit {
            display:inline-flex; align-items:center;
            background:#fffae8; border:2px solid #c8a030;
            border-radius:4px; padding:5px 13px;
            font-size:.82rem; color:#2a1800;
            font-family:inherit; outline:none;
            min-width:60px; max-width:200px;
            vertical-align:middle;
        }

        /* Tinted nodes per branch */
        .arm-a .cn { background:#dae8f8; border-color:#5888c8; color:#0a1e40; }
        .arm-a .cn-note { color:#2a5080; }
        .arm-b .cn { background:#f8ead8; border-color:#c87820; color:#3a1800; }
        .arm-b .cn-note { color:#7a4010; }

        /* Arrow — fixed width to keep column rhythm */
        .ar { color:#a08040; font-size:.9rem; flex:0 0 22px; text-align:center; flex-shrink:0; }
        .arm-a .ar { color:#5888c8; }
        .arm-b .ar { color:#c87820; }

        /* Inline note after last node */
        .bnote {
            font-size:.65rem; color:#8a6a30; font-style:italic;
            margin-left:6px; white-space:normal; line-height:1.3;
        }

        /* Sub-labels for complex chains */
        .sub-lbl {
            font-size:.65rem; color:#7a5a28; font-style:italic;
            white-space:nowrap; margin-right:5px;
        }

        /* Footer note */
        .fnote { font-size:.65rem; color:#8a6a30; font-style:italic; margin-top:4px; line-height:1.4; }

        /* Culture squares — now interactive */
        .csq { width:18px; height:18px; border-radius:2px; border:1px solid rgba(0,0,0,0.2); cursor:pointer; transition:transform .1s,opacity .1s; }
        .csq:hover { opacity:.75; transform:scale(1.2); }
        .csq.off { background:rgba(0,0,0,0.08); border-color:rgba(0,0,0,0.12); }
        .csq-grid { gap:3px; }

        /* Card title editable hint */
        .card-title[data-bid] { cursor:text; }
        .card-title[data-bid]:hover { color:#7a5010; }

        /* Card action buttons */
        .card-actions { display:flex; gap:5px; margin-top:8px; justify-content:flex-end; flex-wrap:wrap; }
        .card-actions button { padding:2px 10px; font-size:.65rem; }
        .dup-btn  { border-color:#4060a8 !important; background:#d8e0f8 !important; color:#102060 !important; }
        .del-btn  { border-color:#c04020 !important; background:#f8d8d0 !important; color:#801000 !important; }
        .fork-btn { border-color:#2060c0 !important; background:#e0ecff !important; color:#0a3080 !important; }

        /* Add-node "+" button inline at the end of a chain row */
        .add-node-btn {
            display:inline-flex; align-items:center;
            padding:2px 7px; margin-left:4px;
            background:transparent; border:1px dashed #a08040;
            border-radius:3px; color:#a08040; font-size:.78rem;
            cursor:pointer; opacity:.5; flex-shrink:0; vertical-align:middle;
        }
        .add-node-btn:hover { opacity:1; background:#f0ffe0; border-color:#408020; color:#408020; border-style:solid; }

        /* Add chain button inside category header */
        .add-chain-btn {
            margin-left:auto; padding:2px 10px; border-radius:3px;
            border:1px solid rgba(255,255,255,0.5); background:rgba(255,255,255,0.15);
            color:#fff; font-size:.7rem; font-weight:700; cursor:pointer;
        }
        .add-chain-btn:hover { background:rgba(255,255,255,0.3) !important; border-color:#fff !important; color:#fff !important; }
    </style>

// ── Render helpers ───────────────────────────────────────────────────────────

function esc(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

function nodeName(n) { return typeof n === 'object' ? (n.name || '—') : (n || '—'); }
function nodeNote(n) { return typeof n === 'object' ? (n.note || '') : ''; }

function cn(n, bid, path) {
    const nm = nodeName(n);
    const note = nodeNote(n);
    const ph = !nm || nm === '—';
    const d = bid != null ? ` data-bid="${esc(bid)}" data-npath="${esc(path)}"` : '';
    const noteHtml = `<span class="cn-note">${esc(note)}</span>`;
    const noteBtn = bid != null
        ? `<span class="cn-note-btn" data-bid="${esc(bid)}" data-npath="${esc(path)}" title="Nota">✎</span>`
        : '';
    return `<span class="cn${ph?' ph':''}"${d}><span class="cn-main">${esc(ph?'—':nm)}</span>${noteHtml}${noteBtn}</span>`;
}

const AR = '<span class="ar">→</span>';

function nrow(nodes, bid, pfx) {
    return nodes.map((n,i) => cn(n, bid, `${pfx}:${i}`)).join(AR);
}

function renderChain(b) {
    const ch = b.chain;
    const id = b.id;

    const addBtn = (apath) =>
        `<button class="add-node-btn" data-bid="${esc(id)}" data-apath="${apath}" title="Aggiungi nodo">+</button>`;

    if (ch.type === 'linear') {
        return `<div class="chain linear">${nrow(ch.nodes, id, 'lin')}${addBtn('lin')}</div>`;
    }

    if (ch.type === 'branch') {
        const preH = ch.pre.length
            ? `<div class="chain-pre">${nrow(ch.pre, id, 'pre')}${addBtn('pre')}${AR}</div><div class="fork-vbar"></div>`
            : '';
        const armsH = ch.branches.map((br, i) => {
            const ab = i === 0 ? 'a' : 'b';
            const note = br.note ? `<span class="bnote">${esc(br.note)}</span>` : '';
            return `<div class="chain-arm arm-${ab}">${nrow(br.nodes, id, `arm:${i}`)}${addBtn(`arm:${i}`)}${note}</div>`;
        }).join('');
        return `<div class="chain branch">${preH}<div class="chain-arms">${armsH}</div></div>`;
    }

    if (ch.type === 'complex') {
        const preH = ch.pre.length
            ? `<div class="chain-pre">${nrow(ch.pre, id, 'pre')}${addBtn('pre')}${AR}</div><div class="fork-vbar"></div>`
            : '';
        const armsH = ch.branches.map((br, i) => {
            const ab = i === 0 ? 'a' : 'b';
            if (br.subs) {
                return br.subs.map((s, si) =>
                    `<div class="chain-arm arm-${ab}"><span class="sub-lbl">${esc(s.label)}:</span>${nrow(s.nodes, id, `sub:${i}:${si}`)}${addBtn(`sub:${i}:${si}`)}</div>`
                ).join('');
            }
            const note = br.note ? `<span class="bnote">${esc(br.note)}</span>` : '';
            return `<div class="chain-arm arm-${ab}">${nrow(br.nodes, id, `arm:${i}`)}${addBtn(`arm:${i}`)}${note}</div>`;
        }).join('');
        return `<div class="chain branch">${preH}<div class="chain-arms">${armsH}</div></div>`;
    }
    return '';
}

function renderCults(cultures, bid) {
    return CULT_GRID.map(row =>
        row.map(c => {
            const on = cultures.includes(c);
            const style = on ? `background:${CULT_COLOR[c]};border-color:${CULT_COLOR[c]}` : '';
            return `<div class="csq ${on?'on':'off'}" data-bid="${esc(bid)}" data-cult="${c}" title="${c}" style="${style}"></div>`;
        }).join('')
    ).join('');
}

function renderCard(b) {
    const fnote = b.chainNote ? `<div class="fnote">* ${esc(b.chainNote)}</div>` : '';
    return `<div class="card" data-bid="${esc(b.id)}">
        <div class="card-head">
            <div>
                <div class="card-title" data-bid="${esc(b.id)}" data-field="name">${esc(b.name)}</div>
                ${b.note ? `<div class="card-note">${esc(b.note)}</div>` : ''}
            </div>
            <div class="csq-grid">${renderCults(b.cultures, b.id)}</div>
        </div>
        ${renderChain(b)}${fnote}
        <div class="card-actions">
            ${b.chain.type === 'linear' ? `<button class="fork-btn" data-bid="${esc(b.id)}">⑂ Biforca</button>` : ''}
            ${CATEGORIES.length > 1 ? `<select class="move-sel" data-bid="${esc(b.id)}"><option value="">↦ Sposta...</option>${CATEGORIES.filter(c=>c.id!==b.category).map(c=>`<option value="${esc(c.id)}">${esc(c.label)}</option>`).join('')}</select>` : ''}
            <button class="dup-btn" data-bid="${esc(b.id)}">⧉ Duplica</button>
            <button class="del-btn" data-bid="${esc(b.id)}">✕ Elimina</button>
        </div>
    </div>`;
}

// ── Persistence ───────────────────────────────────────────────────────────────

const STORAGE_KEY = 'mk1212_v3';

function saveData() {
    localStorage.setItem(STORAGE_KEY, JSON.stringify({ categories: CATEGORIES, buildings: BUILDINGS }));
}

function loadData() {
    try {
        const s = localStorage.getItem(STORAGE_KEY);
        if (s) {
            const d = JSON.parse(s);
            if (Array.isArray(d.buildings))  { BUILDINGS.length = 0;  BUILDINGS.push(...d.buildings); }
            if (Array.isArray(d.categories)) { CATEGORIES.length = 0; CATEGORIES.push(...d.categories); }
        } else {
            // migrate from v2
            const s2 = localStorage.getItem('mk1212_bld_v2');
            if (s2) { const d = JSON.parse(s2); BUILDINGS.length = 0; BUILDINGS.push(...d); }
        }
    } catch(e) { console.warn('loadData:', e); }
}

function resetData() {
    if (!confirm('Resettare tutte le modifiche ai dati originali?')) return;
    localStorage.removeItem(STORAGE_KEY);
    localStorage.removeItem('mk1212_bld_v2');
    location.reload();
}

// ── Data mutations ────────────────────────────────────────────────────────────

function getBuilding(bid) { return BUILDINGS.find(x => x.id === bid); }

function getNodeArr(b, path) {
    const [type, ...r] = path.split(':');
    if (type === 'lin') return [b.chain.nodes, +r[0]];
    if (type === 'pre') return [b.chain.pre, +r[0]];
    if (type === 'arm') return [b.chain.branches[+r[0]].nodes, +r[1]];
    if (type === 'sub') return [b.chain.branches[+r[0]].subs[+r[1]].nodes, +r[2]];
    return [null, 0];
}

function getNodeRaw(bid, path) {
    const b = getBuilding(bid);
    if (!b) return '';
    const [arr, idx] = getNodeArr(b, path);
    return arr ? arr[idx] : '';
}

function setNodeName(bid, path, name) {
    const b = getBuilding(bid); if (!b) return;
    const [arr, idx] = getNodeArr(b, path);
    if (!arr) return;
    const existNote = nodeNote(arr[idx]);
    arr[idx] = existNote ? { name, note: existNote } : name;
    saveData();
}

function setNodeNote(bid, path, note) {
    const b = getBuilding(bid); if (!b) return;
    const [arr, idx] = getNodeArr(b, path);
    if (!arr) return;
    const nm = nodeName(arr[idx]);
    arr[idx] = note ? { name: nm, note } : nm;
    saveData();
}

function toggleCulture(bid, cult) {
    const b = getBuilding(bid);
    if (!b) return;
    const i = b.cultures.indexOf(cult);
    if (i >= 0) b.cultures.splice(i, 1); else b.cultures.push(cult);
    saveData();
    const grid = document.querySelector(`.card[data-bid="${bid}"] .csq-grid`);
    if (grid) grid.innerHTML = renderCults(b.cultures, bid);
}

function delBuilding(bid) {
    if (!confirm('Eliminare questa catena?')) return;
    const i = BUILDINGS.findIndex(x => x.id === bid);
    if (i >= 0) { BUILDINGS.splice(i, 1); saveData(); render(); }
}

function dupBuilding(bid) {
    const b = getBuilding(bid);
    if (!b) return;
    const copy = JSON.parse(JSON.stringify(b));
    copy.id = bid + '_' + Date.now();
    copy.name = b.name + ' (copia)';
    const i = BUILDINGS.findIndex(x => x.id === bid);
    BUILDINGS.splice(i + 1, 0, copy);
    saveData(); render();
}

function forkChain(bid) {
    const b = getBuilding(bid);
    if (!b || b.chain.type !== 'linear') return;
    const nodes = b.chain.nodes;
    const splitAt = nodes.length > 1 ? 1 : 0;
    b.chain = {
        type: 'branch',
        pre: nodes.slice(0, splitAt),
        branches: [
            { label:'A', nodes: nodes.slice(splitAt).length ? nodes.slice(splitAt) : ['—'] },
            { label:'B', nodes: ['—'] },
        ]
    };
    saveData(); render();
}

function addNodeAt(bid, apath) {
    const b = getBuilding(bid);
    if (!b) return;
    const [type, ...r] = apath.split(':');
    if (type === 'lin') b.chain.nodes.push('—');
    else if (type === 'pre') b.chain.pre.push('—');
    else if (type === 'arm') b.chain.branches[+r[0]].nodes.push('—');
    else if (type === 'sub') b.chain.branches[+r[0]].subs[+r[1]].nodes.push('—');
    saveData(); render();
}

function addBuilding(cat) {
    const id = 'new_' + Date.now();
    BUILDINGS.push({ id, category: cat, name: 'Nuova Catena', cultures: [], chain: { type:'linear', nodes:['Edificio 1','Edificio 2'] } });
    saveData(); render();
    setTimeout(() => document.querySelector(`.card[data-bid="${id}"]`)?.scrollIntoView({behavior:'smooth',block:'nearest'}), 50);
}

function addCategory() {
    const label = prompt('Nome della nuova sezione:')?.trim();
    if (!label) return;
    const id = label.toLowerCase().replace(/[^a-z0-9]+/g,'_').replace(/^_+|_+$/g,'');
    if (!id || CATEGORIES.find(c => c.id === id)) { alert('Sezione già esistente o nome non valido.'); return; }
    const used = new Set(CATEGORIES.map(c => c.color));
    const color = CAT_PALETTE.find(c => !used.has(c)) || '#4a4a4a';
    CATEGORIES.push({ id, label, color });
    saveData(); renderFilterCats(); render();
}

function moveBuilding(bid, newCat) {
    const b = getBuilding(bid); if (!b || b.category === newCat) return;
    b.category = newCat; saveData(); render();
}

// ── Inline editing ────────────────────────────────────────────────────────────

function startEditNode(node) {
    const bid = node.dataset.bid;
    const path = node.dataset.npath;
    const origName = nodeName(getNodeRaw(bid, path));

    const input = document.createElement('input');
    input.type = 'text';
    input.value = origName === '—' ? '' : origName;
    input.className = 'cn-edit';
    if (node.closest('.arm-a')) input.style.borderColor = '#5888c8';
    if (node.closest('.arm-b')) input.style.borderColor = '#c87820';

    const restore = (newName) => {
        setNodeName(bid, path, newName || '—');
        // Re-render just this node in place
        const raw = getNodeRaw(bid, path);
        const ph = nodeName(raw) === '—';
        const span = document.createElement('span');
        span.className = `cn${ph?' ph':''}`;
        span.dataset.bid = bid; span.dataset.npath = path;
        const note = nodeNote(raw);
        const noteBtn = `<span class="cn-note-btn" data-bid="${bid}" data-npath="${path}" title="Nota">✎</span>`;
        span.innerHTML = `<span class="cn-main">${esc(nodeName(raw))}</span><span class="cn-note">${esc(note)}</span>${noteBtn}`;
        input.parentNode?.replaceChild(span, input);
    };

    input.addEventListener('keydown', ev => {
        if (ev.key === 'Enter') { ev.preventDefault(); restore(input.value.trim()); }
        if (ev.key === 'Escape') { restore(origName); }
    });
    input.addEventListener('blur', () => restore(input.value.trim()), { once: true });

    node.parentNode.replaceChild(input, node);
    input.focus(); input.select();
}

function startEditNote(btn) {
    const cn = btn.closest('.cn');
    const bid = btn.dataset.bid;
    const path = btn.dataset.npath;
    const currentNote = nodeNote(getNodeRaw(bid, path));

    let noteSpan = cn.querySelector('.cn-note');
    if (!noteSpan) { noteSpan = document.createElement('span'); noteSpan.className = 'cn-note'; btn.before(noteSpan); }

    const input = document.createElement('input');
    input.type = 'text';
    input.value = currentNote;
    input.className = 'cn-note-edit';
    input.placeholder = 'nota...';

    const save = () => {
        const val = input.value.trim();
        setNodeNote(bid, path, val);
        noteSpan.textContent = val;
        input.parentNode?.replaceChild(noteSpan, input);
        btn.style.display = '';
    };

    input.addEventListener('keydown', ev => {
        if (ev.key === 'Enter') { ev.preventDefault(); save(); }
        if (ev.key === 'Escape') { input.parentNode?.replaceChild(noteSpan, input); btn.style.display = ''; }
    });
    input.addEventListener('blur', save, { once: true });

    noteSpan.parentNode.replaceChild(input, noteSpan);
    btn.style.display = 'none';
    input.focus();
    if (input.value) input.select();
}

function startEditTitle(titleEl) {
    const bid = titleEl.dataset.bid;
    const b = getBuilding(bid);
    if (!b) return;
    const origName = b.name;

    const input = document.createElement('input');
    input.type = 'text';
    input.value = origName;
    input.className = 'cn-edit';
    input.style.cssText = 'font-weight:700;font-size:.78rem;border-color:#c8a030;';

    const restore = (newName) => {
        b.name = newName || origName;
        titleEl.textContent = b.name;
        titleEl.dataset.bid = bid; titleEl.dataset.field = 'name';
        input.parentNode?.replaceChild(titleEl, input);
        saveData();
    };

    input.addEventListener('keydown', ev => {
        if (ev.key === 'Enter') { ev.preventDefault(); restore(input.value.trim()); }
        if (ev.key === 'Escape') { restore(origName); }
    });
    input.addEventListener('blur', () => restore(input.value.trim()), { once: true });

    titleEl.parentNode.replaceChild(input, titleEl);
    input.focus(); input.select();
}

// ── State & render ────────────────────────────────────────────────────────────

let activeCat = 'all', activeCult = 'all';

function renderFilterCats() {
    const container = document.getElementById('cat-btns');
    if (!container) return;
    container.innerHTML = CATEGORIES.map(cat =>
        `<button data-cat="${esc(cat.id)}"${activeCat===cat.id?' class="active"':''}>${esc(cat.label)}</button>`
    ).join('');
    const allBtn = document.getElementById('cat-all');
    if (allBtn) allBtn.classList.toggle('active', activeCat === 'all');
}

function render() {
    const html = CATEGORIES.map(cat => {
        if (activeCat !== 'all' && activeCat !== cat.id) return '';
        const shown = BUILDINGS.filter(b => b.category === cat.id && (activeCult==='all'||b.cultures.includes(activeCult)));
        const total = BUILDINGS.filter(b => b.category === cat.id).length;
        if (!shown.length && activeCat === 'all') return '';
        const countTxt = shown.length < total ? `${shown.length}/${total}` : `${total}`;
        return `<div class="cat-section">
            <div class="cat-header" style="background:${esc(cat.color)}">
                <span>${esc(cat.label)}</span>
                <small>${countTxt}</small>
                <button class="add-chain-btn" data-cat="${cat.id}">+ Aggiungi</button>
            </div>
            ${shown.length ? `<div class="cards">${shown.map(renderCard).join('')}</div>` : '<div style="color:rgba(255,255,255,.5);padding:6px 0 2px;font-size:.7rem;font-style:italic">Nessuna catena.</div>'}
        </div>`;
    }).join('');
    document.getElementById('content').innerHTML =
        html || `<div style="color:#9a7a40;padding:40px;text-align:center;font-style:italic">Nessun edificio trovato.</div>`;
}

// ── Event delegation on #content ─────────────────────────────────────────────

const content = document.getElementById('content');

content.addEventListener('dblclick', e => {
    const node = e.target.closest('.cn[data-bid]');
    if (node) { startEditNode(node); return; }
    const title = e.target.closest('.card-title[data-bid]');
    if (title) { startEditTitle(title); }
});

content.addEventListener('click', e => {
    const noteBtn = e.target.closest('.cn-note-btn[data-bid]');
    if (noteBtn) { e.stopPropagation(); startEditNote(noteBtn); return; }
    const sq = e.target.closest('.csq[data-bid]');
    if (sq) { toggleCulture(sq.dataset.bid, sq.dataset.cult); return; }
    const del = e.target.closest('.del-btn[data-bid]');
    if (del) { delBuilding(del.dataset.bid); return; }
    const dup = e.target.closest('.dup-btn[data-bid]');
    if (dup) { dupBuilding(dup.dataset.bid); return; }
    const fork = e.target.closest('.fork-btn[data-bid]');
    if (fork) { forkChain(fork.dataset.bid); return; }
    const addN = e.target.closest('.add-node-btn[data-bid]');
    if (addN) { addNodeAt(addN.dataset.bid, addN.dataset.apath); return; }
    const add = e.target.closest('.add-chain-btn[data-cat]');
    if (add) { addBuilding(add.dataset.cat); }
});

content.addEventListener('change', e => {
    const sel = e.target.closest('.move-sel[data-bid]');
    if (sel && sel.value) moveBuilding(sel.dataset.bid, sel.value);
});

// ── Export / Import ───────────────────────────────────────────────────────────

function exportState() {
    const data = JSON.stringify({ categories: CATEGORIES, buildings: BUILDINGS }, null, 2);
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([data], { type:'application/json' }));
    a.download = 'buildings_state.json';
    a.click();
    URL.revokeObjectURL(a.href);
}

function importState(e) {
    const file = e.target.files[0]; if (!file) return;
    e.target.value = '';
    const reader = new FileReader();
    reader.onload = ev => {
        try {
            const d = JSON.parse(ev.target.result);
            if (d.buildings)  { BUILDINGS.length = 0;  BUILDINGS.push(...d.buildings); }
            if (d.categories) { CATEGORIES.length = 0; CATEGORIES.push(...d.categories); }
            saveData(); renderFilterCats(); render();
            alert('Importazione completata.');
        } catch(err) { alert('Errore nel file: ' + err.message); }
    };
    reader.readAsText(file);
}

// ── Filter bar ────────────────────────────────────────────────────────────────

document.querySelector('.filter-bar').addEventListener('click', e => {
    const catBtn = e.target.closest('button[data-cat]');
    if (catBtn) {
        document.querySelectorAll('.filter-bar button[data-cat]').forEach(b => b.classList.remove('active'));
        catBtn.classList.add('active'); activeCat = catBtn.dataset.cat; render(); return;
    }
    if (e.target.id === 'add-cat-btn') addCategory();
});

document.querySelectorAll('[data-cult]').forEach(btn =>
    btn.addEventListener('click', () => {
        document.querySelectorAll('[data-cult]').forEach(b => b.classList.remove('active'));
        btn.classList.add('active'); activeCult = btn.dataset.cult; render();
    })
);

loadData();
renderFilterCats();
render();
</script>
