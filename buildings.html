<html lang="it">
<head>

    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        body {

            min-height: 100vh;
        }
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background: rgba(8, 4, 0, 0.75);
            pointer-events: none;
            z-index: 0;
        }

        #app {
            position: relative;
            z-index: 1;
            max-width: 1440px;
            margin: 0 auto;
            padding: 0 24px 80px;
        }

        /* ── Header ── */
        header {
            text-align: center;
            padding: 44px 20px 26px;
            border-bottom: 2px solid rgba(212,175,55,0.28);
            margin-bottom: 0;
        }
        header h1 {
            font-family: 'Cinzel Decorative', serif;
            font-size: 2.6rem;
            font-weight: 700;
            color: #d4af37;
            text-shadow: 0 2px 10px rgba(0,0,0,0.9);
            letter-spacing: .14em;
            margin-bottom: 6px;
        }
        header p {
            font-size: .84rem;
            color: #8a7a5a;
            letter-spacing: .07em;
        }

        /* ── Filter bar ── */

            background: rgba(10, 5, 1, 0.94);
            border-bottom: 1px solid rgba(212,175,55,0.18);
            padding: 10px 0;
            margin-bottom: 28px;
            backdrop-filter: blur(8px);
        }
        .filter-row {
            display: flex;
            flex-wrap: wrap;
            gap: 7px;
            align-items: center;
        }
        .filter-label {
            font-size: .68rem;
            font-weight: 700;
            color: #6a5a3a;
            text-transform: uppercase;
            letter-spacing: .1em;
            margin-right: 2px;
            white-space: nowrap;
        }
        .filter-sep {
            width: 1px; height: 22px;
            background: rgba(212,175,55,0.2);
            margin: 0 8px;
        }

        .cat-btn {
            padding: 4px 14px;
            border-radius: 20px;
            border: 1.5px solid rgba(212,175,55,0.28);
            background: rgba(50,34,8,0.45);
            color: #b8984a;
            font-family: 'Cinzel', serif;
            font-size: .7rem;
            font-weight: 600;

            box-shadow: 0 0 8px rgba(212,175,55,0.25); }

        .cult-btn {
            padding: 4px 12px;
            border-radius: 20px;
            border: 1.5px solid transparent;
            font-family: 'Cinzel', serif;
            font-size: .68rem;
            font-weight: 700;
            cursor: pointer;
            transition: all .15s;
            opacity: 0.55;
            white-space: nowrap;
        }
        .cult-btn:hover { opacity: 0.85; }
        .cult-btn.active { opacity: 1; box-shadow: 0 0 7px currentColor; }

        /* ── Category section ── */
        .cat-section { margin-bottom: 44px; }
        .cat-title {
            font-family: 'Cinzel Decorative', serif;
            font-size: 1.15rem;
            font-weight: 700;
            color: #d4af37;
            letter-spacing: .1em;
            padding: 14px 0 12px;
            border-bottom: 1px solid rgba(212,175,55,0.22);
            margin-bottom: 18px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .cat-title-bar {
            display: inline-block;
            width: 5px; height: 22px;
            background: #d4af37;
            border-radius: 3px;
        }

            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(400px, 1fr));

        }

            background: rgba(16, 10, 2, 0.9);
            border: 1px solid rgba(212,175,55,0.22);
            border-radius: 8px;
            padding: 15px 17px 14px;

            margin-bottom: 11px;
        }
        .card-name {
            font-size: .95rem;
            font-weight: 700;
            color: #e8d070;
            letter-spacing: .04em;
            line-height: 1.3;
        }
        .card-note {
            font-size: .7rem;
            color: #8a7a5a;
            font-style: italic;
            font-family: Georgia, serif;
            margin-top: 3px;
        }
        .chain-note {
            font-size: .68rem;
            color: #7a6a4a;
            font-style: italic;
            font-family: Georgia, serif;
            margin-top: 7px;
            line-height: 1.45;
        }

        .badge {

            font-weight: 700;
            padding: 2px 7px;
            border-radius: 10px;
            letter-spacing: .04em;
            white-space: nowrap;
        }

        /* ── Chain visualization ── */
        .chain-linear {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
        }
        .chain-node {
            background: rgba(70, 48, 10, 0.5);
            border: 1px solid rgba(212,175,55,0.28);
            border-radius: 4px;
            padding: 4px 9px;
            font-size: .7rem;
            color: #d4c080;
            font-family: Georgia, 'Times New Roman', serif;
            font-style: italic;
            white-space: nowrap;
            line-height: 1.3;
        }
        .chain-arrow {
            color: rgba(212,175,55,0.45);
            font-size: .95rem;
            padding: 0 4px;
            flex-shrink: 0;
            line-height: 1;
        }

        /* Branch chain */
        .chain-root { display: flex; flex-wrap: wrap; align-items: center; margin-bottom: 5px; }
        .chain-branches {
            border-left: 2px solid rgba(212,175,55,0.25);
            padding-left: 11px;
            margin-left: 4px;
            display: flex;
            flex-direction: column;
            gap: 5px;
        }
        .chain-branch { display: flex; flex-wrap: wrap; align-items: center; }
        .branch-label {
            font-size: .62rem;
            font-weight: 900;
            color: #c8a84b;
            background: rgba(80,55,10,0.55);
            border: 1px solid rgba(212,175,55,0.28);
            border-radius: 3px;
            min-width: 20px; height: 20px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            margin-right: 5px;
            padding: 0 4px;

        .branch-note {
            font-size: .62rem;
            color: #8a7a58;
            font-family: Georgia, serif;
            font-style: italic;
            background: rgba(30,20,4,0.6);
            border-radius: 3px;
            padding: 2px 6px;
            margin-left: 4px;
            white-space: nowrap;

        /* Complex: sub-branches */

            margin-left: 4px;

            color: #6a5a3a;
            font-style: italic;
            font-size: .85rem;
            padding: 30px 0;
            text-align: center;
        }
    </style>
</head>

// Each building:

// ── Render helpers ───────────────────────────────────────────────────────────

function esc(s) { return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

function node(name) { return `<div class="chain-node">${esc(name)}</div>`; }
function arrow()    { return `<span class="chain-arrow">›</span>`; }

function nodeRow(nodes) {
    return nodes.map((n,i) => node(n) + (i < nodes.length-1 ? arrow() : '')).join('');
}

function renderChain(b) {
    const ch = b.chain;

    if (ch.type === 'linear') {
        return `<div class="chain-linear">${nodeRow(ch.nodes)}</div>`;
    }

    if (ch.type === 'branch') {
        const rootHtml = ch.root.length
            ? `<div class="chain-root">${nodeRow(ch.root)}${arrow()}</div>` : '';
        const brHtml = ch.branches.map(br => {
            const lbl  = br.label ? `<span class="branch-label">${esc(br.label)}</span>` : '';
            const note = br.note  ? `<span class="branch-note">${esc(br.note)}</span>` : '';
            return `<div class="chain-branch">${lbl}${nodeRow(br.nodes)}${note}</div>`;
        }).join('');
        return `${rootHtml}<div class="chain-branches">${brHtml}</div>`;
    }

    if (ch.type === 'complex') {
        const rootHtml = ch.root.length
            ? `<div class="chain-root">${nodeRow(ch.root)}${arrow()}</div>` : '';
        const brHtml = ch.branches.map(br => {
            const lbl = br.label ? `<span class="branch-label">${esc(br.label)}</span>` : '';
            if (br.subbranches) {
                const subHtml = br.subbranches.map(sb =>
                    `<div class="sub-branch">
                        <span class="sub-label">${esc(sb.label)}:</span>${nodeRow(sb.nodes)}
                    </div>`
                ).join('');
                return `<div class="chain-branch" style="flex-direction:column;align-items:flex-start;gap:3px">
                    ${lbl}
                    <div class="sub-branches">${subHtml}</div>
                </div>`;
            }
            const note = br.note ? `<div style="margin-left:25px"><span class="branch-note" style="white-space:normal">${esc(br.note)}</span></div>` : '';
            return `<div style="display:flex;flex-direction:column;gap:2px">
                <div class="chain-branch">${lbl}${nodeRow(br.nodes)}</div>
                ${note}
            </div>`;
        }).join('');
        return `${rootHtml}<div class="chain-branches">${brHtml}</div>`;
    }

    return '';
}

function renderCard(b) {
    const badges = b.cultures.map(c => {
        const cu = CULT[c];
        return `<span class="badge" style="color:${cu.color};background:${cu.bg};border:1px solid ${cu.color}55">${cu.label}</span>`;
    }).join('');
    const noteHtml      = b.note      ? `<div class="card-note">${esc(b.note)}</div>` : '';
    const chainNoteHtml = b.chainNote ? `<div class="chain-note">* ${esc(b.chainNote)}</div>` : '';

    return `
    <div class="b-card" data-cat="${b.category}" data-cultures="${b.cultures.join(',')}">
        <div class="card-head">
            <div>
                <div class="card-name">${esc(b.name)}</div>
                ${noteHtml}
            </div>
            <div class="badges">${badges}</div>
        </div>
        ${renderChain(b)}
        ${chainNoteHtml}
    </div>`;
}

// ── Render & filter ──────────────────────────────────────────────────────────

let activeCat  = 'all';
let activeCult = 'all';

function render() {
    const content = document.getElementById('content');
    const sections = CATEGORIES
        .filter(cat => activeCat === 'all' || cat.id === activeCat)
        .map(cat => {
            const cards = BUILDINGS
                .filter(b => b.category === cat.id)
                .filter(b => activeCult === 'all' || b.cultures.includes(activeCult))
                .map(renderCard).join('');
            if (!cards) return '';
            return `<div class="cat-section">
                <div class="cat-title"><span class="cat-title-bar"></span>${cat.label}</div>
                <div class="cards-grid">${cards}</div>
            </div>`;
        }).join('');
    content.innerHTML = sections || `<div class="empty-msg">Nessun edificio trovato per i filtri selezionati.</div>`;
}

document.querySelectorAll('[data-cat]').forEach(btn => {
    btn.addEventListener('click', () => {
        document.querySelectorAll('[data-cat]').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        activeCat = btn.dataset.cat;
        render();
    });
});

document.querySelectorAll('[data-cult]').forEach(btn => {
    btn.addEventListener('click', () => {
        document.querySelectorAll('[data-cult]').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        activeCult = btn.dataset.cult;
        render();
    });
});

render();
</script>
