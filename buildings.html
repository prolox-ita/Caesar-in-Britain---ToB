<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edifici — MK1212 CIB</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700;900&family=Cinzel+Decorative:wght@400;700&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Cinzel', Georgia, serif;
            background: #0a0602 url('background_cib.jpg') center/cover fixed;
            color: #e8d5a0;
            min-height: 100vh;
        }
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background: rgba(6, 3, 0, 0.82);
            pointer-events: none;
            z-index: 0;
        }

        #app {
            position: relative;
            z-index: 1;
            max-width: 1440px;
            margin: 0 auto;
            padding: 0 20px 80px;
        }

        /* ── Header ── */
        header {
            text-align: center;
            padding: 36px 20px 20px;
            margin-bottom: 0;
        }
        header h1 {
            font-family: 'Cinzel Decorative', serif;
            font-size: 2.2rem;
            font-weight: 700;
            color: #d4af37;
            text-shadow: 0 2px 10px rgba(0,0,0,0.9);
            letter-spacing: .14em;
        }

        /* ── Filter bar ── */
        .filter-bar {
            position: sticky;
            top: 0;
            z-index: 100;
            background: rgba(8, 4, 0, 0.96);
            border-top: 1px solid rgba(212,175,55,0.18);
            border-bottom: 1px solid rgba(212,175,55,0.18);
            padding: 8px 0;
            margin: 16px 0 0;
            backdrop-filter: blur(8px);
        }
        .filter-row {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            align-items: center;
        }
        .filter-label {
            font-size: .65rem;
            font-weight: 700;
            color: #6a5a3a;
            text-transform: uppercase;
            letter-spacing: .1em;
            white-space: nowrap;
        }
        .filter-sep { width: 1px; height: 20px; background: rgba(212,175,55,0.2); margin: 0 6px; }

        .cat-btn {
            padding: 3px 13px;
            border-radius: 20px;
            border: 1.5px solid rgba(212,175,55,0.25);
            background: rgba(50,34,8,0.4);
            color: #b0904a;
            font-family: 'Cinzel', serif;
            font-size: .68rem;
            font-weight: 600;
            cursor: pointer;
            transition: all .15s;
            white-space: nowrap;
        }
        .cat-btn:hover { border-color: #d4af37; color: #f0d060; }
        .cat-btn.active { background: rgba(120,82,14,0.5); border-color: #d4af37; color: #f5e070; }

        .cult-btn {
            padding: 3px 11px;
            border-radius: 20px;
            border: 1.5px solid transparent;
            font-family: 'Cinzel', serif;
            font-size: .66rem;
            font-weight: 700;
            cursor: pointer;
            transition: all .15s;
            opacity: 0.5;
            white-space: nowrap;
        }
        .cult-btn:hover { opacity: 0.8; }
        .cult-btn.active { opacity: 1; box-shadow: 0 0 6px currentColor; }

        /* ── Table structure ── */
        .tbl-wrap {
            margin-top: 0;
            overflow-x: auto;
        }

        /* Sticky column header */
        .tbl-head {
            display: grid;
            grid-template-columns: 34px 78px 1fr 52px;
            background: rgba(8,4,0,0.95);
            border-bottom: 1px solid rgba(212,175,55,0.3);
            position: sticky;
            top: 45px;
            z-index: 90;
        }
        .tbl-head > div {
            padding: 5px 4px;
            font-size: .62rem;
            font-weight: 700;
            color: #6a5a3a;
            text-transform: uppercase;
            letter-spacing: .1em;
        }
        .tbl-head .th-chain {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            color: #6a5a3a;
        }
        .tbl-head .th-chain span {
            padding: 5px 4px;
            font-size: .62rem;
            font-weight: 700;
            letter-spacing: .1em;
        }
        .tbl-head .th-cult { text-align: center; }

        /* ── Category block ── */
        .cat-block {
            display: flex;
            margin-bottom: 2px;
        }
        .cat-bar {
            width: 34px;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            writing-mode: vertical-rl;
            transform: rotate(180deg);
            font-family: 'Cinzel', serif;
            font-size: .58rem;
            font-weight: 900;
            letter-spacing: .14em;
            text-transform: uppercase;
            color: rgba(255,255,255,0.92);
            text-shadow: 0 1px 4px rgba(0,0,0,0.7);
        }
        .cat-bar.food     { background: rgba(50,110,18,0.85); }
        .cat-bar.religion { background: rgba(140,40,130,0.85); }
        .cat-bar.society  { background: rgba(160,130,0,0.85); }

        .cat-rows { flex: 1; }

        /* ── Building row ── */
        .b-row {
            display: grid;
            grid-template-columns: 78px 1fr 52px;
            border-bottom: 1px solid rgba(212,175,55,0.1);
            min-height: 52px;
            transition: background .15s;
        }
        .b-row:hover { background: rgba(212,175,55,0.04); }

        /* Building name column */
        .b-name {
            display: flex;
            align-items: center;
            justify-content: center;
            border-right: 1px solid rgba(212,175,55,0.12);
            padding: 6px 3px;
        }
        .b-name span {
            writing-mode: vertical-rl;
            transform: rotate(180deg);
            font-family: 'Cinzel', serif;
            font-size: .56rem;
            font-weight: 700;
            color: #c8a060;
            letter-spacing: .09em;
            text-transform: uppercase;
            white-space: nowrap;
            text-align: center;
        }
        .b-name .b-note {
            writing-mode: vertical-rl;
            transform: rotate(180deg);
            font-size: .52rem;
            color: #7a6a4a;
            font-style: italic;
            font-family: Georgia, serif;
            letter-spacing: 0;
            margin-top: 4px;
        }

        /* Chain column */
        .b-chain {
            padding: 7px 10px;
            display: flex;
            align-items: center;
        }

        /* Chain: linear */
        .chain-linear {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            align-items: center;
            width: 100%;
            gap: 2px;
        }
        .chain-linear.t3 { grid-template-columns: repeat(3, 1fr) 0px; }

        .tier {
            display: flex;
            align-items: center;
            gap: 3px;
        }
        .tier:not(:last-child)::after {
            content: '›';
            color: rgba(212,175,55,0.4);
            font-size: .9rem;
            flex-shrink: 0;
        }
        .tier.empty::after { content: ''; }

        /* Chain: branch */
        .chain-branch {
            display: grid;
            grid-template-columns: 1fr 3fr;
            align-items: center;
            width: 100%;
            gap: 0;
        }
        .chain-branch.pre2 { grid-template-columns: 2fr 2fr; }
        .chain-branch.pre3 { grid-template-columns: 3fr 1fr; }

        .branch-root {
            display: flex;
            align-items: center;
            padding-right: 4px;
        }
        .branch-root::after {
            content: '›';
            color: rgba(212,175,55,0.35);
            font-size: .9rem;
            margin-left: 3px;
            flex-shrink: 0;
        }

        .branch-paths {
            border-left: 2px solid rgba(212,175,55,0.22);
            padding-left: 8px;
            display: flex;
            flex-direction: column;
            gap: 4px;
            align-self: stretch;
            justify-content: center;
        }
        .branch-row {
            display: flex;
            align-items: center;
            gap: 3px;
        }
        .bl {
            font-size: .58rem;
            font-weight: 900;
            color: #c8a84b;
            background: rgba(80,55,10,0.5);
            border: 1px solid rgba(212,175,55,0.25);
            border-radius: 3px;
            width: 18px; height: 18px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            margin-right: 3px;
        }
        .branch-note {
            font-size: .58rem;
            color: #7a6a4a;
            font-style: italic;
            font-family: Georgia, serif;
            padding: 2px 5px;
            background: rgba(20,12,2,0.5);
            border-radius: 3px;
            white-space: normal;
            margin-left: 3px;
        }

        /* Complex sub-branches */
        .sub-branches {
            border-left: 1px solid rgba(212,175,55,0.15);
            padding-left: 8px;
            margin-left: 4px;
            display: flex;
            flex-direction: column;
            gap: 3px;
        }
        .sub-row { display: flex; align-items: center; gap: 3px; }
        .sub-lbl {
            font-size: .55rem;
            color: #7a6a4a;
            font-family: Georgia, serif;
            font-style: italic;
            white-space: nowrap;
            margin-right: 3px;
        }

        /* Building node box */
        .cn {
            background: rgba(60,40,8,0.55);
            border: 1px solid rgba(212,175,55,0.25);
            border-radius: 3px;
            padding: 3px 7px;
            font-size: .66rem;
            color: #d0b870;
            font-family: Georgia, 'Times New Roman', serif;
            font-style: italic;
            white-space: nowrap;
            line-height: 1.25;
        }

        /* Culture squares column */
        .b-cults {
            display: grid;
            grid-template-columns: 1fr 1fr;
            grid-template-rows: repeat(3, 1fr);
            gap: 2px;
            padding: 4px 5px;
            border-left: 1px solid rgba(212,175,55,0.12);
            align-items: center;
            justify-items: center;
        }
        .csq {
            width: 18px;
            height: 18px;
            border-radius: 2px;
            border: 1px solid rgba(0,0,0,0.4);
            opacity: 0.18;
            transition: opacity .15s;
        }
        .csq.on { opacity: 1; }

        .empty-msg {
            color: #6a5a3a;
            font-style: italic;
            font-size: .85rem;
            padding: 40px 0;
            text-align: center;
        }
    </style>
</head>

</div>

// ── Render helpers ───────────────────────────────────────────────────────────

function esc(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

function cn(name) {
    if (!name || name === '—') return `<div class="cn" style="opacity:.35">—</div>`;
    return `<div class="cn">${esc(name)}</div>`;
}

function nodeRow(nodes) {
    return nodes.map(n => cn(n)).join('<span style="color:rgba(212,175,55,.35);padding:0 2px;font-size:.85rem">›</span>');
}

function renderChain(b) {
    const ch = b.chain;

    if (ch.type === 'linear') {
        const n = ch.nodes.length;
        const cols = n === 4 ? '' : n === 3 ? 'style="grid-template-columns:repeat(3,1fr) 0px"' : 'style="grid-template-columns:repeat(2,1fr) 0px 0px"';
        const cells = ch.nodes.map((nd, i) => {
            const last = i === n - 1;
            return `<div class="tier${last ? ' empty' : ''}">${cn(nd)}</div>`;
        });
        // pad to 4
        while (cells.length < 4) cells.push('<div class="tier empty"></div>');
        return `<div class="chain-linear" ${cols}>${cells.join('')}</div>`;
    }

    if (ch.type === 'branch') {
        const preCount = ch.pre.length;
        const postCols = 4 - preCount;
        let gridClass = '';
        if (preCount === 2) gridClass = 'pre2';
        else if (preCount === 3) gridClass = 'pre3';

        const preHtml = ch.pre.map((nd, i) => {
            const last = i === ch.pre.length - 1;
            return cn(nd) + (last ? '' : '<span style="color:rgba(212,175,55,.35);padding:0 2px;font-size:.85rem">›</span>');
        }).join('');

        const brHtml = ch.branches.map(br => {
            const lbl = br.label ? `<span class="bl">${esc(br.label)}</span>` : '';
            const note = br.note ? `<span class="branch-note">${esc(br.note)}</span>` : '';
            return `<div class="branch-row">${lbl}${nodeRow(br.nodes)}${note}</div>`;
        }).join('');

        return `<div class="chain-branch ${gridClass}">
            <div class="branch-root">${preHtml}</div>
            <div class="branch-paths">${brHtml}</div>
        </div>`;
    }

    if (ch.type === 'complex') {
        const preHtml = ch.pre.map(nd => cn(nd)).join('<span style="color:rgba(212,175,55,.35);padding:0 2px">›</span>');
        const brHtml = ch.branches.map(br => {
            const lbl = `<span class="bl">${esc(br.label)}</span>`;
            if (br.subs) {
                const subsHtml = br.subs.map(s =>
                    `<div class="sub-row"><span class="sub-lbl">${esc(s.label)}:</span>${nodeRow(s.nodes)}</div>`
                ).join('');
                return `<div class="branch-row" style="flex-direction:column;align-items:flex-start;gap:3px">
                    <div style="display:flex;align-items:center;gap:4px;margin-bottom:2px">${lbl}</div>
                    <div class="sub-branches">${subsHtml}</div>
                </div>`;
            }
            const note = br.note ? `<div style="margin-left:22px"><span class="branch-note" style="white-space:normal">${esc(br.note)}</span></div>` : '';
            return `<div style="display:flex;flex-direction:column;gap:2px">
                <div class="branch-row">${lbl}${nodeRow(br.nodes)}</div>${note}
            </div>`;
        }).join('');
        return `<div class="chain-branch">
            <div class="branch-root">${preHtml}</div>
            <div class="branch-paths">${brHtml}</div>
        </div>`;
    }

    return '';
}

function renderCultSquares(cultures) {
    return CULT_GRID.map(row =>
        row.map(c => {
            const on = cultures.includes(c);
            const col = CULT[c].color;
            return `<div class="csq${on ? ' on' : ''}" style="${on ? `background:${col};border-color:${col}80` : 'background:#1a1008;border-color:rgba(255,255,255,0.08)'}"></div>`;
        }).join('')
    ).join('');
}

function renderRow(b) {
    const nameHtml = `<div class="b-name">
        <span>${esc(b.name)}</span>
        ${b.note ? `<span class="b-note">${esc(b.note)}</span>` : ''}
    </div>`;
    const chainNoteHtml = b.chainNote
        ? `<div class="branch-note" style="margin-top:5px;display:block;white-space:normal">${esc(b.chainNote)}</div>`
        : '';
    const chainHtml = `<div class="b-chain">
        <div style="width:100%">
            ${renderChain(b)}
            ${chainNoteHtml}
        </div>
    </div>`;
    const cultHtml = `<div class="b-cults">${renderCultSquares(b.cultures)}</div>`;
    return `<div class="b-row" data-cat="${b.category}" data-cultures="${b.cultures.join(',')}">${nameHtml}${chainHtml}${cultHtml}</div>`;
}

// ── Render & filter ──────────────────────────────────────────────────────────

let activeCat  = 'all';
let activeCult = 'all';

function render() {
    const content = document.getElementById('content');
    const html = CATEGORIES
        .filter(cat => activeCat === 'all' || cat.id === activeCat)
        .map(cat => {
            const rows = BUILDINGS
                .filter(b => b.category === cat.id)
                .filter(b => activeCult === 'all' || b.cultures.includes(activeCult))
                .map(renderRow).join('');
            if (!rows) return '';
            return `<div class="cat-block">
                <div class="cat-bar ${cat.cls}">${esc(cat.label)}</div>
                <div class="cat-rows">${rows}</div>
            </div>`;
        }).join('');
    content.innerHTML = html || `<div class="empty-msg">Nessun edificio trovato.</div>`;
}

document.querySelectorAll('[data-cat]').forEach(btn => {
    btn.addEventListener('click', () => {
        document.querySelectorAll('[data-cat]').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        activeCat = btn.dataset.cat;
        render();
    });
});

document.querySelectorAll('[data-cult]').forEach(btn => {
    btn.addEventListener('click', () => {
        document.querySelectorAll('[data-cult]').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        activeCult = btn.dataset.cult;
        render();
    });
});

render();
</script>
