<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>New CIB Map - Interactive</title>
    <link rel="stylesheet" href="styles.css">
    <link
        href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700;900&family=Merriweather:wght@300;400;700&display=swap"
        rel="stylesheet">
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background: #1a1410;
        }

        .map-container {
            display: flex;
            width: 100vw;
            height: 100vh;
        }

        .map-area {
            flex: 1;
            position: relative;
            overflow: hidden;
            background: #1a1410;
        }

        #mapZoomContainer {
            position: absolute;
            top: 0; left: 0;
            transform-origin: 0 0;
            cursor: grab;
        }

        #mapZoomContainer.panning { cursor: grabbing; }

        .map-wrapper {
            position: relative;
            display: inline-block;
        }

        .map-image {
            display: block;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
            border: 3px solid #d4af37;
            border-radius: 8px;
            -webkit-user-select: none;
            user-select: none;
        }

        #factionCanvas,
        #bordersCanvas,
        #lavorataCanvas,
        #overlayCanvas,
        #markersCanvas,
        #interactiveCanvas {
            position: absolute;
            top: 3px;
            left: 3px;
            border-radius: 5px;
        }

        #factionCanvas,
        #bordersCanvas,
        #lavorataCanvas,
        #overlayCanvas,
        #markersCanvas {
            pointer-events: none;
        }

        #interactiveCanvas {
            cursor: crosshair;
        }

        .view-toggle {
            display: flex;
            padding: 12px 20px 10px;
            border-bottom: 1px solid rgba(212, 175, 55, 0.25);
            background: rgba(255, 252, 245, 0.5);
            gap: 0;
        }

        .vt-btn {
            flex: 1;
            padding: 7px 0;
            border: 1.5px solid #c8a84b;
            background: transparent;
            font-family: 'Cinzel', serif;
            font-size: 0.75rem;
            font-weight: 700;
            letter-spacing: 0.08em;
            color: #7a6a4f;
            cursor: pointer;
            transition: all 0.2s;
        }

        .vt-btn:first-child {
            border-radius: 6px 0 0 6px;
        }

        .vt-btn:last-child {
            border-radius: 0 6px 6px 0;
            border-left: none;
        }

        .vt-btn.active {
            background: #5a4a2f;
            color: #f0d98a;
            border-color: #5a4a2f;
        }

        .vt-btn:not(.active):hover {
            background: rgba(212, 175, 55, 0.15);
            color: #3a2a10;
        }

        .faction-toolbar {
            display: flex;
            gap: 8px;
            padding: 8px 14px;
            border-bottom: 1px solid rgba(212, 175, 55, 0.2);
            background: rgba(255, 252, 245, 0.4);
        }

        .ft-btn {
            flex: 1;
            padding: 6px 0;
            font-family: 'Cinzel', serif;
            font-size: 0.7rem;
            font-weight: 700;
            letter-spacing: 0.08em;
            border-radius: 5px;
            cursor: pointer;
            border: 1.5px solid #c8a84b;
            background: transparent;
            color: #5a4a2f;
            transition: background 0.15s;
        }

        .ft-btn:hover {
            background: rgba(212, 175, 55, 0.2);
        }

        .ft-import {
            text-align: center;
        }

        .faction-legend {
            padding: 16px 20px;
            overflow-y: auto;
            flex: 1;
        }

        .faction-legend h3 {
            font-family: 'Cinzel', serif;
            font-size: 0.82rem;
            font-weight: 700;
            color: #5a4a2f;
            margin-bottom: 12px;
            letter-spacing: 0.1em;
            text-transform: uppercase;
        }

        .fl-item {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 7px 0;
            border-bottom: 1px solid rgba(212, 175, 55, 0.15);
            font-size: 0.88rem;
            color: #4a3a25;
        }

        .legend-swatch {
            width: 16px;
            height: 16px;
            border-radius: 3px;
            flex-shrink: 0;
            border: 1px solid rgba(0, 0, 0, 0.18);
        }

        .fl-name {
            flex: 1;
            font-weight: 600;
        }

        .fl-count {
            font-size: 0.72rem;
            color: #9a8a6a;
            background: rgba(212, 175, 55, 0.15);
            border-radius: 10px;
            padding: 1px 7px;
            min-width: 22px;
            text-align: center;
        }

        .fl-del {
            background: none;
            border: none;
            color: #c0392b;
            cursor: pointer;
            font-size: 0.85rem;
            padding: 2px 5px;
            border-radius: 3px;
            opacity: 0.45;
            transition: opacity 0.15s;
        }

        .fl-del:hover {
            opacity: 1;
            background: rgba(192, 57, 43, 0.1);
        }

        .legend-unassigned {
            color: #9a8a6a;
            font-style: italic;
            padding: 7px 0;
            font-size: 0.88rem;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .fl-add-section {
            margin-top: 14px;
        }

        .fl-add-btn {
            width: 100%;
            padding: 7px;
            background: rgba(212, 175, 55, 0.08);
            border: 1.5px dashed #c8a84b;
            border-radius: 6px;
            color: #7a6a4f;
            font-family: 'Cinzel', serif;
            font-size: 0.75rem;
            font-weight: 700;
            cursor: pointer;
            letter-spacing: 0.08em;
            transition: background 0.15s;
        }

        .fl-add-btn:hover {
            background: rgba(212, 175, 55, 0.2);
        }

        .fl-add-form {
            display: none;
            flex-direction: column;
            gap: 8px;
            margin-top: 10px;
        }

        .fl-add-form input[type=text] {
            width: 100%;
            padding: 7px 10px;
            border: 1.5px solid #c8a84b;
            border-radius: 5px;
            font-size: 0.88rem;
            background: rgba(255, 255, 255, 0.9);
            color: #3a2a10;
            outline: none;
            box-sizing: border-box;
        }

        .fl-add-form input[type=text]:focus {
            border-color: #8b6914;
        }

        .fl-color-row {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 0.82rem;
            color: #5a4a2f;
            font-weight: 600;
        }

        .fl-add-form input[type=color] {
            width: 36px;
            height: 28px;
            border: 1.5px solid #c8a84b;
            border-radius: 4px;
            cursor: pointer;
            padding: 2px;
        }

        .fl-add-actions {
            display: flex;
            gap: 8px;
        }

        .fl-confirm {
            flex: 1;
            padding: 6px;
            background: #5a4a2f;
            color: #f0d98a;
            border: none;
            border-radius: 5px;
            font-family: 'Cinzel', serif;
            font-size: 0.75rem;
            font-weight: 700;
            cursor: pointer;
            transition: background 0.15s;
        }

        .fl-confirm:hover {
            background: #3a2a10;
        }

        .fl-cancel {
            flex: 1;
            padding: 6px;
            background: transparent;
            color: #7a6a4f;
            border: 1.5px solid #c8a84b;
            border-radius: 5px;
            font-family: 'Cinzel', serif;
            font-size: 0.75rem;
            cursor: pointer;
        }

        .assign-select {
            width: 100%;
            padding: 6px 8px;
            border: 1.5px solid #c8a84b;
            border-radius: 5px;
            background: rgba(255, 255, 255, 0.9);
            color: #3a2a10;
            font-size: 0.85rem;
            outline: none;
            cursor: pointer;
            box-sizing: border-box;
        }

        .assign-select:focus {
            border-color: #8b6914;
        }

        .info-panel {
            width: 350px;
            min-width: 350px;
            background: linear-gradient(135deg, rgba(245, 241, 232, 0.98), rgba(232, 220, 196, 0.98));
            backdrop-filter: blur(10px);
            box-shadow: -5px 0 20px rgba(0, 0, 0, 0.3);
            display: flex;
            flex-direction: column;
            border-left: 3px solid #d4af37;
        }

        .search-box {
            padding: 16px 20px 12px;
            border-bottom: 2px solid rgba(212, 175, 55, 0.4);
            background: rgba(255, 252, 245, 0.7);
            position: relative;
        }

        .search-box label {
            display: block;
            font-family: 'Cinzel', serif;
            font-size: 0.8rem;
            color: #5a4a2f;
            font-weight: 700;
            margin-bottom: 8px;
            letter-spacing: 0.05em;
        }

        #searchInput {
            width: 100%;
            box-sizing: border-box;
            padding: 9px 12px;
            border: 1.5px solid #c8a84b;
            border-radius: 6px;
            font-family: monospace;
            font-size: 0.88rem;
            background: rgba(255, 255, 255, 0.95);
            color: #3a2a10;
            outline: none;
        }

        #searchInput:focus {
            border-color: #8b6914;
            box-shadow: 0 0 0 2px rgba(212, 175, 55, 0.25);
        }

        #searchDropdown {
            display: none;
            position: absolute;
            left: 20px;
            right: 20px;
            background: #fffdf5;
            border: 1.5px solid #c8a84b;
            border-top: none;
            border-radius: 0 0 8px 8px;
            max-height: 260px;
            overflow-y: auto;
            z-index: 2000;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.18);
        }

        #searchDropdown.open {
            display: block;
        }

        .drop-item {
            padding: 9px 14px;
            cursor: pointer;
            border-bottom: 1px solid rgba(212, 175, 55, 0.15);
            transition: background 0.1s;
        }

        .drop-item:last-child {
            border-bottom: none;
        }

        .drop-item:hover,
        .drop-item.active {
            background: rgba(212, 175, 55, 0.18);
        }

        .drop-item-name {
            font-size: 0.9rem;
            color: #3a2a10;
            font-weight: 600;
        }

        .drop-item-key {
            font-family: monospace;
            font-size: 0.75rem;
            color: #7a6a4f;
            margin-top: 1px;
        }

        .drop-item-oldkey {
            font-family: monospace;
            font-size: 0.72rem;
            color: #9a8a6a;
            margin-top: 1px;
            font-style: italic;
        }

        .drop-match {
            background: rgba(212, 175, 55, 0.45);
            border-radius: 2px;
        }

        .info-body {
            flex: 1;
            overflow-y: auto;
            padding: 25px 30px;
        }

        .info-body.empty {
            display: flex;
            align-items: center;
            justify-content: center;
            color: #8a7a5f;
            font-style: italic;
        }

        .info-panel h2 {
            font-family: 'Cinzel', serif;
            font-size: 1.8rem;
            color: #5a4a2f;
            margin: 0 0 18px;
            padding-bottom: 14px;
            border-bottom: 2px solid #d4af37;
            word-break: break-word;
        }

        .info-content {
            font-size: 1rem;
            color: #4a3a25;
            line-height: 1.8;
        }

        .region-details {
            margin-top: 16px;
        }

        .detail-row {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            padding: 10px 0;
            border-bottom: 1px solid rgba(212, 175, 55, 0.2);
            gap: 10px;
        }

        .detail-row:last-child {
            border-bottom: none;
        }

        .detail-label {
            font-weight: 600;
            color: #5a4a2f;
            font-size: 0.9rem;
            white-space: nowrap;
        }

        .detail-value {
            color: #6a5a3f;
            font-size: 0.9rem;
            font-style: italic;
            text-align: right;
            word-break: break-all;
        }

        .back-button {
            position: absolute;
            top: 20px;
            left: 20px;
            background: linear-gradient(135deg, #d4af37, #b8962e);
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            font-family: 'Cinzel', serif;
            font-size: 0.9rem;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
            transition: all 0.3s ease;
            z-index: 1000;
            text-decoration: none;
            display: inline-block;
        }

        .back-button:hover {
            background: linear-gradient(135deg, #b8962e, #d4af37);
            transform: translateY(-2px);
        }

        .faction-banner {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 14px 20px;
            border-bottom: 1px solid rgba(212,175,55,.25);
            background: rgba(255,252,245,.6);
        }
        .faction-swatch {
            width: 36px;
            height: 36px;
            border-radius: 5px;
            flex-shrink: 0;
            border: 2px solid rgba(0,0,0,.15);
        }
        .faction-banner-name {
            font-family: 'Cinzel', serif;
            font-size: 1rem;
            font-weight: 700;
            color: #3a2a10;
        }
        .faction-unassigned-label {
            color: #9a8a6a;
            font-style: italic;
            font-size: .9rem;
        }
        .view-slider {
            display: none;
            gap: 0;
            padding: 8px 14px;
            border-bottom: 1px solid rgba(212,175,55,.3);
            background: rgba(255,252,245,.6);
        }
        .vs-btn {
            flex: 1;
            padding: 6px 0;
            border: 1.5px solid #c8a84b;
            background: transparent;
            font-family: 'Cinzel', serif;
            font-size: .68rem;
            font-weight: 700;
            letter-spacing: .06em;
            color: #7a6a4f;
            cursor: pointer;
            transition: all .2s;
        }
        .vs-btn:first-child { border-radius: 6px 0 0 6px; }
        .vs-btn:last-child  { border-radius: 0 6px 6px 0; border-left: none; }
        .vs-btn:nth-child(2){ border-left: none; }
        .vs-btn.active { background: #5a4a2f; color: #f0d98a; border-color: #5a4a2f; }
        .vs-btn:not(.active):hover { background: rgba(212,175,55,.15); color: #3a2a10; }
    </style>
</head>

<body>
    <a href="index.html" class="back-button">&#8592; Back to Home</a>
    <div class="map-container">
        <div class="map-area" id="mapArea">
            <div id="mapZoomContainer">
            <div class="map-wrapper" id="mapWrapper">
                <img src="background_cib.jpg" alt="New CIB Campaign Map" class="map-image" id="mapImage">
                <canvas id="factionCanvas"></canvas>
                <canvas id="bordersCanvas"></canvas>
                <canvas id="lavorataCanvas"></canvas>
                <canvas id="overlayCanvas"></canvas>
                <canvas id="markersCanvas"></canvas>
                <canvas id="interactiveCanvas"></canvas>
            </div>
            </div>
        </div>
        <div class="info-panel" id="infoPanel">
            <div class="view-toggle">
                <button class="vt-btn active" id="btnRegions" onclick="setView('regions')">Regions</button>
                <button class="vt-btn" id="btnFactions" onclick="setView('factions')">Factions</button>
            </div>
            <div class="view-slider" id="regionsSlider" style="display:flex">
                <button class="vs-btn active" id="vsBtnMap"     onclick="setViewMode('regions')">Map</button>
                <button class="vs-btn"        id="vsBtnWealth"  onclick="setViewMode('wealth')">Wealth</button>
            </div>
            <div class="view-slider" id="factionsSlider" style="display:none">
                <button class="vs-btn active" id="vsBtnFactions" onclick="setViewMode('factions')">Factions</button>
                <button class="vs-btn"        id="vsBtnCultures" onclick="setViewMode('cultures')">Cultures</button>
            </div>
            <div class="faction-toolbar">
                <button class="ft-btn" onclick="exportJSON()">&#11015; Export</button>
                <button class="ft-btn" onclick="saveRegionStatus()">&#128190; Salva JSON</button>
                <label class="ft-btn ft-import">&#128194; Carica JSON
                    <input type="file" id="regionStatusFile" accept=".json" style="display:none" onchange="loadRegionStatusFromFile(this)">
                </label>
                <label class="ft-btn ft-import">&#11014; Import
                    <input type="file" id="importFile" accept=".json" style="display:none" onchange="importJSON(this)">
                </label>
            </div>
            <div class="search-box">
                <label>Cerca regione</label>
                <input type="text" id="searchInput" placeholder="nome, new key, old key..." spellcheck="false"
                    autocomplete="off">
                <div id="searchDropdown"></div>
            </div>
            <div class="info-body empty" id="infoBody">
                <p>Click on a region to view information</p>
            </div>
        </div>
    </div>
    <script src="new_cib_rowdata.js"></script>
    <script src="new_cib_data.js"></script>
    <script>

        const HEX_LIST = ["000080", "0000FF", "002157", "003471", "003663", "004A80", "0054A6", "005952", "005B7F", "006400", "0072BC", "00746B", "0076A3", "008B00", "008B45", "008B8B", "009ACD", "00A99D", "00AEEF", "00B2EE", "00BFF3", "00CD66", "00CED1", "00E5EE", "00EE00", "00EE76", "00EEEE", "00FF00", "050505", "080808", "0D004C", "104E8B", "121212", "1ABBB4", "1B1464", "1F1F1F", "242424", "262626", "27408B", "2E3192", "2E8B57", "303030", "333333", "3CB371", "3D3D3D", "40E0D0", "4169E1", "424242", "436EEE", "448CCB", "458B00", "48D1CC", "4D4D4D", "4EEE94", "4F94CD", "53868B", "54FF9F", "575757", "595959", "5A50BE", "5B4DC2", "5C5C5C", "5CACEE", "5E5E5E", "5F9EA0", "636363", "6495ED", "668B8B", "66CDAA", "6852CD", "6959CD", "696969", "696B69", "698B22", "698B69", "707070", "76EEC6", "787878", "7A67EE", "7A8B8B", "7AC5CD", "7B68EE", "7CFC00", "7D7D7D", "813626", "82616E", "826EFA", "828282", "836FFF", "838B83", "878787", "88CEFF", "8968CD", "8A8A8A", "8B0000", "8B008B", "8B1A1A", "8B2500", "8B3A62", "8B4726", "8B475D", "8B668B", "8B6914", "8B6969", "8B7500", "8B7B8B", "8B7D6B", "8B8378", "8B8682", "8B8878", "8B8970", "8B8B00", "8EE5EE", "8F8F8F", "8FBC8F", "912CEE", "919191", "9370DB", "969696", "9A32CD", "9AC0CD", "9AFF9A", "9B30FF", "9C9C9C", "9DB6CD", "A020F0", "A0522D", "A2CD5A", "A3A3A3", "A6A6A6", "ADADAD", "AFEEEE", "B03060", "B0B0B0", "B0D8E6", "B0E0E6", "B0E2FF", "B22222", "B23AEE", "B3EE3A", "B4CDCD", "B4EEB4", "B5B5B5", "B8B8B8", "B9D3EE", "BA55D3", "BBFFFF", "BC8F8F", "BCD2EE", "BCEE68", "BF3EFF", "C0FF3E", "C70738", "C71585", "C7C7C7", "CAE1FF", "CAFF70", "CCCCCC", "CD0000", "CD1076", "CD2990", "CD3278", "CD3333", "CD3700", "CD5A96", "CD5B45", "CD69C9", "CD7054", "CD8500", "CD9B9B", "CDAF95", "CDB38B", "CDBA96", "CDBE70", "CDC1C5", "CDC5BF", "CDCDB4", "CFCFCF", "D1D1D1", "D1EEEE", "D2B48C", "D4D4D4", "D6D6D6", "D9D9D9", "DA70D6", "DAA520", "DB7093", "DDA0DD", "DEB887", "E0669B", "E0EEE0", "E0EEEE", "E0FFFF", "E3E3E3", "E664B9", "E68AE6", "EE3A8C", "EE3B3B", "EE5C42", "EE64AD", "EE7621", "EE7942", "EE799F", "EE9A49", "EEA964", "EEAD0E", "EEB422", "EEC900", "EECFA1", "EED2EE", "EED5B7", "EED5D2", "EEDD82", "EEDFCC", "EEE0E5", "EEE5DE", "F08080", "F0E68C", "F4F4F4", "F5DEB3", "F5F5DC", "F5F5F5", "F8F8FF", "FA8072", "FAF0E6", "FAFAFA", "FF0000", "FF1493", "FF3030", "FF3E96", "FF4040", "FF4500", "FF5CCB", "FF6347", "FF7256", "FF7F00", "FF8C00", "FFC11B", "FFD39B", "FFDEAD", "FFE4B5", "FFE7BA", "FFEBCD", "FFEC8B", "FFEFD5", "FFF8DC", "FFFACD"];
        // ROW_DATA_B64 loaded from new_cib_rowdata.js

        const MAP_W = 954;
        const MAP_H = 1063;

        function decodeRowData(b64) {
            const bin = atob(b64);
            const buf = new Uint8Array(bin.length);
            for (let i = 0; i < bin.length; i++) buf[i] = bin.charCodeAt(i);
            const view = new DataView(buf.buffer);
            let pos = 0;
            const H = view.getUint16(pos, true); pos += 2;
            const rows = new Array(H);
            for (let y = 0; y < H; y++) {
                const n = view.getUint8(pos); pos++;
                const row = new Uint16Array(n * 3);
                for (let i = 0; i < n; i++) {
                    row[i * 3] = view.getUint16(pos, true); pos += 2;
                    row[i * 3 + 1] = view.getUint16(pos, true); pos += 2;
                    row[i * 3 + 2] = view.getUint8(pos); pos++;
                }
                rows[y] = row;
            }
            return rows;
        }

        function buildRegionIndex(rows) {
            const regionRuns = new Array(HEX_LIST.length).fill(null).map(() => []);
            for (let y = 0; y < rows.length; y++) {
                const row = rows[y];
                for (let i = 0; i < row.length; i += 3) {
                    regionRuns[row[i + 2]].push(y, row[i], row[i + 1]);
                }
            }
            return regionRuns;
        }

        let ROWS = null;
        let REGION_RUNS = null;
        let borderOffscreen = null;

        function buildBorders(W, H) {
            if (!ROWS) return;
            W = W || MAP_W; H = H || MAP_H;
            const idxMap = new Uint16Array(MAP_W * MAP_H);
            for (let y = 0; y < ROWS.length; y++) {
                const row = ROWS[y];
                const base = y * MAP_W;
                for (let i = 0; i < row.length; i += 3) {
                    idxMap.fill(row[i + 2] + 1, base + row[i], base + row[i + 1] + 1);
                }
            }
            const sx = W / MAP_W, sy = H / MAP_H;
            const bd = new Uint8ClampedArray(W * H * 4);
            for (let y = 1; y < MAP_H - 1; y++) {
                for (let x = 1; x < MAP_W - 1; x++) {
                    const off = y * MAP_W + x;
                    const v = idxMap[off];
                    if (!v) continue;
                    if (idxMap[off - 1] !== v || idxMap[off + 1] !== v ||
                        idxMap[off - MAP_W] !== v || idxMap[off + MAP_W] !== v) {
                        const px = Math.round(x * sx), py = Math.round(y * sy);
                        const px1 = Math.round((x + 1) * sx), py1 = Math.round((y + 1) * sy);
                        for (let iy = py; iy < py1; iy++) {
                            for (let ix = px; ix < px1; ix++) {
                                const p = (iy * W + ix) * 4;
                                bd[p] = 210; bd[p + 1] = 210; bd[p + 2] = 215; bd[p + 3] = 180;
                            }
                        }
                    }
                }
            }
            const sharp = document.createElement('canvas');
            sharp.width = W; sharp.height = H;
            sharp.getContext('2d').putImageData(new ImageData(bd, W, H), 0, 0);
            borderOffscreen = document.createElement('canvas');
            borderOffscreen.width = W; borderOffscreen.height = H;
            const bctx = borderOffscreen.getContext('2d');
            bctx.filter = 'blur(1.2px)';
            bctx.drawImage(sharp, 0, 0);
            bctx.filter = 'none';
        }

            if (!borderOffscreen || bordersCanvas.width === 0) return;

        function saveWealth() { try { localStorage.setItem(WEALTH_KEY, JSON.stringify(wealthData)); } catch(e) {} }
        function getWealth(key) { return wealthData[key] ?? 100; }
        function wealthColor(val) {
            const t = Math.max(0, Math.min(1, (val - 100) / 100));
            let r, g, b;
            if (t <= 0.5) {
                const s = t * 2;
                r = Math.round(139 + (212 - 139) * s);
                g = Math.round(26  + (170 - 26)  * s);
                b = Math.round(26  + (0   - 26)  * s);
            } else {
                const s = (t - 0.5) * 2;
                r = Math.round(212 + (42  - 212) * s);
                g = Math.round(170 + (122 - 170) * s);
                b = Math.round(0   + (42  - 0)   * s);
            }
            return `rgb(${r},${g},${b})`;
        }

        function calcCentroid(hexIdx) {
            if (!REGION_RUNS) return null;
            const runs = REGION_RUNS[hexIdx];
            if (!runs || runs.length === 0) return null;
            let sumX = 0, sumY = 0, count = 0;
            for (let i = 0; i < runs.length; i += 3) {
                const y = runs[i], x0 = runs[i + 1], x1 = runs[i + 2];
                const len = x1 - x0 + 1;
                sumX += (x0 + x1) / 2 * len;
                sumY += y * len;
                count += len;
            }
            return count > 0 ? { x: sumX / count, y: sumY / count } : null;
        }

        function getMarkerPos(hexIdx) {
            return markerPos[hexIdx] || calcCentroid(hexIdx);
        }

        function drawTemple(ctx, cx, cy, sz) {
            ctx.save();
            ctx.translate(cx, cy);
            const s = sz / 18;
            ctx.shadowColor = 'rgba(0,0,0,0.55)';
            ctx.shadowBlur = 3;
            ctx.shadowOffsetX = 1; ctx.shadowOffsetY = 1;
            ctx.fillStyle = '#cc1111';
            ctx.strokeStyle = 'rgba(255,255,255,0.85)';
            ctx.lineWidth = 1;
            ctx.lineJoin = 'miter';
            // Roof
            ctx.beginPath();
            ctx.moveTo(0, -9 * s); ctx.lineTo(9 * s, -3 * s); ctx.lineTo(-9 * s, -3 * s);
            ctx.closePath(); ctx.fill(); ctx.stroke();
            // Frieze
            ctx.fillRect(-9 * s, -3 * s, 18 * s, 2.5 * s);
            ctx.strokeRect(-9 * s, -3 * s, 18 * s, 2.5 * s);
            // Columns (3)
            for (let i = 0; i < 3; i++) {
                const x = -5.5 * s + i * 5.5 * s;
                ctx.fillRect(x - 1.5 * s, -0.5 * s, 3 * s, 7 * s);
                ctx.strokeRect(x - 1.5 * s, -0.5 * s, 3 * s, 7 * s);
            }
            // Base
            ctx.fillRect(-9 * s, 6.5 * s, 18 * s, 2.5 * s);
            ctx.strokeRect(-9 * s, 6.5 * s, 18 * s, 2.5 * s);
            ctx.restore();
        }

        function drawAnchor(ctx, cx, cy, sz) {
            ctx.save();
            ctx.translate(cx, cy);
            const s = sz / 18;
            ctx.lineCap = 'round'; ctx.lineJoin = 'round';
            ctx.shadowColor = 'rgba(0,0,0,0.55)';
            ctx.shadowBlur = 3;
            ctx.shadowOffsetX = 1; ctx.shadowOffsetY = 1;

            function anchorStrokes(lw, color) {
                ctx.strokeStyle = color; ctx.lineWidth = lw;
                ctx.beginPath(); ctx.moveTo(0, -5 * s); ctx.lineTo(0, 7 * s); ctx.stroke();
                ctx.beginPath(); ctx.moveTo(-6 * s, -1.5 * s); ctx.lineTo(6 * s, -1.5 * s); ctx.stroke();
                ctx.beginPath(); ctx.arc(0, 3.5 * s, 4.5 * s, Math.PI, 0); ctx.stroke();
                ctx.beginPath(); ctx.moveTo(-4.5 * s, 3.5 * s); ctx.lineTo(-6 * s, 5.5 * s); ctx.stroke();
                ctx.beginPath(); ctx.moveTo(4.5 * s, 3.5 * s); ctx.lineTo(6 * s, 5.5 * s); ctx.stroke();
            }
            anchorStrokes(3.5 * s, 'rgba(255,255,255,0.85)');
            anchorStrokes(2 * s, '#1144bb');
            // Ring
            ctx.beginPath(); ctx.arc(0, -7 * s, 2 * s, 0, Math.PI * 2);
            ctx.strokeStyle = 'rgba(255,255,255,0.85)'; ctx.lineWidth = 3 * s; ctx.stroke();
            ctx.beginPath(); ctx.arc(0, -7 * s, 2 * s, 0, Math.PI * 2);
            ctx.strokeStyle = '#1144bb'; ctx.lineWidth = 2 * s; ctx.stroke();
            ctx.restore();
        }

                if (portoSet.has(region.new_key)) drawAnchor(ctx, pos.x * scaleX, pos.y * scaleY, sz);

            for (let i = 0; i < HEX_LIST.length; i++) {
                const region = COLOR_MAP[HEX_LIST[i]];
                if (!region || region.sea) continue;
                const pos = getMarkerPos(i);
                if (!pos) continue;
                const dx = mx - pos.x, dy = my - pos.y;

        let FACTIONS = JSON.parse(JSON.stringify(DEFAULT_FACTIONS));
        let FACTION_DATA = JSON.parse(JSON.stringify(DEFAULT_ASSIGNMENTS));

        // Load saved state if present
        (function loadState() {
            try {
                const s = localStorage.getItem(FACTION_STATE_KEY);
                if (s) { const d = JSON.parse(s); if (d.factions) FACTIONS = d.factions; if (d.assignments) FACTION_DATA = d.assignments; }
            } catch (e) { }
        })();

        function saveState() {
            try { localStorage.setItem(FACTION_STATE_KEY, JSON.stringify({ version: 1, factions: FACTIONS, assignments: FACTION_DATA })); } catch (e) { }
        }

        function exportJSON() {
            const blob = new Blob([JSON.stringify({ version: 1, factions: FACTIONS, assignments: FACTION_DATA }, null, 2)], { type: "application/json" });
            const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = "cib_factions.json"; a.click(); URL.revokeObjectURL(a.href);
        }

        function importJSON(input) {
            const file = input.files[0]; if (!file) return;
            const reader = new FileReader();
            reader.onload = function (e) {
                try {
                    const d = JSON.parse(e.target.result);
                    if (!d.factions || !d.assignments) throw new Error("Invalid format — expected {factions, assignments}");
                    FACTIONS = d.factions; FACTION_DATA = d.assignments; saveState();
                    if (viewMode === "factions" || viewMode === "cultures") { drawFactions(); if (currentSelectedIdx < 0) showFactionLegend(); else showRegionInfo(currentSelectedIdx); }
                    else if (currentSelectedIdx >= 0) showRegionInfo(currentSelectedIdx);
                } catch (err) { alert("Import failed: " + err.message); }
                input.value = "";
            };
            reader.readAsText(file);
        }

        function assignRegion(newKey, factionName) {
            if (factionName) FACTION_DATA[newKey] = factionName; else delete FACTION_DATA[newKey];
            saveState();
            if (viewMode === "factions" || viewMode === "cultures") drawFactions();
        }

        function deleteFaction(name) {
            const count = Object.values(FACTION_DATA).filter(v => v === name).length;
            if (count > 0 && !confirm(`Delete "${name}"?\nThis will unassign ${count} region(s).`)) return;
            delete FACTIONS[name];
            for (const k in FACTION_DATA) { if (FACTION_DATA[k] === name) delete FACTION_DATA[k]; }
            saveState();
            if (viewMode === "factions" || viewMode === "cultures") { drawFactions(); if (currentSelectedIdx >= 0) showRegionInfo(currentSelectedIdx); }
            showFactionLegend();
        }

        function toggleAddForm() {
            const form = document.getElementById("flAddForm");
            const btn = document.getElementById("flAddToggle");
            const show = form.style.display === "none" || form.style.display === "";
            form.style.display = show ? "flex" : "none";
            btn.style.display = show ? "none" : "";
            if (show) setTimeout(() => document.getElementById("flName").focus(), 50);
        }

        function confirmAddFaction() {
            const name = (document.getElementById("flName").value || "").trim();
            const color = document.getElementById("flColor").value;
            if (!name) { document.getElementById("flName").focus(); return; }
            if (FACTIONS[name]) { alert(`"${name}" already exists.`); return; }
            FACTIONS[name] = { color, label: name }; saveState();
            if (viewMode === "factions" || viewMode === "cultures") drawFactions();
            showFactionLegend();
        }

        // --- View mode ---
        // 'regions' | 'wealth'  → Regions tab sub-modes
        // 'factions' | 'cultures' → Factions tab sub-modes
        let viewMode = "regions";
        let lastRegionsSubMode  = "regions";
        let lastFactionsSubMode = "factions";

        function _syncSubBtns() {
            const map = {
                regions: 'vsBtnMap', wealth: 'vsBtnWealth',
                factions: 'vsBtnFactions', cultures: 'vsBtnCultures'
            };
            Object.entries(map).forEach(([m, id]) => {
                const el = document.getElementById(id);
                if (el) el.classList.toggle('active', viewMode === m);
            });
        }

        function setView(mainTab) {
            const isFactions = (mainTab === "factions");
            viewMode = isFactions ? lastFactionsSubMode : lastRegionsSubMode;
            document.getElementById("btnRegions").classList.toggle("active", !isFactions);
            document.getElementById("btnFactions").classList.toggle("active", isFactions);
            document.getElementById("regionsSlider").style.display  = !isFactions ? "flex" : "none";
            document.getElementById("factionsSlider").style.display =  isFactions ? "flex" : "none";
            _syncSubBtns();
            if (viewMode === 'factions' || viewMode === 'cultures' || viewMode === 'wealth') {
                drawFactions();
                if (currentSelectedIdx < 0) {
                    if (viewMode === 'wealth') showWealthLegend(); else showFactionLegend();
                } else showRegionInfo(currentSelectedIdx);
            } else {
                factionCanvas.getContext("2d").clearRect(0, 0, factionCanvas.width, factionCanvas.height);
                if (currentSelectedIdx < 0) clearInfoPanel(); else showRegionInfo(currentSelectedIdx);
            }
        }

        function setViewMode(subMode) {
            viewMode = subMode;
            if (subMode === 'regions' || subMode === 'wealth') lastRegionsSubMode  = subMode;
            else                                               lastFactionsSubMode = subMode;
            _syncSubBtns();
            if (subMode === 'factions' || subMode === 'cultures' || subMode === 'wealth') {
                drawFactions();
            } else {
                factionCanvas.getContext("2d").clearRect(0, 0, factionCanvas.width, factionCanvas.height);
            }
            if (currentSelectedIdx >= 0) { drawHighlight(currentSelectedIdx, true); showRegionInfo(currentSelectedIdx); }
            else {
                if (subMode === 'factions' || subMode === 'cultures') showFactionLegend();
                else if (subMode === 'wealth') showWealthLegend();
                else clearInfoPanel();
            }
        }

        const mapArea          = document.getElementById("mapArea");
        const mapZoomContainer = document.getElementById("mapZoomContainer");

        const bordersCanvas  = document.getElementById("bordersCanvas");

        const overlayCanvas = document.getElementById("overlayCanvas");
        const markersCanvas = document.getElementById("markersCanvas");
        const interactiveCanvas = document.getElementById("interactiveCanvas");
        const infoPanel = document.getElementById("infoBody");
        const searchInput = document.getElementById("searchInput");
        const searchDropdown = document.getElementById("searchDropdown");

        let currentHoverIdx = -1;
        let currentSelectedIdx = -1;

        // --- Canvas sizing ---
        function resizeCanvases() {
            const w = mapImage.clientWidth;
            const h = mapImage.clientHeight;
            if (w === 0 || h === 0) { requestAnimationFrame(resizeCanvases); return; }
            if (interactiveCanvas.width === w && interactiveCanvas.height === h) return;
            [factionCanvas, bordersCanvas, lavorataCanvas, overlayCanvas, markersCanvas, interactiveCanvas].forEach(c => {
                c.width = w; c.height = h;
                c.style.width = w + "px"; c.style.height = h + "px";
            });
            if (viewMode === 'factions' || viewMode === 'cultures' || viewMode === 'wealth') drawFactions();
            buildBorders(w, h);
            drawBorders();
            drawLavorata();
            if (currentSelectedIdx >= 0) drawHighlight(currentSelectedIdx, true);
            drawMarkers();
        }

        function drawFactions() {
            const ctx = factionCanvas.getContext("2d");
            ctx.clearRect(0, 0, factionCanvas.width, factionCanvas.height);
            if (!REGION_RUNS) return;
            const scaleX = factionCanvas.width / MAP_W;
            const scaleY = factionCanvas.height / MAP_H;
            HEX_LIST.forEach((hex, hexIdx) => {
                const region = COLOR_MAP[hex];
                if (!region || region.sea) return;
                const fname = FACTION_DATA[region.new_key];
                // Wealth applies to all regions regardless of faction assignment
                if (!fname && viewMode !== "wealth") return;
                let col;
                if (viewMode === "cultures") {
                    const cname = CULTURE_MAP[fname];
                    if (!cname || !CULTURES[cname]) return;
                    col = CULTURES[cname].color;
                } else if (viewMode === "wealth") {
                    col = wealthColor(getWealth(region.new_key));
                } else {
                    if (!FACTIONS[fname]) return;
                    col = FACTIONS[fname].color;
                }
                const r = parseInt(col.slice(1, 3), 16);
                const g = parseInt(col.slice(3, 5), 16);
                const b = parseInt(col.slice(5, 7), 16);
                ctx.fillStyle = `rgba(${r},${g},${b},0.65)`;
                const runs = REGION_RUNS[hexIdx];
                for (let i = 0; i < runs.length; i += 3) {
                    ctx.fillRect(runs[i + 1] * scaleX, runs[i] * scaleY, (runs[i + 2] - runs[i + 1] + 1) * scaleX, scaleY + 0.5);
                }
            });
        }

        function showFactionLegend() {
            infoPanel.classList.remove("empty");
            if (viewMode === 'cultures') {
                const counts = {};
                Object.values(FACTION_DATA).forEach(f => {
                    const c = CULTURE_MAP[f];
                    if (c) counts[c] = (counts[c] || 0) + 1;
                });
                const items = Object.keys(CULTURES).map(name => {
                    const c = CULTURES[name];
                    return `<div class="fl-item">
                        <span class="legend-swatch" style="background:${c.color}"></span>
                        <span class="fl-name">${escapeHtml(name)}</span>
                        <span class="fl-count">${counts[name] || 0}</span>
                    </div>`;
                }).join('');
                infoPanel.innerHTML = `<div class="faction-legend"><h3>Cultures</h3>${items}</div>`;
                return;
            }
            const items = Object.entries(FACTIONS).map(([key, f]) => {
                const count = Object.values(FACTION_DATA).filter(v => v === key).length;
                const safeKey = key.replace(/'/g, "\\'");
                return `<div class="fl-item">
            <span class="legend-swatch" style="background:${f.color}"></span>
            <span class="fl-name">${escapeHtml(f.label || key)}</span>
            <span class="fl-count">${count}</span>
            <button class="fl-del" onclick="deleteFaction('${safeKey}')" title="Delete">✕</button>
        </div>`;
            }).join('');
            infoPanel.innerHTML = `
        <div class="faction-legend">
            <h3>Factions</h3>
            ${items}
            <div class="legend-unassigned">
                <span class="legend-swatch" style="background:transparent;border:1.5px dashed #bbb"></span>

                <button class="fl-add-btn" id="flAddToggle" onclick="toggleAddForm()">＋ Add Faction</button>

                    <div class="fl-color-row">
                        <span>Colour:</span>
                        <input type="color" id="flColor" value="#888888">

                        <button class="fl-confirm" onclick="confirmAddFaction()">Add</button>
                        <button class="fl-cancel"  onclick="toggleAddForm()">Cancel</button>
                    </div>
                </div>
            </div>
        </div>`;
        }

        function toLookupCoords(cx, cy) {
            const r = interactiveCanvas.getBoundingClientRect();
            return {
                x: Math.round(cx * MAP_W / r.width),
                y: Math.round(cy * MAP_H / r.height)
            };
        }

        function getRegionIdxAt(x, y) {
            if (!ROWS || y < 0 || y >= ROWS.length) return -1;
            const row = ROWS[y];
            for (let i = 0; i < row.length; i += 3)
                if (x >= row[i] && x <= row[i + 1]) return row[i + 2];
            return -1;
        }

        // --- Draw lavorata stripes (permanent layer) ---
        function drawLavorata() {
            const ctx = lavorataCanvas.getContext("2d");
            ctx.clearRect(0, 0, lavorataCanvas.width, lavorataCanvas.height);
            if (!lavorataSet.size || !REGION_RUNS) return;
            const scaleX = lavorataCanvas.width / MAP_W;
            const scaleY = lavorataCanvas.height / MAP_H;
            ctx.fillStyle = getStripePattern(ctx);
            for (const hexIdx of lavorataSet) {
                const runs = REGION_RUNS[hexIdx];
                for (let i = 0; i < runs.length; i += 3) {
                    const y = runs[i], xs = runs[i + 1], xe = runs[i + 2];
                    ctx.fillRect(xs * scaleX, y * scaleY, (xe - xs + 1) * scaleX, scaleY + 0.5);
                }
            }
        }

        // --- Draw hover/selection highlight ---
        function drawHighlight(hexIdx, isSelected) {
            const ctx = overlayCanvas.getContext("2d");
            ctx.clearRect(0, 0, overlayCanvas.width, overlayCanvas.height);
            if (hexIdx < 0 || !REGION_RUNS) return;
            const scaleX = overlayCanvas.width / MAP_W;
            const scaleY = overlayCanvas.height / MAP_H;
            const h = Math.ceil(scaleY) + 1;

            function fillRegion(idx, style) {
                ctx.fillStyle = style;
                const runs = REGION_RUNS[idx];
                for (let i = 0; i < runs.length; i += 3)
                    ctx.fillRect(runs[i + 1] * scaleX, runs[i] * scaleY, (runs[i + 2] - runs[i + 1] + 1) * scaleX, h);
            }

            if (isSelected) {
                if (viewMode === "factions" || viewMode === "cultures") {
                    const selFaction = FACTION_DATA[COLOR_MAP[HEX_LIST[hexIdx]]?.new_key];
                    if (selFaction) {
                        HEX_LIST.forEach((hex, i) => {
                            if (i === hexIdx) return;
                            const r = COLOR_MAP[hex];
                            if (!r || r.sea) return;
                            if (viewMode === "cultures") {
                                if (CULTURE_MAP[FACTION_DATA[r.new_key]] !== CULTURE_MAP[selFaction]) return;
                            } else {
                                if (FACTION_DATA[r.new_key] !== selFaction) return;
                            }
                            fillRegion(i, "rgba(255,220,80,0.20)");
                        });
                    }
                }
                fillRegion(hexIdx, "rgba(212,175,55,0.50)");
            } else {
                fillRegion(hexIdx, "rgba(255,255,255,0.28)");
            }
        }

                        ${Object.entries(FACTIONS).map(([k, f]) => `<option value="${escapeHtml(k)}" ${FACTION_DATA[region.new_key] === k ? 'selected' : ''}>${escapeHtml(f.label || k)}</option>`).join('')}
                    </select>
                </div>
                <div class="detail-row" style="flex-direction:column;align-items:flex-start;gap:6px;padding-top:16px;">
                    <span class="detail-label">Wealth: <span id="wealthVal" style="font-style:italic;color:#6a5a3f">${curWealth}</span></span>
                    <input type="range" id="wealthRange" min="100" max="200" value="${curWealth}"
                           style="width:100%;cursor:pointer;accent-color:#5a4a2f">
                </div>
                <div class="detail-row" style="padding-top:8px;">
                    <label style="display:flex;align-items:center;gap:10px;cursor:pointer;font-weight:600;color:#5a4a2f;font-size:1rem;">

                    </label>
                </div>
                ${!region.sea ? `
                <div class="detail-row" style="border-bottom:none;padding-top:8px;">
                    <label style="display:flex;align-items:center;gap:10px;cursor:pointer;font-weight:600;color:#1144bb;font-size:1rem;">
                        <input type="checkbox" id="portoCheck" ${portoSet.has(region.new_key) ? "checked" : ""}
                               style="width:18px;height:18px;cursor:pointer;accent-color:#1144bb;">
                        Porto
                    </label>
                </div>` : ''}
            </div>
        </div>
    `;
            document.getElementById("lavorataCheck").addEventListener("change", function () {
                if (this.checked) lavorataSet.add(hexIdx);
                else lavorataSet.delete(hexIdx);
                if (regionStatus[region.new_key]) regionStatus[region.new_key].edited = this.checked;
                saveLavorata();
                drawLavorata();
            });
            if (!region.sea) {
                document.getElementById("portoCheck").addEventListener("change", function () {
                    if (this.checked) portoSet.add(region.new_key);
                    else portoSet.delete(region.new_key);
                    if (regionStatus[region.new_key]) regionStatus[region.new_key].porto = this.checked;
                    savePorto();
                    drawMarkers();
                });
            }
            document.getElementById("wealthRange").addEventListener("input", function () {
                const v = parseInt(this.value);
                wealthData[region.new_key] = v;
                document.getElementById("wealthVal").textContent = v;
                saveWealth();
                if (viewMode === 'wealth') drawFactions();
            });
        }

        function showWealthLegend() {
            infoPanel.classList.remove("empty");
            infoPanel.innerHTML = `
        <div class="faction-legend">
            <h3>Wealth</h3>
            <div style="padding:10px 0 6px">
                <div style="background:linear-gradient(to right,#8B1A1A,#D4AA00,#2A7A2A);height:22px;border-radius:5px;border:1px solid rgba(0,0,0,.15)"></div>
                <div style="display:flex;justify-content:space-between;font-size:.75rem;color:#5a4a2f;margin-top:5px;font-family:'Cinzel',serif;font-weight:700;">
                    <span>100</span><span>150</span><span>200</span>
                </div>
            </div>
            <p style="font-size:.82rem;color:#7a6a4f;margin-top:12px;line-height:1.5">
                Click a region to view and edit its wealth (100 = default, 200 = max).
            </p>
        </div>`;
        }

        function clearInfoPanel() {
            if (viewMode === 'factions' || viewMode === 'cultures') { showFactionLegend(); return; }
            if (viewMode === 'wealth') { showWealthLegend(); return; }
            infoPanel.classList.add("empty");
            infoPanel.innerHTML = "<p>Click on a region to view information</p>";
        }

        // --- Autocomplete search ---
        let dropActiveIdx = -1;

        function escapeHtml(s) {
            return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        }

        function highlight(text, query) {
            if (!query) return escapeHtml(text);
            const lo = text.toLowerCase();
            const qi = lo.indexOf(query);
            if (qi < 0) return escapeHtml(text);
            return escapeHtml(text.slice(0, qi))
                + '<span class="drop-match">' + escapeHtml(text.slice(qi, qi + query.length)) + '</span>'
                + escapeHtml(text.slice(qi + query.length));
        }

        function selectDropItem(entry) {
            searchInput.value = entry.name;
            closeDropdown();
            currentSelectedIdx = entry.idx;
            drawHighlight(entry.idx, true);
            showRegionInfo(entry.idx);
        }

        function closeDropdown() {
            searchDropdown.classList.remove("open");
            searchDropdown.innerHTML = "";
            dropActiveIdx = -1;
        }

        function updateDropdown() {
            const query = searchInput.value.trim().toLowerCase();
            if (!query) { closeDropdown(); return; }

            const matches = SEARCH_ENTRIES.filter(e => e.searchText.includes(query));
            if (!matches.length) {
                searchDropdown.innerHTML = '<div class="drop-item" style="color:#888;cursor:default;">Nessun risultato</div>';
                searchDropdown.classList.add("open");
                dropActiveIdx = -1;
                return;
            }

            const MAX = 15;
            const shown = matches.slice(0, MAX);
            searchDropdown.innerHTML = shown.map((e, i) => {
                const hasOld = e.old_key && e.old_key !== "nuova regione";
                const oldLine = hasOld ? `<div class="drop-item-oldkey">${highlight(e.old_key, query)}</div>` : "";
                return `<div class="drop-item" data-i="${i}">
            <div class="drop-item-name">${highlight(e.name, query)}</div>
            <div class="drop-item-key">${highlight(e.new_key, query)}</div>
            ${oldLine}
        </div>`;
            }).join("");
            if (matches.length > MAX) {
                searchDropdown.innerHTML += `<div class="drop-item" style="color:#888;cursor:default;font-size:0.8rem;">...e altri ${matches.length - MAX}</div>`;
            }
            searchDropdown.classList.add("open");
            dropActiveIdx = -1;

            // Attach click handlers
            searchDropdown.querySelectorAll(".drop-item[data-i]").forEach(el => {
                el.addEventListener("mousedown", function (e) {
                    e.preventDefault();
                    selectDropItem(shown[parseInt(this.dataset.i)]);
                });
            });
        }

        searchInput.addEventListener("input", updateDropdown);

        searchInput.addEventListener("keydown", function (e) {
            const items = searchDropdown.querySelectorAll(".drop-item[data-i]");
            if (!items.length) return;
            if (e.key === "ArrowDown") {
                e.preventDefault();
                dropActiveIdx = Math.min(dropActiveIdx + 1, items.length - 1);
            } else if (e.key === "ArrowUp") {
                e.preventDefault();
                dropActiveIdx = Math.max(dropActiveIdx - 1, 0);
            } else if (e.key === "Enter") {
                e.preventDefault();
                if (dropActiveIdx >= 0) items[dropActiveIdx].dispatchEvent(new MouseEvent("mousedown"));
                return;
            } else if (e.key === "Escape") {
                closeDropdown(); return;
            } else { return; }
            items.forEach((el, i) => el.classList.toggle("active", i === dropActiveIdx));
            if (dropActiveIdx >= 0) items[dropActiveIdx].scrollIntoView({ block: "nearest" });
        });

        searchInput.addEventListener("blur", function () {
            setTimeout(closeDropdown, 150);
        });

        // --- Zoom & Pan ---
        let zoom = 1, panX = 0, panY = 0;
        const MIN_ZOOM = 0.4, MAX_ZOOM = 10;
        let isPanning = false, panX0 = 0, panY0 = 0, panMx0 = 0, panMy0 = 0, panMoved = false;

        function applyTransform() {
            mapZoomContainer.style.transform = `translate(${panX}px,${panY}px) scale(${zoom})`;
        }

        function initPan() {
            const aW = mapArea.clientWidth, aH = mapArea.clientHeight;
            const mW = mapImage.naturalWidth || mapImage.clientWidth;
            const mH = mapImage.naturalHeight || mapImage.clientHeight;
            if (!mW || !mH) return;
            zoom = Math.min((aW - 40) / mW, (aH - 40) / mH, 1);
            panX = (aW - mW * zoom) / 2;
            panY = (aH - mH * zoom) / 2;
            applyTransform();
        }

        mapArea.addEventListener('wheel', function(e) {
            e.preventDefault();
            const rect   = mapArea.getBoundingClientRect();
            const mx     = e.clientX - rect.left;
            const my     = e.clientY - rect.top;
            const factor = e.deltaY < 0 ? 1.12 : 1 / 1.12;
            const newZ   = Math.max(MIN_ZOOM, Math.min(MAX_ZOOM, zoom * factor));
            panX = mx - (mx - panX) * (newZ / zoom);
            panY = my - (my - panY) * (newZ / zoom);
            zoom = newZ;
            applyTransform();
        }, { passive: false });

        // --- Mouse events ---
        interactiveCanvas.addEventListener("mousedown", function (e) {
            if (!ROWS) return;
            const rect = interactiveCanvas.getBoundingClientRect();
            const { x, y } = toLookupCoords(e.clientX - rect.left, e.clientY - rect.top);
            const hit = markerHitTest(x, y);
            if (hit >= 0) {
                dragHexIdx = hit;
                const pos = getMarkerPos(hit);
                dragMapX0 = x; dragMapY0 = y;
                dragPosX0 = pos.x; dragPosY0 = pos.y;
                interactiveCanvas.style.cursor = 'grabbing';
                e.preventDefault();
                return;
            }
            // Start pan
            isPanning = true; panMoved = false;
            panX0 = panX; panY0 = panY;
            panMx0 = e.clientX; panMy0 = e.clientY;
        });

        interactiveCanvas.addEventListener("mouseup", function () {
            if (dragHexIdx >= 0) { saveMarkers(); dragHexIdx = -1; }
            if (isPanning && panMoved) wasDragging = true;
            isPanning = false;
            mapZoomContainer.classList.remove('panning');
        });

        interactiveCanvas.addEventListener("mousemove", function (e) {
            if (!ROWS) return;
            // Pan
            if (isPanning && dragHexIdx < 0) {
                const dx = e.clientX - panMx0, dy = e.clientY - panMy0;
                if (!panMoved && (Math.abs(dx) > 4 || Math.abs(dy) > 4)) {
                    panMoved = true;
                    mapZoomContainer.classList.add('panning');
                }
                if (panMoved) {
                    panX = panX0 + dx; panY = panY0 + dy;
                    applyTransform();
                    return;
                }
            }
            const rect = interactiveCanvas.getBoundingClientRect();
            const { x, y } = toLookupCoords(e.clientX - rect.left, e.clientY - rect.top);
            if (dragHexIdx >= 0) {
                markerPos[dragHexIdx] = {
                    x: Math.max(0, Math.min(MAP_W, dragPosX0 + (x - dragMapX0))),
                    y: Math.max(0, Math.min(MAP_H, dragPosY0 + (y - dragMapY0)))
                };
                wasDragging = true;
                drawMarkers();
                interactiveCanvas.style.cursor = 'grabbing';
                return;
            }
            const idx = getRegionIdxAt(x, y);
            if (idx < 0) {
                interactiveCanvas.style.cursor = "default";
                if (currentHoverIdx !== -1) {
                    currentHoverIdx = -1;
                    if (currentSelectedIdx >= 0) drawHighlight(currentSelectedIdx, true);
                    else overlayCanvas.getContext("2d").clearRect(0, 0, overlayCanvas.width, overlayCanvas.height);
                }
                return;
            }
            interactiveCanvas.style.cursor = "pointer";
            if (currentHoverIdx !== idx) {
                currentHoverIdx = idx;
                if (currentSelectedIdx >= 0 && currentSelectedIdx !== idx) {
                    drawHighlight(currentSelectedIdx, true);
                    const ctx = overlayCanvas.getContext("2d");
                    const scaleX = overlayCanvas.width / MAP_W;
                    const scaleY = overlayCanvas.height / MAP_H;
                    const hh = Math.ceil(scaleY) + 1;
                    const runs = REGION_RUNS[idx];
                    ctx.fillStyle = "rgba(255,255,255,0.22)";
                    for (let i = 0; i < runs.length; i += 3) {
                        ctx.fillRect(runs[i + 1] * scaleX, runs[i] * scaleY, (runs[i + 2] - runs[i + 1] + 1) * scaleX, hh);
                    }
                } else if (currentSelectedIdx !== idx) {
                    drawHighlight(idx, false);
                }
            }
        });

        interactiveCanvas.addEventListener("mouseleave", function () {
            isPanning = false;
            mapZoomContainer.classList.remove('panning');
            currentHoverIdx = -1;
            if (currentSelectedIdx >= 0) drawHighlight(currentSelectedIdx, true);
            else overlayCanvas.getContext("2d").clearRect(0, 0, overlayCanvas.width, overlayCanvas.height);
        });

        interactiveCanvas.addEventListener("click", function (e) {
            if (!ROWS) return;
            if (wasDragging) { wasDragging = false; return; }
            const rect = interactiveCanvas.getBoundingClientRect();
            const { x, y } = toLookupCoords(e.clientX - rect.left, e.clientY - rect.top);
            const idx = getRegionIdxAt(x, y);
            if (idx < 0) {
                currentSelectedIdx = -1;
                drawHighlight(-1, false);
                clearInfoPanel();
                return;
            }
            if (currentSelectedIdx === idx) {
                currentSelectedIdx = -1;
                clearInfoPanel();
                drawHighlight(-1, false);
            } else {
                currentSelectedIdx = idx;
                drawHighlight(idx, true);
                showRegionInfo(idx);
            }
        });

        // --- Init ---
        window.addEventListener("resize", resizeCanvases);
        if (typeof ResizeObserver !== "undefined") {
            new ResizeObserver(function () { resizeCanvases(); }).observe(mapImage);
        }
        mapImage.addEventListener("load", function () {
            requestAnimationFrame(() => { resizeCanvases(); initPan(); });
        });
        if (mapImage.complete && mapImage.naturalWidth > 0) {
            requestAnimationFrame(() => { resizeCanvases(); initPan(); });
        }
        loadRegionStatus().then(() => {
            requestAnimationFrame(() => { drawLavorata(); drawMarkers(); });
        });
    </script>
</body>

</html>
