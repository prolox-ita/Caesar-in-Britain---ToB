<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Region Editor</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{background:#111;color:#bbb;font-family:'Consolas','Courier New',monospace;font-size:12px;height:100vh;display:flex;flex-direction:column;overflow:hidden}
header{padding:7px 14px;background:#1a1a1a;border-bottom:1px solid #C5B358;display:flex;align-items:center;gap:12px;flex-shrink:0}
header h1{font-size:.8rem;letter-spacing:.18em;color:#C5B358;font-weight:normal}
.hbtn{padding:3px 10px;background:transparent;border:1px solid #333;color:#777;cursor:pointer;font-family:inherit;font-size:.7rem;border-radius:2px;transition:all .15s;white-space:nowrap}
.hbtn:hover{border-color:#C5B358;color:#C5B358}
.hbtn.danger:hover{border-color:#cc4444;color:#cc4444}
.hint{font-size:.65rem;color:#3a3a3a;margin-left:auto}
.toolbar{padding:5px 14px;background:#161616;border-bottom:1px solid #1e1e1e;display:flex;gap:8px;align-items:center;flex-shrink:0;flex-wrap:wrap}
#search{flex:1;max-width:280px;background:#0d0d0d;border:1px solid #2a2a2a;color:#bbb;padding:4px 9px;font-family:inherit;font-size:11px;outline:none;border-radius:2px}
#search:focus{border-color:#444}
#search::placeholder{color:#333}
.tb-btn{padding:3px 9px;background:transparent;border:1px solid #2a2a2a;color:#555;cursor:pointer;font-family:inherit;font-size:.7rem;border-radius:2px;transition:all .15s;white-space:nowrap}
.tb-btn:hover,.tb-btn.active{border-color:#C5B358;color:#C5B358}
.stats{font-size:.68rem;color:#444;margin-left:auto}
.wrap{flex:1;overflow:auto}
table{border-collapse:collapse;width:100%}
thead th{position:sticky;top:0;z-index:10;padding:5px 10px;background:#161616;border-bottom:2px solid #222;font-size:.65rem;letter-spacing:.12em;color:#C5B358;text-transform:uppercase;text-align:left;white-space:nowrap}
thead th.center{text-align:center}
tbody tr{border-bottom:1px solid #1a1a1a;transition:background .08s}
tbody tr:hover{background:#161616}
tbody tr.hidden{display:none}
td{padding:5px 10px;vertical-align:middle}
td.name-cell{color:#ccc;min-width:180px}
td.key-cell{color:#444;font-size:10px;min-width:220px}
td.chk-cell{text-align:center;width:80px}
.chk{width:16px;height:16px;cursor:pointer;accent-color:#C5B358}
.badge{display:inline-block;padding:1px 6px;border-radius:2px;font-size:.62rem;margin-right:3px}
.badge.ed{background:rgba(197,179,88,.15);color:#C5B358;border:1px solid rgba(197,179,88,.3)}
.badge.po{background:rgba(0,100,160,.2);color:#5ab4e0;border:1px solid rgba(0,100,160,.3)}
.drop-zone{position:fixed;inset:0;background:rgba(0,0,0,.7);display:none;align-items:center;justify-content:center;z-index:100;font-size:1rem;color:#C5B358;letter-spacing:.1em}
.drop-zone.active{display:flex}
</style>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="navbar.css">
</head>
<body class="has-navbar">

    <nav class="navbar">
        <a href="index.html" class="logo">Caesars in Britain</a>
        <ul class="nav-links">
            <li><a href="index.html#history">History</a></li>
            <li><a href="index.html#features">Features</a></li>
            <li class="nav-dropdown-wrap">
                <a href="#" class="nav-dropdown-trigger">Download &#9660;</a>
                <ul class="nav-dropdown">
                    <li><a href="#" class="nav-dropdown-item nav-dropdown-disabled">Steam Workshop<span class="nav-dd-soon">Soon</span></a></li>
                    <li><a href="devlog.html" class="nav-dropdown-item">Devlog</a></li>
                </ul>
            </li>
        </ul>
    </nav>

<div class="drop-zone" id="dropZone">&#9660; Rilascia regions_status.json</div>
<header>
  <h1>&#9998; REGION EDITOR</h1>
  <button class="hbtn" onclick="loadFile()">&#128194; Carica JSON</button>
  <button class="hbtn" onclick="saveFile()">&#128190; Salva JSON</button>
  <button class="hbtn danger" onclick="resetAll()">&#8635; Reset tutto</button>
  <span class="hint">Trascina regions_status.json qui &mdash; o usa Carica</span>
  <input type="file" id="fileInput" accept=".json" style="display:none" onchange="onFileInput(this)">
</header>
<div class="toolbar">
  <input id="search" type="text" placeholder="Cerca regione…" oninput="filterTable(this.value)">
  <button class="tb-btn active" id="fAll"  onclick="setFilter('all')">Tutte</button>
  <button class="tb-btn" id="fEd"  onclick="setFilter('edited')">&#9998; Editate</button>
  <button class="tb-btn" id="fPo"  onclick="setFilter('porto')">&#9875; Porto</button>
  <button class="tb-btn" id="fTodo" onclick="setFilter('todo')">&#9744; Da fare</button>
  <span class="stats" id="stats"></span>
</div>
<div class="wrap">
<table id="tbl">
  <thead>
    <tr>
      <th>Regione</th>
      <th>Chiave</th>
      <th class="center">&#9998; Editata</th>
      <th class="center">&#9875; Porto</th>
    </tr>
  </thead>
  <tbody id="tbody"></tbody>
</table>
</div>

<script>
'use strict';
let DATA = {};
let filterMode = 'all';

/* ── Load / Save ─────────────────────────────────── */
function loadFile(){document.getElementById('fileInput').click();}
function onFileInput(inp){
  const f=inp.files[0]; if(!f)return;
  const r=new FileReader();
  r.onload=e=>{try{DATA=JSON.parse(e.target.result);render();}catch(ex){alert('JSON non valido: '+ex);}};
  r.readAsText(f);
  inp.value='';
}

function saveFile(){
  // Sync DOM → DATA before saving
  for(const tr of document.getElementById('tbody').rows){
    const key=tr.dataset.key;
    if(!key||!DATA[key])continue;
    DATA[key].edited=tr.querySelector('.chk-ed').checked;
    DATA[key].porto =tr.querySelector('.chk-po').checked;
  }
  const blob=new Blob([JSON.stringify(DATA,null,2)],{type:'application/json'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download='regions_status.json';
  a.click();
  URL.revokeObjectURL(a.href);
}

function resetAll(){
  if(!confirm('Azzerare tutti i flag?'))return;
  for(const k of Object.keys(DATA)){DATA[k].edited=false;DATA[k].porto=false;}
  render();
}

/* ── Render ──────────────────────────────────────── */
function render(){
  const tbody=document.getElementById('tbody');
  tbody.innerHTML='';
  for(const [key,reg] of Object.entries(DATA)){
    const tr=document.createElement('tr');
    tr.dataset.key=key;
    tr.dataset.name=reg.name.toLowerCase();
    tr.dataset.edited=reg.edited?'1':'0';
    tr.dataset.porto =reg.porto ?'1':'0';
    tr.innerHTML=
      `<td class="name-cell">${reg.name}</td>`+
      `<td class="key-cell">${key}</td>`+
      `<td class="chk-cell"><input type="checkbox" class="chk chk-ed"${reg.edited?' checked':''} onchange="onChange(this,'edited')"></td>`+
      `<td class="chk-cell"><input type="checkbox" class="chk chk-po"${reg.porto?' checked':''} onchange="onChange(this,'porto')"></td>`;
    tbody.appendChild(tr);
  }
  applyFilter();
  updateStats();
}

function onChange(chk, field){
  const tr=chk.closest('tr');
  const key=tr.dataset.key;
  const val=chk.checked;
  DATA[key][field]=val;
  tr.dataset[field]=val?'1':'0';
  applyFilter();
  updateStats();
}

/* ── Filter ──────────────────────────────────────── */
let searchQ='';
function filterTable(q){searchQ=q.toLowerCase();applyFilter();}
function setFilter(m){
  filterMode=m;
  ['fAll','fEd','fPo','fTodo'].forEach(id=>document.getElementById(id).classList.remove('active'));
  document.getElementById({all:'fAll',edited:'fEd',porto:'fPo',todo:'fTodo'}[m]).classList.add('active');
  applyFilter();
}

function applyFilter(){
  for(const tr of document.getElementById('tbody').rows){
    let show=true;
    if(searchQ&&!tr.dataset.name.includes(searchQ))show=false;
    if(show){
      if(filterMode==='edited'&&tr.dataset.edited!=='1')show=false;
      if(filterMode==='porto' &&tr.dataset.porto !=='1')show=false;
      if(filterMode==='todo'  &&(tr.dataset.edited==='1'||tr.dataset.porto==='1'))show=false;
    }
    tr.classList.toggle('hidden',!show);
  }
  updateStats();
}

function updateStats(){
  const all=Object.keys(DATA).length;
  const ed=Object.values(DATA).filter(r=>r.edited).length;
  const po=Object.values(DATA).filter(r=>r.porto).length;
  document.getElementById('stats').innerHTML=
    `${all} regioni &nbsp;&#183;&nbsp; `+
    `<span style="color:#C5B358">${ed} editate</span> &nbsp;&#183;&nbsp; `+
    `<span style="color:#5ab4e0">${po} porti</span>`;
}

/* ── Drag & drop ─────────────────────────────────── */
const dz=document.getElementById('dropZone');
document.addEventListener('dragover',e=>{e.preventDefault();dz.classList.add('active');});
document.addEventListener('dragleave',e=>{if(!e.relatedTarget)dz.classList.remove('active');});
document.addEventListener('drop',e=>{
  e.preventDefault();dz.classList.remove('active');
  const f=e.dataTransfer.files[0];
  if(!f||!f.name.endsWith('.json'))return;
  const r=new FileReader();
  r.onload=ev=>{try{DATA=JSON.parse(ev.target.result);render();}catch(ex){alert('JSON non valido');}};
  r.readAsText(f);
});

updateStats();
</script>
</body>
</html>
