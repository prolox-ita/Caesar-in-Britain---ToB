<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VMD Viewer</title>
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background: #111;
            color: #bbb;
            font-family: 'Consolas', 'Courier New', monospace;
            font-size: 12px;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        header {
            padding: 7px 14px;
            background: #1a1a1a;
            border-bottom: 1px solid #C5B358;
            display: flex;
            align-items: center;
            gap: 16px;
            flex-shrink: 0;
        }
        header h1 { font-size: 0.8rem; letter-spacing: 0.18em; color: #C5B358; font-weight: normal; }
        .hint { font-size: 0.68rem; color: #4a4a4a; }

        .columns { display: flex; flex: 1; overflow: hidden; }

        .col {
            flex: 1;
            display: flex;
            flex-direction: column;
            border-right: 1px solid #222;
            min-width: 0;
        }
        .col:last-child { border-right: none; }

        .col-head { padding: 7px 12px; background: #161616; border-bottom: 1px solid #222; flex-shrink: 0; }
        .col-head-title { font-size: 0.68rem; letter-spacing: 0.14em; color: #C5B358; text-transform: uppercase; }
        .col-head-sub { font-size: 0.6rem; color: #444; margin-top: 2px; }

        .col-body { flex: 1; overflow-y: auto; padding: 3px 0; }
        .col-body::-webkit-scrollbar { width: 3px; }
        .col-body::-webkit-scrollbar-track { background: #111; }
        .col-body::-webkit-scrollbar-thumb { background: #2a2a2a; border-radius: 2px; }

        /* ── Tree ─────────────────────────────────────── */
        .folder { user-select: none; }
        .folder-label {
            display: flex; align-items: center; gap: 5px;
            padding: 3px 10px; cursor: pointer; color: #666; white-space: nowrap;
        }
        .folder-label:hover { background: rgba(255,255,255,0.03); }
        .folder-arrow { font-size: 8px; color: #444; transition: transform 0.12s; flex-shrink: 0; width: 10px; }
        .folder.open > .folder-label > .folder-arrow { transform: rotate(90deg); }
        .folder-children { display: none; }
        .folder.open > .folder-children { display: block; }

        /* ── Items ────────────────────────────────────── */
        .item {
            padding: 3px 10px;
            cursor: pointer;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            color: #999;
            border-left: 2px solid transparent;
            transition: background 0.08s;
        }
        .item:hover { background: rgba(255,255,255,0.04); }

        /* Unused: dimmed + ⊘ suffix */
        .item.unused { color: #555; }
        .item.unused::after { content: ' ⊘'; color: #333; font-size: 10px; }

        .item.selected {
            color: #fff;
            background: rgba(139, 0, 0, 0.22);
            border-left-color: #8B0000;
        }
        .item.selected.unused::after { color: rgba(255,255,255,0.2); }

        .item.connected {
            color: #F5E6BE;
            background: rgba(197, 179, 88, 0.1);
            border-left-color: #C5B358;
        }

        /* ── SVG overlay ──────────────────────────────── */
        #svg-overlay {
            position: fixed; top: 0; left: 0;
            width: 100vw; height: 100vh;
            pointer-events: none; z-index: 9999;
        }
    </style>
</head>
<body>

<header>
    <h1>&#9876; VMD VIEWER</h1>
    <span class="hint">
        Click: seleziona &nbsp;·&nbsp; Ctrl+Click: aggiungi/rimuovi &nbsp;·&nbsp;
        Shift+Click: seleziona intervallo &nbsp;·&nbsp; ⊘ = non utilizzato
    </span>
</header>

<div class="columns">
    <div class="col">
        <div class="col-head">
            <div class="col-head-title">Models</div>
            <div class="col-head-sub">.variantmesh — mesh files</div>
        </div>
        <div class="col-body" id="col-models"></div>
    </div>
    <div class="col">
        <div class="col-head">
            <div class="col-head-title">Definitions</div>
            <div class="col-head-sub">.variantmeshdefinition — unit VMDs</div>
        </div>
        <div class="col-body" id="col-vmds"></div>
    </div>
    <div class="col">
        <div class="col-head">
            <div class="col-head-title">Variants</div>
            <div class="col-head-sub">.variantmeshdefinition — faction / unit variants</div>
        </div>
        <div class="col-body" id="col-variants"></div>
    </div>
</div>

<svg id="svg-overlay"></svg>

<script>
'use strict';

// ═══════════════════════════════════════════════════════════════════════
//  DATA  —  sostituire con i propri dati reali
//
//  MODELS_TREE   : mappa "percorso/cartella" → array di filename
//  CENTER_VMDS   : array di VMD centrali
//    - id, folder, file
//    - models      : array di percorsi completi dei .variantmesh usati
//    - in_variants : array di id dei RIGHT_VMDS che lo contengono
//  RIGHT_VMDS    : array di VMD destra (una sola cartella specifica)
//    - id, file
//    - vmds        : array di id dei CENTER_VMDS contenuti
// ═══════════════════════════════════════════════════════════════════════

const MODELS_TREE = {
    "units/roman/infantry": [
        "legionary.variantmesh",
        "praetorian.variantmesh",
        "cohort_veterans.variantmesh",
        "militia_levy.variantmesh"          // ← non usato in alcun VMD
    ],
    "units/roman/cavalry": [
        "equites.variantmesh",
        "ala_sociorum.variantmesh"
    ],
    "units/britannic/infantry": [
        "warrior_tribe.variantmesh",
        "noble_warrior.variantmesh",
        "skirmisher.variantmesh"            // ← non usato in alcun VMD
    ],
    "units/britannic/chariot": [
        "charioteer.variantmesh"
    ]
};

const CENTER_VMDS = [
    {
        id: "vmd_legionary",
        folder: "units/roman/infantry",
        file: "legionary.variantmeshdefinition",
        models: ["units/roman/infantry/legionary.variantmesh"],
        in_variants: ["var_rome", "var_rome_56bce"]
    },
    {
        id: "vmd_praetorian",
        folder: "units/roman/infantry",
        file: "praetorian.variantmeshdefinition",
        models: [
            "units/roman/infantry/praetorian.variantmesh",
            "units/roman/infantry/cohort_veterans.variantmesh"
        ],
        in_variants: ["var_rome"]
    },
    {
        id: "vmd_signifier",
        folder: "units/roman/infantry",
        file: "signifier.variantmeshdefinition",     // ← non contenuto in alcuna variante
        models: ["units/roman/infantry/legionary.variantmesh"],
        in_variants: []
    },
    {
        id: "vmd_equites",
        folder: "units/roman/cavalry",
        file: "equites.variantmeshdefinition",
        models: ["units/roman/cavalry/equites.variantmesh"],
        in_variants: ["var_rome", "var_rome_56bce"]
    },
    {
        id: "vmd_ala",
        folder: "units/roman/cavalry",
        file: "ala_sociorum.variantmeshdefinition",  // ← non contenuto in alcuna variante
        models: ["units/roman/cavalry/ala_sociorum.variantmesh"],
        in_variants: []
    },
    {
        id: "vmd_warrior",
        folder: "units/britannic",
        file: "warrior.variantmeshdefinition",
        models: [
            "units/britannic/infantry/warrior_tribe.variantmesh",
            "units/britannic/infantry/noble_warrior.variantmesh"
        ],
        in_variants: ["var_britannia"]
    },
    {
        id: "vmd_charioteer",
        folder: "units/britannic",
        file: "charioteer.variantmeshdefinition",
        models: ["units/britannic/chariot/charioteer.variantmesh"],
        in_variants: ["var_britannia"]
    }
];

const RIGHT_VMDS = [
    {
        id: "var_rome",
        file: "rome_faction.variantmeshdefinition",
        vmds: ["vmd_legionary", "vmd_praetorian", "vmd_equites"]
    },
    {
        id: "var_rome_56bce",
        file: "rome_56bce.variantmeshdefinition",
        vmds: ["vmd_legionary", "vmd_equites"]
    },
    {
        id: "var_britannia",
        file: "britannia_faction.variantmeshdefinition",
        vmds: ["vmd_warrior", "vmd_charioteer"]
    }
];

// ═══════════════════════════════════════════════════════════════════════
//  PRE-CALCOLO ELEMENTI NON UTILIZZATI
// ═══════════════════════════════════════════════════════════════════════
const usedModelPaths = new Set(CENTER_VMDS.flatMap(v => v.models));
const usedVmdIds     = new Set(RIGHT_VMDS.flatMap(v => v.vmds));

// ═══════════════════════════════════════════════════════════════════════
//  MAPPE ELEMENTI & LISTE PER COLONNA (per shift+click)
// ═══════════════════════════════════════════════════════════════════════
const modelMap   = new Map(); // modelPath  → element
const vmdMap     = new Map(); // vmd.id     → element
const variantMap = new Map(); // variant.id → element

// Tutti gli item in ordine DOM, per colonna
const colItems = { 'col-models': [], 'col-vmds': [], 'col-variants': [] };

// ═══════════════════════════════════════════════════════════════════════
//  RENDER
// ═══════════════════════════════════════════════════════════════════════
function buildTree(flatMap) {
    const root = {};
    for (const [path, files] of Object.entries(flatMap)) {
        const parts = path.split('/');
        let node = root;
        for (const part of parts) {
            if (!node[part]) node[part] = { files: [], sub: {} };
            node = node[part].sub;
        }
        let cur = root;
        for (let i = 0; i < parts.length; i++) {
            if (i === parts.length - 1) cur[parts[i]].files = files;
            else cur = cur[parts[i]].sub;
        }
    }
    return root;
}

function renderTree(node, parent, depth, pathSoFar) {
    for (const [name, data] of Object.entries(node)) {
        const fullPath = pathSoFar ? `${pathSoFar}/${name}` : name;
        const padFolder = 8 + depth * 14;
        const padFile   = padFolder + 18;

        const folderEl = mk('div', 'folder open');
        const labelEl  = mk('div', 'folder-label');
        labelEl.style.paddingLeft = padFolder + 'px';
        labelEl.innerHTML = `<span class="folder-arrow">&#9654;</span><span style="opacity:.4;margin-right:3px">&#128193;</span>${name}/`;
        labelEl.onclick = () => folderEl.classList.toggle('open');
        folderEl.appendChild(labelEl);

        const childrenEl = mk('div', 'folder-children');
        if (Object.keys(data.sub).length) renderTree(data.sub, childrenEl, depth + 1, fullPath);

        for (const file of data.files) {
            const mp     = `${fullPath}/${file}`;
            const unused = !usedModelPaths.has(mp);
            const el = mk('div', 'item' + (unused ? ' unused' : ''));
            el.style.paddingLeft = padFile + 'px';
            el.textContent  = file;
            el.title        = mp + (unused ? '\n⊘ Non utilizzato da nessun VMD' : '');
            el.dataset.mp   = mp;
            el.dataset.col  = 'col-models';
            el.addEventListener('click', e => { e.stopPropagation(); handleClick(el, e); });
            childrenEl.appendChild(el);
            modelMap.set(mp, el);
            colItems['col-models'].push(el);
        }

        folderEl.appendChild(childrenEl);
        parent.appendChild(folderEl);
    }
}

function renderCenterVmds() {
    const body = document.getElementById('col-vmds');
    const byFolder = {};
    for (const vmd of CENTER_VMDS) (byFolder[vmd.folder] ??= []).push(vmd);

    for (const [folder, vmds] of Object.entries(byFolder)) {
        const folderEl = mk('div', 'folder open');
        const labelEl  = mk('div', 'folder-label');
        labelEl.style.paddingLeft = '8px';
        labelEl.innerHTML = `<span class="folder-arrow">&#9654;</span><span style="opacity:.4;margin-right:3px">&#128193;</span>${folder}/`;
        labelEl.onclick = () => folderEl.classList.toggle('open');
        folderEl.appendChild(labelEl);

        const childrenEl = mk('div', 'folder-children');
        for (const vmd of vmds) {
            const unused = !usedVmdIds.has(vmd.id);
            const el = mk('div', 'item' + (unused ? ' unused' : ''));
            el.style.paddingLeft = '26px';
            el.textContent     = vmd.file;
            el.title           = `${vmd.folder}/${vmd.file}` + (unused ? '\n⊘ Non contenuto in alcuna variante' : '');
            el.dataset.vmdId   = vmd.id;
            el.dataset.col     = 'col-vmds';
            el.addEventListener('click', e => { e.stopPropagation(); handleClick(el, e); });
            childrenEl.appendChild(el);
            vmdMap.set(vmd.id, el);
            colItems['col-vmds'].push(el);
        }

        folderEl.appendChild(childrenEl);
        body.appendChild(folderEl);
    }
}

function renderRightVmds() {
    const body = document.getElementById('col-variants');
    for (const v of RIGHT_VMDS) {
        const el = mk('div', 'item');
        el.style.paddingLeft    = '12px';
        el.textContent          = v.file;
        el.title                = v.file;
        el.dataset.variantId    = v.id;
        el.dataset.col          = 'col-variants';
        el.addEventListener('click', e => { e.stopPropagation(); handleClick(el, e); });
        body.appendChild(el);
        variantMap.set(v.id, el);
        colItems['col-variants'].push(el);
    }
}

// ═══════════════════════════════════════════════════════════════════════
//  CONNESSIONI
// ═══════════════════════════════════════════════════════════════════════
function getConnectionEls(el) {
    const result = [];
    if (el.dataset.mp) {
        // Model → VMD centrali che lo usano
        CENTER_VMDS
            .filter(v => v.models.includes(el.dataset.mp))
            .forEach(v => { const e = vmdMap.get(v.id); if (e) result.push(e); });

    } else if (el.dataset.vmdId) {
        // VMD centrale → model usati + varianti che lo contengono
        const vmd = CENTER_VMDS.find(v => v.id === el.dataset.vmdId);
        if (vmd) {
            vmd.models.forEach(mp => { const e = modelMap.get(mp);   if (e) result.push(e); });
            vmd.in_variants.forEach(id => { const e = variantMap.get(id); if (e) result.push(e); });
        }

    } else if (el.dataset.variantId) {
        // Variante destra → VMD centrali contenuti
        const v = RIGHT_VMDS.find(v => v.id === el.dataset.variantId);
        if (v) v.vmds.forEach(id => { const e = vmdMap.get(id); if (e) result.push(e); });
    }
    return result;
}

// ═══════════════════════════════════════════════════════════════════════
//  STATO SELEZIONE
// ═══════════════════════════════════════════════════════════════════════
const selectedEls      = new Set();
const lastClickedInCol = new Map(); // colId → ultimo elemento cliccato

function handleClick(el, e) {
    const colId = el.dataset.col;

    if (e.shiftKey) {
        // Seleziona intervallo di elementi visibili nella stessa colonna
        const last = lastClickedInCol.get(colId);
        if (last && last !== el) {
            const visible = colItems[colId].filter(i => i.getBoundingClientRect().height > 0);
            const i1 = visible.indexOf(last);
            const i2 = visible.indexOf(el);
            if (i1 !== -1 && i2 !== -1) {
                const lo = Math.min(i1, i2), hi = Math.max(i1, i2);
                for (let i = lo; i <= hi; i++) selectedEls.add(visible[i]);
            } else {
                selectedEls.add(el);
            }
        } else {
            selectedEls.add(el);
            lastClickedInCol.set(colId, el);
        }
        // lastClickedInCol non cambia con shift (comportamento standard)

    } else if (e.ctrlKey || e.metaKey) {
        // Toggle elemento
        if (selectedEls.has(el)) selectedEls.delete(el);
        else                     selectedEls.add(el);
        lastClickedInCol.set(colId, el);

    } else {
        // Click normale: deseleziona se già unico selezionato
        if (selectedEls.size === 1 && selectedEls.has(el)) {
            selectedEls.clear();
        } else {
            selectedEls.clear();
            selectedEls.add(el);
        }
        lastClickedInCol.set(colId, el);
    }

    applySelection();
}

function applySelection() {
    // Rimuovi classi precedenti
    document.querySelectorAll('.item.selected, .item.connected')
        .forEach(el => el.classList.remove('selected', 'connected'));
    document.getElementById('svg-overlay').innerHTML = '';

    if (!selectedEls.size) return;

    // Calcola unione connessioni (esclusi gli elementi già selezionati)
    const connectedSet = new Set();
    for (const sel of selectedEls) {
        sel.classList.add('selected');
        getConnectionEls(sel).forEach(c => { if (!selectedEls.has(c)) connectedSet.add(c); });
    }

    for (const el of connectedSet) {
        el.classList.add('connected');
        for (let p = el.parentElement; p; p = p.parentElement) {
            if (p.classList.contains('folder')) p.classList.add('open');
        }
        el.scrollIntoView({ block: 'nearest' });
    }

    drawArrows(connectedSet);
}

// ═══════════════════════════════════════════════════════════════════════
//  FRECCE SVG
// ═══════════════════════════════════════════════════════════════════════
function drawArrows(connectedSet) {
    const svg = document.getElementById('svg-overlay');
    svg.innerHTML = `
        <defs>
            <marker id="ah" markerWidth="7" markerHeight="7" refX="6.5" refY="3.5" orient="auto">
                <polygon points="0 0,7 3.5,0 7" fill="#C5B358" fill-opacity=".7"/>
            </marker>
        </defs>`;

    for (const selEl of selectedEls) {
        const sr = selEl.getBoundingClientRect();
        if (sr.height === 0) continue;
        const sy = (sr.top + sr.bottom) / 2;

        const conns = getConnectionEls(selEl).filter(e => connectedSet.has(e));
        for (const cel of conns) {
            const cr = cel.getBoundingClientRect();
            if (cr.height === 0) continue;

            const cy      = (cr.top + cr.bottom) / 2;
            const goRight = cr.left > sr.right - 4;
            const goLeft  = cr.right < sr.left + 4;
            if (!goRight && !goLeft) continue;

            const x1 = goRight ? sr.right : sr.left;
            const x2 = goRight ? cr.left  : cr.right;
            const mx = (x1 + x2) / 2;

            const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
            path.setAttribute('d', `M${x1},${sy} C${mx},${sy} ${mx},${cy} ${x2},${cy}`);
            path.setAttribute('stroke', '#C5B358');
            path.setAttribute('stroke-width', '1.2');
            path.setAttribute('stroke-opacity', '.5');
            path.setAttribute('fill', 'none');
            path.setAttribute('marker-end', 'url(#ah)');
            svg.appendChild(path);
        }
    }
}

function redrawArrows() {
    if (!selectedEls.size) return;
    drawArrows(new Set(document.querySelectorAll('.item.connected')));
}

['col-models', 'col-vmds', 'col-variants'].forEach(id => {
    document.getElementById(id).addEventListener('scroll', redrawArrows, { passive: true });
});
window.addEventListener('resize', redrawArrows);

document.querySelector('.columns').addEventListener('click', e => {
    if (!e.target.closest('.item')) {
        selectedEls.clear();
        lastClickedInCol.clear();
        applySelection();
    }
});

// ═══════════════════════════════════════════════════════════════════════
//  UTILS & INIT
// ═══════════════════════════════════════════════════════════════════════
function mk(tag, cls) {
    const el = document.createElement(tag);
    if (cls) el.className = cls;
    return el;
}

renderTree(buildTree(MODELS_TREE), document.getElementById('col-models'), 0, '');
renderCenterVmds();
renderRightVmds();
</script>
</body>
</html>
