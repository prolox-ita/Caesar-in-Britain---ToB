<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VMD Viewer</title>
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background: #111;
            color: #bbb;
            font-family: 'Consolas', 'Courier New', monospace;
            font-size: 12px;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* ── Header ─────────────────────────────────────── */
        header {
            padding: 7px 14px;
            background: #1a1a1a;
            border-bottom: 1px solid #C5B358;
            display: flex;
            align-items: center;
            gap: 16px;
            flex-shrink: 0;
        }
        header h1 {
            font-size: 0.8rem;
            letter-spacing: 0.18em;
            color: #C5B358;
            font-weight: normal;
        }
        .hint { font-size: 0.68rem; color: #4a4a4a; }

        /* ── Columns ─────────────────────────────────────── */
        .columns { display: flex; flex: 1; overflow: hidden; }

        .col {
            flex: 1;
            display: flex;
            flex-direction: column;
            border-right: 1px solid #222;
            min-width: 0;
        }
        .col:last-child { border-right: none; }

        .col-head {
            padding: 7px 12px;
            background: #161616;
            border-bottom: 1px solid #222;
            flex-shrink: 0;
        }
        .col-head-title {
            font-size: 0.68rem;
            letter-spacing: 0.14em;
            color: #C5B358;
            text-transform: uppercase;
        }
        .col-head-sub { font-size: 0.6rem; color: #444; margin-top: 2px; }

        .col-body { flex: 1; overflow-y: auto; padding: 3px 0; }
        .col-body::-webkit-scrollbar { width: 3px; }
        .col-body::-webkit-scrollbar-track { background: #111; }
        .col-body::-webkit-scrollbar-thumb { background: #2a2a2a; border-radius: 2px; }

        /* ── Tree folders ────────────────────────────────── */
        .folder { user-select: none; }

        .folder-label {
            display: flex;
            align-items: center;
            gap: 5px;
            padding: 3px 10px;
            cursor: pointer;
            color: #666;
            white-space: nowrap;
        }
        .folder-label:hover { background: rgba(255,255,255,0.03); }

        .folder-arrow {
            font-size: 8px;
            color: #444;
            transition: transform 0.12s;
            flex-shrink: 0;
            width: 10px;
        }
        .folder.open > .folder-label > .folder-arrow { transform: rotate(90deg); }

        .folder-children { display: none; }
        .folder.open > .folder-children { display: block; }

        /* ── Items ───────────────────────────────────────── */
        .item {
            padding: 3px 10px;
            cursor: pointer;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            color: #999;
            border-left: 2px solid transparent;
            transition: background 0.08s;
        }
        .item:hover { background: rgba(255,255,255,0.04); }

        .item.selected {
            color: #fff;
            background: rgba(139, 0, 0, 0.22);
            border-left-color: #8B0000;
        }
        .item.connected {
            color: #F5E6BE;
            background: rgba(197, 179, 88, 0.1);
            border-left-color: #C5B358;
        }

        /* ── SVG arrows overlay ──────────────────────────── */
        #svg-overlay {
            position: fixed;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            pointer-events: none;
            z-index: 9999;
        }
    </style>
</head>
<body>

<header>
    <h1>&#9876; VMD VIEWER</h1>
    <span class="hint">Click an item to show connections · Click again or on background to deselect</span>
</header>

<div class="columns">
    <div class="col">
        <div class="col-head">
            <div class="col-head-title">Models</div>
            <div class="col-head-sub">.variantmesh — mesh files</div>
        </div>
        <div class="col-body" id="col-models"></div>
    </div>
    <div class="col">
        <div class="col-head">
            <div class="col-head-title">Definitions</div>
            <div class="col-head-sub">.variantmeshdefinition — unit VMDs</div>
        </div>
        <div class="col-body" id="col-vmds"></div>
    </div>
    <div class="col">
        <div class="col-head">
            <div class="col-head-title">Variants</div>
            <div class="col-head-sub">.variantmeshdefinition — faction/variant VMDs</div>
        </div>
        <div class="col-body" id="col-variants"></div>
    </div>
</div>

<svg id="svg-overlay"></svg>

<script>
'use strict';

// ═══════════════════════════════════════════════════════════════════════
//  DATA  —  sostituire con i propri dati reali
//
//  MODELS_TREE:
//    Mappa "percorso/cartella" → array di nomi file .variantmesh
//    Può essere profonda quanto serve, viene resa come albero gerarchico.
//
//  CENTER_VMDS:
//    Array di oggetti VMD (colonna centrale).
//    - id:          identificatore univoco (stringa)
//    - folder:      percorso della cartella in cui si trova
//    - file:        nome del file .variantmeshdefinition
//    - models:      array di percorsi completi dei .variantmesh che usa
//    - in_variants: array di id dei RIGHT_VMDS che lo contengono
//
//  RIGHT_VMDS:
//    Array di oggetti VMD (colonna destra — una sola cartella specifica).
//    - id:   identificatore univoco
//    - file: nome del file .variantmeshdefinition
//    - vmds: array di id dei CENTER_VMDS che contiene
// ═══════════════════════════════════════════════════════════════════════

const MODELS_TREE = {
    "units/roman/infantry": [
        "legionary.variantmesh",
        "praetorian.variantmesh",
        "cohort_veterans.variantmesh"
    ],
    "units/roman/cavalry": [
        "equites.variantmesh",
        "ala_sociorum.variantmesh"
    ],
    "units/britannic/infantry": [
        "warrior_tribe.variantmesh",
        "noble_warrior.variantmesh"
    ],
    "units/britannic/chariot": [
        "charioteer.variantmesh"
    ]
};

const CENTER_VMDS = [
    {
        id: "vmd_legionary",
        folder: "units/roman/infantry",
        file: "legionary.variantmeshdefinition",
        models: [
            "units/roman/infantry/legionary.variantmesh"
        ],
        in_variants: ["var_rome", "var_rome_56bce"]
    },
    {
        id: "vmd_praetorian",
        folder: "units/roman/infantry",
        file: "praetorian.variantmeshdefinition",
        models: [
            "units/roman/infantry/praetorian.variantmesh",
            "units/roman/infantry/cohort_veterans.variantmesh"
        ],
        in_variants: ["var_rome"]
    },
    {
        id: "vmd_equites",
        folder: "units/roman/cavalry",
        file: "equites.variantmeshdefinition",
        models: [
            "units/roman/cavalry/equites.variantmesh"
        ],
        in_variants: ["var_rome", "var_rome_56bce"]
    },
    {
        id: "vmd_warrior",
        folder: "units/britannic",
        file: "warrior.variantmeshdefinition",
        models: [
            "units/britannic/infantry/warrior_tribe.variantmesh",
            "units/britannic/infantry/noble_warrior.variantmesh"
        ],
        in_variants: ["var_britannia"]
    },
    {
        id: "vmd_charioteer",
        folder: "units/britannic",
        file: "charioteer.variantmeshdefinition",
        models: [
            "units/britannic/chariot/charioteer.variantmesh"
        ],
        in_variants: ["var_britannia"]
    }
];

const RIGHT_VMDS = [
    {
        id: "var_rome",
        file: "rome_faction.variantmeshdefinition",
        vmds: ["vmd_legionary", "vmd_praetorian", "vmd_equites"]
    },
    {
        id: "var_rome_56bce",
        file: "rome_56bce.variantmeshdefinition",
        vmds: ["vmd_legionary", "vmd_equites"]
    },
    {
        id: "var_britannia",
        file: "britannia_faction.variantmeshdefinition",
        vmds: ["vmd_warrior", "vmd_charioteer"]
    }
];

// ═══════════════════════════════════════════════════════════════════════
//  ELEMENT MAPS  (costruite durante il render)
// ═══════════════════════════════════════════════════════════════════════
const modelMap   = new Map(); // "percorso/file.variantmesh" → elemento DOM
const vmdMap     = new Map(); // vmd.id    → elemento DOM
const variantMap = new Map(); // variant.id → elemento DOM

// ═══════════════════════════════════════════════════════════════════════
//  TREE BUILDER
// ═══════════════════════════════════════════════════════════════════════
function buildTree(flatMap) {
    const root = {};
    for (const [path, files] of Object.entries(flatMap)) {
        const parts = path.split('/');
        // Crea i nodi lungo il percorso
        let node = root;
        for (const part of parts) {
            if (!node[part]) node[part] = { files: [], sub: {} };
            node = node[part].sub;
        }
        // Assegna i file al nodo foglia
        let cur = root;
        for (let i = 0; i < parts.length; i++) {
            if (i === parts.length - 1) cur[parts[i]].files = files;
            else cur = cur[parts[i]].sub;
        }
    }
    return root;
}

function renderTree(node, parent, depth, pathSoFar) {
    for (const [name, data] of Object.entries(node)) {
        const fullPath = pathSoFar ? `${pathSoFar}/${name}` : name;
        const padFolder = 8 + depth * 14;
        const padFile   = padFolder + 18;

        const folderEl = mk('div', 'folder open');

        const labelEl = mk('div', 'folder-label');
        labelEl.style.paddingLeft = padFolder + 'px';
        labelEl.innerHTML = `<span class="folder-arrow">&#9654;</span><span style="opacity:.4;margin-right:3px">&#128193;</span>${name}/`;
        labelEl.onclick = () => folderEl.classList.toggle('open');
        folderEl.appendChild(labelEl);

        const childrenEl = mk('div', 'folder-children');

        // Sotto-cartelle
        if (Object.keys(data.sub).length) {
            renderTree(data.sub, childrenEl, depth + 1, fullPath);
        }

        // File
        for (const file of data.files) {
            const mp = `${fullPath}/${file}`;
            const el = mk('div', 'item');
            el.style.paddingLeft = padFile + 'px';
            el.textContent = file;
            el.title = mp;
            el.dataset.mp = mp;
            el.onclick = e => { e.stopPropagation(); onModelClick(el); };
            childrenEl.appendChild(el);
            modelMap.set(mp, el);
        }

        folderEl.appendChild(childrenEl);
        parent.appendChild(folderEl);
    }
}

function renderCenterVmds() {
    const body = document.getElementById('col-vmds');
    const byFolder = {};
    for (const vmd of CENTER_VMDS) {
        (byFolder[vmd.folder] ??= []).push(vmd);
    }
    for (const [folder, vmds] of Object.entries(byFolder)) {
        const folderEl = mk('div', 'folder open');

        const labelEl = mk('div', 'folder-label');
        labelEl.style.paddingLeft = '8px';
        labelEl.innerHTML = `<span class="folder-arrow">&#9654;</span><span style="opacity:.4;margin-right:3px">&#128193;</span>${folder}/`;
        labelEl.onclick = () => folderEl.classList.toggle('open');
        folderEl.appendChild(labelEl);

        const childrenEl = mk('div', 'folder-children');
        for (const vmd of vmds) {
            const el = mk('div', 'item');
            el.style.paddingLeft = '26px';
            el.textContent = vmd.file;
            el.title = `${vmd.folder}/${vmd.file}`;
            el.onclick = e => { e.stopPropagation(); onVmdClick(vmd, el); };
            childrenEl.appendChild(el);
            vmdMap.set(vmd.id, el);
        }

        folderEl.appendChild(childrenEl);
        body.appendChild(folderEl);
    }
}

function renderRightVmds() {
    const body = document.getElementById('col-variants');
    for (const v of RIGHT_VMDS) {
        const el = mk('div', 'item');
        el.style.paddingLeft = '12px';
        el.textContent = v.file;
        el.title = v.file;
        el.onclick = e => { e.stopPropagation(); onVariantClick(v, el); };
        body.appendChild(el);
        variantMap.set(v.id, el);
    }
}

// ═══════════════════════════════════════════════════════════════════════
//  STATO & SELEZIONE
// ═══════════════════════════════════════════════════════════════════════
let activeEl = null;
const highlighted = [];

function reset() {
    if (activeEl) activeEl.classList.remove('selected');
    highlighted.forEach(el => el.classList.remove('connected'));
    highlighted.length = 0;
    activeEl = null;
    document.getElementById('svg-overlay').innerHTML = '';
}

function connect(el) {
    if (!el) return;
    el.classList.add('connected');
    highlighted.push(el);
    // Espandi le cartelle parent se collassate
    for (let p = el.parentElement; p; p = p.parentElement) {
        if (p.classList.contains('folder')) p.classList.add('open');
    }
    el.scrollIntoView({ block: 'nearest' });
}

function onVmdClick(vmd, el) {
    if (activeEl === el) { reset(); return; }
    reset();
    activeEl = el;
    el.classList.add('selected');
    vmd.models.forEach(mp => connect(modelMap.get(mp)));
    vmd.in_variants.forEach(id => connect(variantMap.get(id)));
    drawArrows();
}

function onModelClick(el) {
    if (activeEl === el) { reset(); return; }
    reset();
    activeEl = el;
    el.classList.add('selected');
    const mp = el.dataset.mp;
    CENTER_VMDS
        .filter(v => v.models.includes(mp))
        .forEach(v => connect(vmdMap.get(v.id)));
    drawArrows();
}

function onVariantClick(variant, el) {
    if (activeEl === el) { reset(); return; }
    reset();
    activeEl = el;
    el.classList.add('selected');
    variant.vmds.forEach(id => connect(vmdMap.get(id)));
    drawArrows();
}

// ═══════════════════════════════════════════════════════════════════════
//  FRECCE SVG
// ═══════════════════════════════════════════════════════════════════════
function drawArrows() {
    const svg = document.getElementById('svg-overlay');
    svg.innerHTML = `
        <defs>
            <marker id="ah" markerWidth="7" markerHeight="7" refX="6.5" refY="3.5" orient="auto">
                <polygon points="0 0,7 3.5,0 7" fill="#C5B358" fill-opacity=".7"/>
            </marker>
        </defs>`;
    if (!activeEl || !highlighted.length) return;

    const sr = activeEl.getBoundingClientRect();
    const sy = (sr.top + sr.bottom) / 2;

    for (const cel of highlighted) {
        const cr = cel.getBoundingClientRect();
        if (cr.height === 0) continue; // elemento in cartella collassata

        const cy = (cr.top + cr.bottom) / 2;
        const goRight = cr.left > sr.right - 4;
        const goLeft  = cr.right < sr.left + 4;
        if (!goRight && !goLeft) continue; // stessa colonna

        const x1 = goRight ? sr.right : sr.left;
        const x2 = goRight ? cr.left  : cr.right;
        const mx = (x1 + x2) / 2;

        const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
        path.setAttribute('d', `M${x1},${sy} C${mx},${sy} ${mx},${cy} ${x2},${cy}`);
        path.setAttribute('stroke', '#C5B358');
        path.setAttribute('stroke-width', '1.2');
        path.setAttribute('stroke-opacity', '.5');
        path.setAttribute('fill', 'none');
        path.setAttribute('marker-end', 'url(#ah)');
        svg.appendChild(path);
    }
}

// Ridisegna allo scroll di ogni colonna e al resize
['col-models', 'col-vmds', 'col-variants'].forEach(id => {
    document.getElementById(id).addEventListener('scroll', drawArrows, { passive: true });
});
window.addEventListener('resize', drawArrows);

// Deseleziona cliccando sul background
document.querySelector('.columns').addEventListener('click', e => {
    if (!e.target.closest('.item')) reset();
});

// ═══════════════════════════════════════════════════════════════════════
//  UTILS & INIT
// ═══════════════════════════════════════════════════════════════════════
function mk(tag, cls) {
    const el = document.createElement(tag);
    if (cls) el.className = cls;
    return el;
}

renderTree(buildTree(MODELS_TREE), document.getElementById('col-models'), 0, '');
renderCenterVmds();
renderRightVmds();
</script>
</body>
</html>
