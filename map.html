<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Campaign Map - Medieval Kingdoms 1212 AD</title>
    <link rel="stylesheet" href="styles.css">
    <link
        href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700;900&family=Merriweather:wght@300;400;700&display=swap"
        rel="stylesheet">
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background: #1a1410;
        }

        .map-container {
            display: flex;
            width: 100vw;
            height: 100vh;
            position: relative;
        }

        .map-area {
            flex: 1;
            position: relative;
            overflow: auto;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #1a1410;
            padding: 20px;
        }

        .map-wrapper {
            position: relative;
            display: inline-block;
        }

        .map-image {
            max-width: 90vw;
            max-height: 90vh;
            display: block;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
            border: 3px solid #d4af37;
            border-radius: 8px;
        }

        #interactiveSvg {
            position: absolute;
            top: 0;
            left: 0;
            cursor: pointer;
            border-radius: 8px;
            pointer-events: all;
        }

        .region-polygon {
            fill: rgba(212, 175, 55, 0);
            stroke: rgba(212, 175, 55, 0);
            stroke-width: 0;
            stroke-linejoin: round;
            stroke-linecap: round;
            transition: fill 0.3s ease, stroke 0.3s ease, filter 0.3s ease;
            cursor: pointer;
        }

        .region-polygon:hover {
            fill: rgba(255, 255, 255, 0.3);
            stroke: rgba(255, 255, 255, 1.0);
            stroke-width: 20;
            filter: drop-shadow(0 0 10px rgba(255, 255, 255, 0.8));
        }

        .region-polygon.selected {
            fill: rgba(212, 175, 55, 0.45);
            stroke: rgba(212, 175, 55, 1.0);
            stroke-width: 28;
            filter: drop-shadow(0 0 15px rgba(212, 175, 55, 1.0));
        }

        .info-panel {
            width: 350px;
            background: linear-gradient(135deg, rgba(245, 241, 232, 0.98), rgba(232, 220, 196, 0.98));
            backdrop-filter: blur(10px);
            box-shadow: -5px 0 20px rgba(0, 0, 0, 0.3);
            padding: 30px;
            overflow-y: auto;
            border-left: 3px solid #d4af37;
        }

        .info-panel.empty {
            display: flex;
            align-items: center;
            justify-content: center;
            color: #8a7a5f;
            font-style: italic;
        }

        .info-panel h2 {
            font-family: 'Cinzel', serif;
            font-size: 2rem;
            color: #5a4a2f;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 2px solid #d4af37;
        }

        .info-content {
            font-size: 1.1rem;
            color: #4a3a25;
            line-height: 1.8;
        }

        .region-details {
            margin-top: 20px;
        }

        .detail-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 0;
            border-bottom: 1px solid rgba(212, 175, 55, 0.2);
        }

        .detail-row:last-child {
            border-bottom: none;
        }

        .detail-label {
            font-weight: 600;
            color: #5a4a2f;
            font-size: 0.95rem;
        }

        .detail-value {
            color: #6a5a3f;
            font-size: 0.95rem;
            font-style: italic;
        }

        .back-button {
            position: absolute;
            top: 20px;
            left: 20px;
            background: linear-gradient(135deg, #d4af37, #b8962e);
            color: white;
            padding: 12px 25px;
            border: none;
            border-radius: 8px;
            font-family: 'Cinzel', serif;
            font-size: 1rem;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
            transition: all 0.3s ease;
            z-index: 1000;
            text-decoration: none;
            display: inline-block;
        }

        .back-button:hover {
            background: linear-gradient(135deg, #b8962e, #d4af37);
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.4);
        }
    </style>
</head>

<body>
    <a href="index.html" class="back-button">← Back to Home</a>

    <div class="map-container">
        <div class="map-area">
            <div class="map-wrapper" id="mapWrapper">
                <img src="map.png" alt="Campaign Map" class="map-image" id="mapImage">
                <svg id="interactiveSvg" xmlns="http://www.w3.org/2000/svg"></svg>
            </div>
        </div>
        <div class="info-panel empty" id="infoPanel">
            <p>Click on a region to view information</p>
        </div>
    </div>

    <script src="regions_data.js"></script>
    <script>
        const mapImage = document.getElementById('mapImage');
        const interactiveSvg = document.getElementById('interactiveSvg');
        const infoPanel = document.getElementById('infoPanel');

        const REFERENCE_WIDTH = 4800;
        const REFERENCE_HEIGHT = 3404;

        let selectedPolygon = null;

        // Wait for map image to load
        mapImage.onload = function() {
            initializeRegions();
        };

        // If image is already loaded (from cache), initialize immediately
        if (mapImage.complete) {
            initializeRegions();
        }

        function initializeRegions() {
            const displayWidth = mapImage.offsetWidth;
            const displayHeight = mapImage.offsetHeight;

            console.log(`Image dimensions: ${displayWidth}x${displayHeight}`);
            console.log(`Regions loaded: ${typeof regions !== 'undefined' ? regions.length : 'NOT LOADED'}`);

            if (typeof regions === 'undefined' || regions.length === 0) {
                console.error('Regions data not loaded!');
                return;
            }

            // Set SVG dimensions to match displayed image exactly
            interactiveSvg.setAttribute('width', displayWidth);
            interactiveSvg.setAttribute('height', displayHeight);
            interactiveSvg.setAttribute('viewBox', `0 0 ${REFERENCE_WIDTH} ${REFERENCE_HEIGHT}`);

            // Clear any existing polygons
            interactiveSvg.innerHTML = '';

            let totalPolygons = 0;

            // Create region groups with multiple polygons
            regions.forEach((region, index) => {
                // Create a group for this region (to handle multiple polygons as one)
                const group = document.createElementNS('http://www.w3.org/2000/svg', 'g');
                group.setAttribute('class', 'region-group');
                group.setAttribute('data-region-name', region.name);
                group.setAttribute('data-region-color', region.color);
                group.setAttribute('data-region-id', index);

                // Create a polygon for each shape in this region
                region.polygons.forEach((coords) => {
                    const polygon = document.createElementNS('http://www.w3.org/2000/svg', 'polygon');
                    polygon.setAttribute('points', coords);
                    polygon.setAttribute('class', 'region-polygon');
                    group.appendChild(polygon);
                    totalPolygons++;
                });

                // Add event listeners to the group
                group.addEventListener('click', function(e) {
                    e.stopPropagation();
                    selectRegion(this, region);
                });

                interactiveSvg.appendChild(group);
            });

            console.log(`✓ Initialized ${regions.length} regions (${totalPolygons} polygons)`);
            console.log(`✓ SVG viewBox: 0 0 ${REFERENCE_WIDTH} ${REFERENCE_HEIGHT}`);
            console.log(`✓ SVG display size: ${displayWidth}x${displayHeight}`);
            console.log(`✓ Image size: ${mapImage.offsetWidth}x${mapImage.offsetHeight}`);
            console.log(`✓ Groups created: ${interactiveSvg.querySelectorAll('g').length}`);
        }

        function selectRegion(groupElement, region) {
            console.log(`🖱️ Region clicked: ${region.name} (${region.color})`);

            // Deselect previous region
            if (selectedPolygon) {
                const previousPolygons = selectedPolygon.querySelectorAll('.region-polygon');
                previousPolygons.forEach(p => p.classList.remove('selected'));
            }

            // Select new region - add 'selected' class to all polygons in the group
            selectedPolygon = groupElement;
            const polygons = groupElement.querySelectorAll('.region-polygon');
            polygons.forEach(p => p.classList.add('selected'));

            // Show region info
            showRegionInfo(region);
        }

        function showRegionInfo(region) {
            infoPanel.classList.remove('empty');
            infoPanel.innerHTML = `
                <h2>${region.name}</h2>
                <div class="info-content">
                    <div style="margin-bottom: 20px;">
                        <div style="display: flex; align-items: center; gap: 10px;">
                            <span style="display: inline-block; width: 40px; height: 40px; background: ${region.color}; border: 2px solid #8b7355; border-radius: 4px;"></span>
                            <span style="font-family: monospace; font-size: 1.1rem;">${region.color}</span>
                        </div>
                    </div>

                    <div class="region-details">
                        <div class="detail-row">
                            <span class="detail-label">Region Key:</span>
                            <span class="detail-value">—</span>
                        </div>
                        <div class="detail-row">
                            <span class="detail-label">Owner:</span>
                            <span class="detail-value">—</span>
                        </div>
                        <div class="detail-row">
                            <span class="detail-label">Number of Slots:</span>
                            <span class="detail-value">—</span>
                        </div>
                        <div class="detail-row">
                            <span class="detail-label">Port:</span>
                            <span class="detail-value">—</span>
                        </div>
                        <div class="detail-row">
                            <span class="detail-label">Rebel Faction:</span>
                            <span class="detail-value">—</span>
                        </div>
                        <div class="detail-row">
                            <span class="detail-label">Alternative Rebel Faction:</span>
                            <span class="detail-value">—</span>
                        </div>
                        <div class="detail-row">
                            <span class="detail-label">Religion:</span>
                            <span class="detail-value">—</span>
                        </div>
                        <div class="detail-row">
                            <span class="detail-label">Is Capital:</span>
                            <span class="detail-value">—</span>
                        </div>
                    </div>
                </div>
            `;
        }
    </script>

</body>

</html>
