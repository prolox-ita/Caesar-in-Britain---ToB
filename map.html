<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Campaign Map - Medieval Kingdoms 1212 AD</title>
    <link rel="stylesheet" href="styles.css">
    <link
        href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700;900&family=Merriweather:wght@300;400;700&display=swap"
        rel="stylesheet">
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background: #1a1410;
        }

        .map-container {
            display: flex;
            width: 100vw;
            height: 100vh;
            position: relative;
        }

        .map-area {
            flex: 1;
            position: relative;
            overflow: auto;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #1a1410;
            padding: 20px;
        }

        .map-image {
            max-width: 90%;
            max-height: 90vh;
            display: block;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
            border: 3px solid #d4af37;
            border-radius: 8px;
        }

        .info-panel {
            width: 350px;
            background: linear-gradient(135deg, rgba(245, 241, 232, 0.98), rgba(232, 220, 196, 0.98));
            backdrop-filter: blur(10px);
            box-shadow: -5px 0 20px rgba(0, 0, 0, 0.3);
            padding: 30px;
            overflow-y: auto;
            border-left: 3px solid #d4af37;
        }

        .info-panel.empty {
            display: flex;
            align-items: center;
            justify-content: center;
            color: #8a7a5f;
            font-style: italic;
        }

        .info-panel h2 {
            font-family: 'Cinzel', serif;
            font-size: 2rem;
            color: #5a4a2f;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 2px solid #d4af37;
        }

        .info-content {
            font-size: 1.1rem;
            color: #4a3a25;
            line-height: 1.8;
        }

        .back-button {
            position: absolute;
            top: 20px;
            left: 20px;
            background: linear-gradient(135deg, #d4af37, #b8962e);
            color: white;
            padding: 12px 25px;
            border: none;
            border-radius: 8px;
            font-family: 'Cinzel', serif;
            font-size: 1rem;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
            transition: all 0.3s ease;
            z-index: 1000;
            text-decoration: none;
            display: inline-block;
        }

        .back-button:hover {
            background: linear-gradient(135deg, #b8962e, #d4af37);
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.4);
        }
    </style>
</head>

<body>
    <a href="index.html" class="back-button">← Back to Home</a>

    <div class="map-container">
        <div class="map-area">
            <img src="map.png" alt="Campaign Map" class="map-image">
        </div>
        <div class="info-panel empty" id="infoPanel">
            <p>Click on a region to view information</p>
        </div>
    </div>

</body>

</html>
