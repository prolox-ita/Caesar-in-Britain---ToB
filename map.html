<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Campaign Map - Medieval Kingdoms 1212 AD</title>
    <link rel="stylesheet" href="styles.css">
    <link
        href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700;900&family=Merriweather:wght@300;400;700&display=swap"
        rel="stylesheet">
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background: #1a1410;
        }

        .map-container {
            display: flex;
            width: 100vw;
            height: 100vh;
            position: relative;
        }

        .map-area {
            flex: 1;
            position: relative;
            overflow: auto;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #1a1410;
            padding: 20px;
        }

        .map-wrapper {
            position: relative;
            display: inline-block;
        }

        .map-image {
            max-width: 90vw;
            max-height: 90vh;
            display: block;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
            border: 3px solid #d4af37;
            border-radius: 8px;
        }

        #interactiveCanvas {
            position: absolute;
            top: 0;
            left: 0;
            cursor: pointer;
            border-radius: 8px;
        }

        #regionCanvas {
            display: none;
        }

        .info-panel {
            width: 350px;
            background: linear-gradient(135deg, rgba(245, 241, 232, 0.98), rgba(232, 220, 196, 0.98));
            backdrop-filter: blur(10px);
            box-shadow: -5px 0 20px rgba(0, 0, 0, 0.3);
            padding: 30px;
            overflow-y: auto;
            border-left: 3px solid #d4af37;
        }

        .info-panel.empty {
            display: flex;
            align-items: center;
            justify-content: center;
            color: #8a7a5f;
            font-style: italic;
        }

        .info-panel h2 {
            font-family: 'Cinzel', serif;
            font-size: 2rem;
            color: #5a4a2f;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 2px solid #d4af37;
        }

        .info-content {
            font-size: 1.1rem;
            color: #4a3a25;
            line-height: 1.8;
        }

        .back-button {
            position: absolute;
            top: 20px;
            left: 20px;
            background: linear-gradient(135deg, #d4af37, #b8962e);
            color: white;
            padding: 12px 25px;
            border: none;
            border-radius: 8px;
            font-family: 'Cinzel', serif;
            font-size: 1rem;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
            transition: all 0.3s ease;
            z-index: 1000;
            text-decoration: none;
            display: inline-block;
        }

        .back-button:hover {
            background: linear-gradient(135deg, #b8962e, #d4af37);
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.4);
        }
    </style>
</head>

<body>
    <a href="index.html" class="back-button">← Back to Home</a>

    <div class="map-container">
        <div class="map-area">
            <div class="map-wrapper">
                <img src="map.png" alt="Campaign Map" class="map-image" id="mapImage">
                <canvas id="interactiveCanvas"></canvas>
            </div>
            <canvas id="regionCanvas"></canvas>
        </div>
        <div class="info-panel empty" id="infoPanel">
            <p>Click on a region to view information</p>
        </div>
    </div>

    <script>
        const mapImage = document.getElementById('mapImage');
        const interactiveCanvas = document.getElementById('interactiveCanvas');
        const regionCanvas = document.getElementById('regionCanvas');
        const interactiveCtx = interactiveCanvas.getContext('2d');
        const regionCtx = regionCanvas.getContext('2d', { willReadFrequently: true });
        const infoPanel = document.getElementById('infoPanel');

        let regionImage = new Image();
        let regionMap = new Map();
        let selectedRegion = null;
        let hoveredRegion = null;
        let regionCounter = 0;
        let isInitialized = false;

        // Wait for map image to load
        mapImage.onload = function() {
            // Set canvas dimensions to match displayed image
            const rect = mapImage.getBoundingClientRect();
            interactiveCanvas.width = mapImage.naturalWidth;
            interactiveCanvas.height = mapImage.naturalHeight;
            interactiveCanvas.style.width = mapImage.width + 'px';
            interactiveCanvas.style.height = mapImage.height + 'px';

            regionCanvas.width = mapImage.naturalWidth;
            regionCanvas.height = mapImage.naturalHeight;

            // Load region reference
            regionImage.crossOrigin = "anonymous";
            regionImage.onload = initializeRegions;
            regionImage.onerror = () => console.error('Failed to load region_reference.png');
            regionImage.src = 'region_reference.png';
        };

        function initializeRegions() {
            try {
                // Draw region reference to hidden canvas
                regionCtx.drawImage(regionImage, 0, 0, regionCanvas.width, regionCanvas.height);

                // Analyze regions
                analyzeRegions();

                isInitialized = true;
                console.log(`Initialized ${regionMap.size} regions`);

                // Add event listeners
                interactiveCanvas.addEventListener('mousemove', handleMouseMove);
                interactiveCanvas.addEventListener('click', handleClick);
                interactiveCanvas.addEventListener('mouseleave', handleMouseLeave);
            } catch (error) {
                console.error('Error initializing regions:', error);
            }
        }

        function analyzeRegions() {
            const imageData = regionCtx.getImageData(0, 0, regionCanvas.width, regionCanvas.height);
            const pixels = imageData.data;
            const processedColors = new Set();

            // Sample every 20th pixel for speed
            for (let i = 0; i < pixels.length; i += (4 * 20)) {
                const r = pixels[i];
                const g = pixels[i + 1];
                const b = pixels[i + 2];
                const a = pixels[i + 3];

                if (a < 128 || isBlackOrNearBlack(r, g, b)) continue;

                const colorKey = `${r},${g},${b}`;

                if (!processedColors.has(colorKey)) {
                    processedColors.add(colorKey);
                    regionCounter++;
                    regionMap.set(colorKey, {
                        id: regionCounter,
                        name: `Area ${regionCounter}`,
                        color: { r, g, b }
                    });
                }
            }
        }

        function isBlackOrNearBlack(r, g, b) {
            return r < 30 && g < 30 && b < 30;
        }

        function getRegionAtPoint(x, y) {
            // Scale coordinates to canvas size
            const scaleX = regionCanvas.width / interactiveCanvas.offsetWidth;
            const scaleY = regionCanvas.height / interactiveCanvas.offsetHeight;
            const canvasX = Math.floor(x * scaleX);
            const canvasY = Math.floor(y * scaleY);

            const pixel = regionCtx.getImageData(canvasX, canvasY, 1, 1).data;
            const r = pixel[0];
            const g = pixel[1];
            const b = pixel[2];
            const a = pixel[3];

            if (a < 128 || isBlackOrNearBlack(r, g, b)) return null;

            const colorKey = `${r},${g},${b}`;
            return regionMap.get(colorKey) || null;
        }

        function handleMouseMove(e) {
            if (!isInitialized) return;

            const rect = interactiveCanvas.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;

            const region = getRegionAtPoint(x, y);

            if (region !== hoveredRegion) {
                hoveredRegion = region;
                drawOverlay();
            }
        }

        function handleClick(e) {
            if (!isInitialized) return;

            const rect = interactiveCanvas.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;

            const region = getRegionAtPoint(x, y);

            if (region) {
                selectedRegion = region;
                showRegionInfo(region);
                drawOverlay();
            }
        }

        function handleMouseLeave() {
            if (hoveredRegion && hoveredRegion !== selectedRegion) {
                hoveredRegion = null;
                drawOverlay();
            }
        }

        function drawOverlay() {
            // Clear canvas
            interactiveCtx.clearRect(0, 0, interactiveCanvas.width, interactiveCanvas.height);

            // Draw selected region
            if (selectedRegion) {
                drawRegionHighlight(selectedRegion, 'rgba(255, 255, 255, 0.25)', 'rgba(255, 255, 255, 1.0)', 4);
            }

            // Draw hovered region (if different from selected)
            if (hoveredRegion && hoveredRegion !== selectedRegion) {
                drawRegionHighlight(hoveredRegion, 'rgba(255, 255, 255, 0.15)', 'rgba(255, 255, 255, 1.0)', 3);
            }
        }

        function drawRegionHighlight(region, fillColor, borderColor, borderWidth) {
            const imageData = regionCtx.getImageData(0, 0, regionCanvas.width, regionCanvas.height);
            const pixels = imageData.data;
            const width = regionCanvas.width;
            const height = regionCanvas.height;

            // Create temporary canvas for this region
            const tempCanvas = document.createElement('canvas');
            tempCanvas.width = width;
            tempCanvas.height = height;
            const tempCtx = tempCanvas.getContext('2d');
            const tempImageData = tempCtx.createImageData(width, height);

            // Fill region pixels
            for (let i = 0; i < pixels.length; i += 4) {
                const r = pixels[i];
                const g = pixels[i + 1];
                const b = pixels[i + 2];
                const a = pixels[i + 3];

                if (r === region.color.r && g === region.color.g && b === region.color.b && a >= 128) {
                    tempImageData.data[i] = 255;
                    tempImageData.data[i + 1] = 255;
                    tempImageData.data[i + 2] = 255;
                    tempImageData.data[i + 3] = 76; // Semi-transparent white
                }
            }

            tempCtx.putImageData(tempImageData, 0, 0);
            interactiveCtx.drawImage(tempCanvas, 0, 0);

            // Draw borders
            interactiveCtx.strokeStyle = borderColor;
            interactiveCtx.lineWidth = borderWidth;

            // Find border pixels
            for (let y = 0; y < height; y += 2) { // Skip every other pixel for performance
                for (let x = 0; x < width; x += 2) {
                    const idx = (y * width + x) * 4;
                    const r = pixels[idx];
                    const g = pixels[idx + 1];
                    const b = pixels[idx + 2];
                    const a = pixels[idx + 3];

                    if (r === region.color.r && g === region.color.g && b === region.color.b && a >= 128) {
                        if (isBorderPixel(x, y, region, pixels, width, height)) {
                            interactiveCtx.fillStyle = borderColor;
                            interactiveCtx.fillRect(x, y, 2, 2);
                        }
                    }
                }
            }
        }

        function isBorderPixel(x, y, region, pixels, width, height) {
            const directions = [[-1, 0], [1, 0], [0, -1], [0, 1]];

            for (const [dx, dy] of directions) {
                const nx = x + dx;
                const ny = y + dy;

                if (nx < 0 || nx >= width || ny < 0 || ny >= height) return true;

                const idx = (ny * width + nx) * 4;
                const r = pixels[idx];
                const g = pixels[idx + 1];
                const b = pixels[idx + 2];
                const a = pixels[idx + 3];

                if (a < 128 || r !== region.color.r || g !== region.color.g || b !== region.color.b) {
                    return true;
                }
            }

            return false;
        }

        function showRegionInfo(region) {
            infoPanel.classList.remove('empty');
            infoPanel.innerHTML = `
                <h2>${region.name}</h2>
            `;
        }
    </script>

</body>

</html>
