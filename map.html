<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Campaign Map - Medieval Kingdoms 1212 AD</title>
    <link rel="stylesheet" href="styles.css">
    <link
        href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700;900&family=Merriweather:wght@300;400;700&display=swap"
        rel="stylesheet">
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background: #1a1410;
        }

        .map-container {
            display: flex;
            width: 100vw;
            height: 100vh;
            position: relative;
        }

        .map-area {
            flex: 1;
            position: relative;
            overflow: auto;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #1a1410;
            padding: 20px;
        }

        .map-wrapper {
            position: relative;
            display: inline-block;
        }

        .map-image {
            max-width: 90vw;
            max-height: 90vh;
            display: block;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
            border: 3px solid #d4af37;
            border-radius: 8px;
        }

        #interactiveSvg {
            position: absolute;
            top: 0;
            left: 0;
            cursor: pointer;
            border-radius: 8px;
            pointer-events: all;
        }

        .region-polygon {
            fill: rgba(255, 255, 255, 0);
            stroke: rgba(255, 255, 255, 0);
            stroke-width: 0;
            stroke-linejoin: round;
            stroke-linecap: round;
            transition: fill 0.3s ease, stroke 0.3s ease, filter 0.3s ease;
        }

        .region-polygon:hover {
            fill: rgba(255, 255, 255, 0.15);
            stroke: rgba(255, 255, 255, 1.0);
            stroke-width: 20;
            filter: drop-shadow(0 0 8px rgba(255, 255, 255, 0.8))
                    drop-shadow(0 0 15px rgba(255, 255, 255, 0.4));
        }

        .region-polygon.selected {
            fill: rgba(255, 255, 255, 0.25);
            stroke: rgba(255, 255, 255, 1.0);
            stroke-width: 28;
            filter: drop-shadow(0 0 12px rgba(255, 255, 255, 0.9))
                    drop-shadow(0 0 20px rgba(255, 255, 255, 0.5));
        }

        .info-panel {
            width: 350px;
            background: linear-gradient(135deg, rgba(245, 241, 232, 0.98), rgba(232, 220, 196, 0.98));
            backdrop-filter: blur(10px);
            box-shadow: -5px 0 20px rgba(0, 0, 0, 0.3);
            padding: 30px;
            overflow-y: auto;
            border-left: 3px solid #d4af37;
        }

        .info-panel.empty {
            display: flex;
            align-items: center;
            justify-content: center;
            color: #8a7a5f;
            font-style: italic;
        }

        .info-panel h2 {
            font-family: 'Cinzel', serif;
            font-size: 2rem;
            color: #5a4a2f;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 2px solid #d4af37;
        }

        .info-content {
            font-size: 1.1rem;
            color: #4a3a25;
            line-height: 1.8;
        }

        .back-button {
            position: absolute;
            top: 20px;
            left: 20px;
            background: linear-gradient(135deg, #d4af37, #b8962e);
            color: white;
            padding: 12px 25px;
            border: none;
            border-radius: 8px;
            font-family: 'Cinzel', serif;
            font-size: 1rem;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
            transition: all 0.3s ease;
            z-index: 1000;
            text-decoration: none;
            display: inline-block;
        }

        .back-button:hover {
            background: linear-gradient(135deg, #b8962e, #d4af37);
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.4);
        }
    </style>
</head>

<body>
    <a href="index.html" class="back-button">← Back to Home</a>

    <div class="map-container">
        <div class="map-area">
            <div class="map-wrapper" id="mapWrapper">
                <img src="map.png" alt="Campaign Map" class="map-image" id="mapImage">
                <svg id="interactiveSvg" xmlns="http://www.w3.org/2000/svg"></svg>
            </div>
        </div>
        <div class="info-panel empty" id="infoPanel">
            <p>Click on a region to view information</p>
        </div>
    </div>

    <script>
        const mapImage = document.getElementById('mapImage');
        const interactiveSvg = document.getElementById('interactiveSvg');
        const infoPanel = document.getElementById('infoPanel');

        // Region definitions (coordinates from region_reference.png which is 4800x3404)
        const regions = [
            {
                name: "No-Go Region",
                coords: "-6,2616,32,2590,138,2569,214,2476,651,2399,681,2408,973,2336,1236,2382,1427,2476,1758,2535,2033,2497,2135,2442,2428,2488,2500,2543,2500,2590,2483,2649,2500,2726,2563,2772,2584,2844,2601,2963,2648,3086,2763,3226,2860,3319,2945,3370,3064,3379,3136,3374,3369,3391,3420,3336,3670,3268,3717,3222,3751,3251,3763,3340,3725,3400,2,3400"
            }
        ];

        const REFERENCE_WIDTH = 4800;
        const REFERENCE_HEIGHT = 3404;

        let selectedPolygon = null;

        // Wait for map image to load
        mapImage.onload = function() {
            initializeRegions();
        };

        function initializeRegions() {
            const displayWidth = mapImage.offsetWidth;
            const displayHeight = mapImage.offsetHeight;

            // Set SVG dimensions to match displayed image exactly
            interactiveSvg.style.width = displayWidth + 'px';
            interactiveSvg.style.height = displayHeight + 'px';
            interactiveSvg.setAttribute('width', displayWidth);
            interactiveSvg.setAttribute('height', displayHeight);
            interactiveSvg.setAttribute('viewBox', `0 0 ${REFERENCE_WIDTH} ${REFERENCE_HEIGHT}`);
            interactiveSvg.setAttribute('preserveAspectRatio', 'none');

            // Create polygon elements
            regions.forEach((region, index) => {
                const polygon = document.createElementNS('http://www.w3.org/2000/svg', 'polygon');
                polygon.setAttribute('points', region.coords);
                polygon.setAttribute('class', 'region-polygon');
                polygon.setAttribute('data-region-name', region.name);
                polygon.setAttribute('data-region-id', index);

                // Add event listeners
                polygon.addEventListener('click', function(e) {
                    e.stopPropagation();
                    selectRegion(this, region);
                });

                interactiveSvg.appendChild(polygon);
            });

            console.log(`Initialized ${regions.length} regions`);
            console.log(`SVG size: ${displayWidth}x${displayHeight}`);
            console.log(`Image size: ${mapImage.offsetWidth}x${mapImage.offsetHeight}`);
        }

        function selectRegion(polygonElement, region) {
            // Deselect previous region
            if (selectedPolygon) {
                selectedPolygon.classList.remove('selected');
            }

            // Select new region
            selectedPolygon = polygonElement;
            polygonElement.classList.add('selected');

            // Show region info
            showRegionInfo(region);
        }

        function showRegionInfo(region) {
            infoPanel.classList.remove('empty');
            infoPanel.innerHTML = `
                <h2>${region.name}</h2>
            `;
        }
    </script>

</body>

</html>
