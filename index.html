<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Caesars in Britain — A Total War: Thrones of Britannia Modification</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700;900&family=Merriweather:ital,wght@0,300;0,400;0,700;1,300&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --red:       #8b1a1a;
            --red-dark:  #5c0e0e;
            --red-mid:   #a52a2a;
            --gold:      #d4af37;
            --gold-dim:  #b8962e;
            --gold-pale: #f0d98a;
            --dark:      #100a04;
            --dark-mid:  #1e1208;
            --dark-warm: #2a1810;
            --stone:     #c4a882;
            --parchment: #f5edd8;
            --parch-mid: #ede0c4;
            --text-dark: #2e1f0e;
            --text-mid:  #5a3f28;
        }

        html { scroll-behavior: smooth; }

        body {
            font-family: 'Merriweather', serif;
            color: var(--text-dark);
            background: var(--dark);
            line-height: 1.7;
        }

        /* ── HERO ─────────────────────────────────────────────────────── */
        .hero {
            position: relative;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            overflow: hidden;
            background:
                linear-gradient(180deg, rgba(10,4,0,0.72) 0%, rgba(90,15,10,0.55) 50%, rgba(10,4,0,0.80) 100%),
                url('background_cib.jpg') center/cover no-repeat;
        }
        .hero::before, .hero::after {
            content: '';
            position: absolute;
            left: 0; right: 0; height: 4px;
            background: linear-gradient(to right, transparent, var(--gold), var(--red), var(--gold), transparent);
        }
        .hero::before { top: 0; }
        .hero::after  { bottom: 0; }

        .hero-badge {
            font-family: 'Cinzel', serif;
            font-size: 0.75rem; font-weight: 700;
            letter-spacing: 0.4em; color: var(--gold);
            text-transform: uppercase; margin-bottom: 24px;
            animation: fadeInDown 0.8s ease-out both;
        }
        .hero-title {
            font-family: 'Cinzel', serif;
            font-size: clamp(3rem, 9vw, 7.5rem); font-weight: 900;
            color: #fff; letter-spacing: 0.12em; line-height: 1.05;
            text-shadow: 0 2px 30px rgba(0,0,0,0.8), 0 0 60px rgba(180,30,20,0.4);
            margin-bottom: 8px;
            animation: fadeInDown 0.9s ease-out 0.1s both;
        }
        .hero-divider {
            display: flex; align-items: center; gap: 16px;
            justify-content: center; margin: 20px 0;
            animation: fadeIn 1s ease-out 0.3s both;
        }
        .hero-divider span {
            display: block; height: 2px; width: 80px;
            background: linear-gradient(to right, transparent, var(--gold));
        }
        .hero-divider span:last-child {
            background: linear-gradient(to left, transparent, var(--gold));
        }
        .hero-divider-icon { color: var(--gold); font-size: 1.2rem; }
        .hero-subtitle {
            font-family: 'Cinzel', serif;
            font-size: clamp(0.9rem, 2.5vw, 1.4rem);
            color: var(--parch-mid); letter-spacing: 0.25em;
            font-weight: 400; margin-bottom: 32px;
            animation: fadeIn 1s ease-out 0.4s both;
        }
        .hero-tagline {
            font-style: italic; font-size: clamp(1rem, 2.2vw, 1.35rem);
            color: rgba(245,237,216,0.9); font-weight: 300;
            max-width: 700px; line-height: 1.8;
            margin: 0 auto 48px;
            animation: fadeInUp 1s ease-out 0.5s both;
        }
        .hero-cta {
            display: flex; gap: 16px; flex-wrap: wrap; justify-content: center;
            animation: fadeInUp 1s ease-out 0.6s both;
        }
        .hero-scroll {
            position: absolute; bottom: 32px; left: 50%;
            transform: translateX(-50%);
            display: flex; flex-direction: column; align-items: center; gap: 8px;
            animation: fadeIn 1.5s ease-out 1.2s both;
        }
        .hero-scroll span {
            font-family: 'Cinzel', serif; font-size: 0.65rem;
            letter-spacing: 0.3em; color: rgba(212,175,55,0.6); text-transform: uppercase;
        }
        .hero-scroll-arrow {
            width: 22px; height: 22px;
            border-right: 2px solid rgba(212,175,55,0.5);
            border-bottom: 2px solid rgba(212,175,55,0.5);
            transform: rotate(45deg);
            animation: bounce 2s infinite;
        }

        /* ── BUTTONS ──────────────────────────────────────────────────── */
        .btn-primary {
            display: inline-block; padding: 14px 36px;
            background: linear-gradient(135deg, var(--red) 0%, var(--red-mid) 100%);
            color: #fff; font-family: 'Cinzel', serif; font-size: 0.95rem;
            font-weight: 700; letter-spacing: 0.12em; text-decoration: none;
            border: 2px solid rgba(212,175,55,0.4); border-radius: 3px;
            transition: all 0.3s ease; text-transform: uppercase; cursor: pointer;
        }
        .btn-primary:hover {
            background: linear-gradient(135deg, var(--red-mid) 0%, var(--red) 100%);
            border-color: var(--gold); box-shadow: 0 0 20px rgba(212,175,55,0.35);
            transform: translateY(-2px);
        }
        .btn-secondary {
            display: inline-block; padding: 14px 36px;
            background: transparent; color: var(--gold);
            font-family: 'Cinzel', serif; font-size: 0.95rem;
            font-weight: 700; letter-spacing: 0.12em; text-decoration: none;
            border: 2px solid var(--gold-dim); border-radius: 3px;
            transition: all 0.3s ease; text-transform: uppercase; cursor: pointer;
        }
        .btn-secondary:hover {
            background: rgba(212,175,55,0.1); border-color: var(--gold);
            box-shadow: 0 0 20px rgba(212,175,55,0.2); transform: translateY(-2px);
        }

        /* ── ANIMATIONS ───────────────────────────────────────────────── */
        @keyframes fadeInDown {
            from { opacity: 0; transform: translateY(-20px); }
            to   { opacity: 1; transform: translateY(0); }
        }
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to   { opacity: 1; transform: translateY(0); }
        }
        @keyframes fadeIn {
            from { opacity: 0; }
            to   { opacity: 1; }
        }
        @keyframes bounce {
            0%, 100% { transform: rotate(45deg) translateY(0); }
            50%       { transform: rotate(45deg) translateY(4px); }
        }

        /* ── RESPONSIVE ───────────────────────────────────────────────── */
        @media (max-width: 600px) {
            .hero-cta { flex-direction: column; align-items: center; }
            .btn-primary, .btn-secondary { width: 220px; text-align: center; }
        }
    </style>
</head>

<body>

<!-- ── HERO ──────────────────────────────────────────────────────────── -->
<header class="hero" id="home">
    <p class="hero-badge">A Total War: Thrones of Britannia Modification</p>
    <h1 class="hero-title">Caesars<br>in Britain</h1>
    <div class="hero-divider">
        <span></span>
        <span class="hero-divider-icon">&#9876;</span>
        <span></span>
    </div>
    <p class="hero-subtitle">SPQR · The Eagles Have Landed</p>
    <p class="hero-tagline">
        Rome marches north. The tribes of Britannia stand defiant.<br>
        Command legions, forge alliances, and decide the fate of an island
        on the edge of the known world.
    </p>
    <div class="hero-cta">
        <a href="https://steamcommunity.com/sharedfiles/filedetails/?id=2843452087" target="_blank" class="btn-primary">Steam Workshop</a>
        <a href="#about" class="btn-secondary">Discover the Mod</a>
    </div>
    <div class="hero-scroll">
        <span>Scroll</span>
        <div class="hero-scroll-arrow"></div>
    </div>
</header>

</body>
</html>
